function mkB(){var b=[];for(var y=0;y<ROWS;y++){b[y]=[];for(var x=0;x<COLS;x++)b[y][x]=null}return b}
function rot(m,d){var N=m.length,r=[];for(var y=0;y<N;y++){r[y]=[];for(var x=0;x<N;x++)r[y][x]=0}for(var y=0;y<N;y++)for(var x=0;x<N;x++){if(d===1)r[x][N-1-y]=m[y][x];else r[N-1-x][y]=m[y][x]}return r}
function col(b,p){for(var y=0;y<p.m.length;y++)for(var x=0;x<p.m[y].length;x++){if(!p.m[y][x])continue;var nx=p.x+x,ny=p.y+y;if(nx<0||nx>=COLS||ny>=ROWS)return true;if(ny>=0&&b[ny][nx])return true}return false}
function mrg(b,p){for(var y=0;y<p.m.length;y++)for(var x=0;x<p.m[y].length;x++)if(p.m[y][x]&&p.y+y>=0)b[p.y+y][p.x+x]=p.c}
function clrLines(){var cl=0;for(var y=ROWS-1;y>=0;y--){if(S.board[y].every(function(v){return v!==null})){S.board.splice(y,1);var row=[];for(var x=0;x<COLS;x++)row.push(null);S.board.unshift(row);cl++;y++}}if(cl>0){var pts=[0,100,300,500,800][cl]*S.level;S.score+=pts;S.lines+=cl;S.level=Math.floor(S.lines/10)+1;S.dropInt=Math.max(80,1000*Math.pow(0.85,S.level-1));S.stats['l'+cl]=(S.stats['l'+cl]||0)+1;if(cl===4){S.stats.tet++;S.stats.b2b++}else S.stats.b2b=0;S.combo++;if(S.combo>S.maxCombo)S.maxCombo=S.combo;if(S.combo>0)S.score+=50*S.combo*S.level;chkAch();if(S.score>best){best=S.score;localStorage.setItem('tg_best',best)}}else S.combo=-1;updHUD()}
function ghostY(p){var y=p.y;while(!col(S.board,{m:p.m,x:p.x,y:y+1,c:p.c}))y++;return y}
function shade(hex,p){var n=parseInt(hex.slice(1),16);var r=Math.max(0,Math.min(255,(n>>16)+p));var g=Math.max(0,Math.min(255,((n>>8)&255)+p));var b=Math.max(0,Math.min(255,(n&255)+p));return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0')}
function rBag(){var b=KEYS.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}S.bag=S.bag.concat(b)}
function spawn(){if(S.bag.length<2)rBag();var k=S.bag.shift();var s=SHAPES[k];S.cur={k:k,m:s.m.map(function(r){return r.slice()}),c:s.c,x:Math.floor((COLS-s.m[0].length)/2),y:0,rot:0};S.lockAcc=0;S.lockM=0;S.canHold=true;S.stats.pieces++;if(col(S.board,S.cur))gameOver();drawNext()}
function tryMv(dx,dy){var np={m:S.cur.m,x:S.cur.x+dx,y:S.cur.y+dy,c:S.cur.c};if(!col(S.board,np)){S.cur.x=np.x;S.cur.y=np.y;if(dy===0&&onGnd()){S.lockAcc=0;S.lockM++}return true}return false}

function onGnd(){return col(S.board,{m:S.cur.m,x:S.cur.x,y:S.cur.y+1,c:S.cur.c})}

function dCell(c,x,y,color,ghost){var px=x*CELL,py=y*CELL;if(ghost){c.fillStyle='rgba(255,255,255,0.08)';c.fillRect(px+1,py+1,CELL-2,CELL-2);c.strokeStyle=color;c.setLineDash([4,4]);c.lineWidth=1;c.strokeRect(px+1.5,py+1.5,CELL-3,CELL-3);c.setLineDash([])}else{var g=c.createLinearGradient(px,py,px+CELL,py+CELL);g.addColorStop(0,color);g.addColorStop(1,shade(color,-30));c.fillStyle=g;c.fillRect(px+1,py+1,CELL-2,CELL-2);c.fillStyle='rgba(255,255,255,0.25)';c.fillRect(px+1,py+1,CELL-2,3);c.fillRect(px+1,py+1,3,CELL-2);c.fillStyle='rgba(0,0,0,0.25)';c.fillRect(px+CELL-4,py+1,3,CELL-2);c.fillRect(px+1,py+CELL-4,CELL-2,3)}}

function dMini(c,cv,piece){c.fillStyle='#0b0f17';c.fillRect(0,0,cv.width,cv.height);if(!piece)return;var s=SHAPES[piece],m=s.m,minX=4,minY=4,maxX=0,maxY=0;for(var y=0;y<m.length;y++)for(var x=0;x<m[y].length;x++)if(m[y][x]){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)}var w=maxX-minX+1,h=maxY-minY+1,cs=24;var ox=(cv.width-w*cs)/2,oy=(cv.height-h*cs)/2;for(var y=0;y<m.length;y++)for(var x=0;x<m[y].length;x++)if(m[y][x]){var px=ox+(x-minX)*cs,py=oy+(y-minY)*cs;var g=c.createLinearGradient(px,py,px+cs,py+cs);g.addColorStop(0,s.c);g.addColorStop(1,shade(s.c,-30));c.fillStyle=g;c.fillRect(px+1,py+1,cs-2,cs-2);c.fillStyle='rgba(255,255,255,0.25)';c.fillRect(px+1,py+1,cs-2,2)}}

function renderAch(){var el=$('tg-ach-list');var html='';var cats={};for(var i=0;i<ACHS.length;i++){var a=ACHS[i];if(!cats[a.cat])cats[a.cat]=[];cats[a.cat].push(a)}var catOrder=['Линии','Очки','Уровни','Комбо','Тетрисы','Hold','Повороты','Игры','Специальные','Мастерство','Секретные'];for(var ci=0;ci<catOrder.length;ci++){var cat=catOrder[ci];if(!cats[cat])continue;html+='<div class="tg-ach-cat">'+cat+'</div>';for(var i=0;i<cats[cat].length;i++){var a=cats[cat][i],done=unlocked[a.id];html+='<div class="tg-ach-item'+(done?' done':'')+'"><div class="tg-ach-icon">'+a.ic+'</div><div class="tg-ach-info"><div class="tg-ach-name">'+a.nm+'</div><div class="tg-ach-desc">'+a.ds+'</div></div>'+(done?'<div class="tg-ach-check">✓</div>':'')+'</div>'}}el.innerHTML=html;var cnt=0;for(var i=0;i<ACHS.length;i++)if(unlocked[ACHS[i].id])cnt++;$('tg-ach-count').innerHTML='<b>'+cnt+'</b> / '+ACHS.length}
function chkAch(){for(var i=0;i<ACHS.length;i++){var a=ACHS[i];if(!unlocked[a.id]&&a.chk(S)){unlocked[a.id]=true;localStorage.setItem('tg_ach',JSON.stringify(unlocked));showToast('🏆 '+a.nm)}}}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(function(){toast.classList.remove('show')},2500)}
function loop(t){if(!S.running)return;var dt=t-S.last;S.last=t;if(!S.paused&&!S.over){S.dropAcc+=dt;var iv=S.soft?Math.min(50,S.dropInt):S.dropInt;if(S.dropAcc>=iv){S.dropAcc=0;if(!tryMv(0,1)){S.lockAcc+=iv;if(S.lockAcc>=S.lockD||S.lockM>=15)lockP()}else{S.lockAcc=0;if(S.soft)S.score+=1}}S.playTime+=dt/1000;S.totalPlayTime+=dt/1000;draw()}requestAnimationFrame(loop)}

var keys={},DAS_D=170,DAS_R=50,dasT=null,dasD=0;
function processKey(k){if(S.over||S.paused||!S.running)return;if(k==='ArrowLeft')tryMv(-1,0);else if(k==='ArrowRight')tryMv(1,0);else if(k==='ArrowDown'){S.soft=true;tryMv(0,1)}else if(k==='ArrowUp'||k==='x'||k==='X')tryRot(1);else if(k==='z'||k==='Z')tryRot(-1);else if(k==='c'||k==='C')doHold();else if(k===' ')hDrop()}

function showAdAndContinue(){
  // Скрываем overlay game over
  overlay.classList.remove('show');
  // Показываем рекламу
  adOverlay.classList.add('show');
  var timeLeft=5;
  adTimer.textContent=timeLeft;
  var adInterval=setInterval(function(){
    timeLeft--;
    adTimer.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(adInterval);
      adOverlay.classList.remove('show');
      // Очищаем поле, сохраняя очки/уровень/линии/статистику
      continueAfterAd();
    }
  },1000);
}

function continueAfterAd(){
  // Очищаем поле
  S.board=mkB();

  S.canHold=true;
  // Сбрасываем комбо
  S.combo=-1;
