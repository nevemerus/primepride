name: Update Product Prices

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install requests lxml
        
    - name: Run price update script
      env:
        GDESLON_API_TOKEN: ${{ secrets.GDESLON_API_TOKEN }}
      run: python scripts/update_prices.py
      
    - name: Commit and push changes
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add data/products.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update product prices [skip ci]"
        git push
