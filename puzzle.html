<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 Пазлы — Онлайн-игра</title>
    <style>
        /* ============================================
           СТИЛИ ИГРЫ
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left span {
            font-size: 28px;
        }

        .header-left h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 14px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
        }

        .btn-achievements {
            background: rgba(234,179,8,0.2);
            border: 1px solid rgba(234,179,8,0.3);
            border-radius: 8px;
            padding: 8px 14px;
            color: #fbbf24;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-achievements:hover {
            background: rgba(234,179,8,0.3);
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Canvas */
        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }

        #puzzleCanvas {
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
            cursor: grab;
        }

        #puzzleCanvas:active {
            cursor: grabbing;
        }

        /* Settings panel */
        .settings-panel {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
        }

        .settings-panel h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #a855f7;
        }

        .form-group select option {
            background: #1a1a2e;
            color: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .hint-box {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 16px;
        }

        .hint-box strong {
            color: #d1d5db;
            display: block;
            margin-bottom: 4px;
        }

        .hint-box ul {
            list-style: disc;
            padding-left: 20px;
        }

        .hint-box li {
            margin-bottom: 4px;
        }

        .btn-start {
            width: 100%;
            background: linear-gradient(to right, #9333ea, #db2777);
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-start:hover {
            background: linear-gradient(to right, #a855f7, #ec4899);
            transform: scale(1.02);
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-control {
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid;
            transition: all 0.2s;
        }

        .btn-pause {
            background: rgba(234,179,8,0.2);
            border-color: rgba(234,179,8,0.3);
            color: #fbbf24;
        }

        .btn-pause:hover {
            background: rgba(234,179,8,0.3);
        }

        .btn-pause.active {
            background: rgba(34,197,94,0.2);
            border-color: rgba(34,197,94,0.3);
            color: #4ade80;
        }

        .btn-reset {
            background: rgba(239,68,68,0.2);
            border-color: rgba(239,68,68,0.3);
            color: #f87171;
        }

        .btn-reset:hover {
            background: rgba(239,68,68,0.3);
        }

        .btn-settings {
            background: rgba(59,130,246,0.2);
            border-color: rgba(59,130,246,0.3);
            color: #60a5fa;
        }

        .btn-settings:hover {
            background: rgba(59,130,246,0.3);
        }

        /* Inline settings */
        .inline-settings {
            margin-top: 16px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px;
            max-width: 400px;
            width: 100%;
        }

        .inline-settings h3 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .btn-apply {
            width: 100%;
            background: #9333ea;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn-apply:hover {
            background: #a855f7;
        }

        /* Completion overlay */
        .completion-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.6);
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        .completion-box {
            text-align: center;
            padding: 32px;
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .completion-box .emoji {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .completion-box h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .completion-box p {
            color: #d1d5db;
            margin-bottom: 16px;
        }

        .completion-box .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .completion-box button {
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-new-game {
            background: linear-gradient(to right, #9333ea, #db2777);
            color: white;
        }

        .btn-new-game:hover {
            background: linear-gradient(to right, #a855f7, #ec4899);
        }

        .btn-to-settings {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }

        .btn-to-settings:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Achievement notification */
        .achievement-toast {
            position: fixed;
            top: 80px;
            right: 16px;
            z-index: 100;
            animation: slideIn 4s ease-in-out forwards;
        }

        .achievement-toast-inner {
            background: linear-gradient(to right, rgba(234,179,8,0.9), rgba(249,115,22,0.9));
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(250,204,21,0.5);
            max-width: 320px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .achievement-toast-inner .icon {
            font-size: 32px;
        }

        .achievement-toast-inner .label {
            font-size: 12px;
            color: #fef3c7;
        }

        .achievement-toast-inner .title {
            font-weight: 700;
            font-size: 14px;
        }

        .achievement-toast-inner .desc {
            font-size: 12px;
            color: #fef3c7;
        }

        @keyframes slideIn {
            0% { transform: translateX(120%); opacity: 0; }
            10% { transform: translateX(0); opacity: 1; }
            85% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(120%); opacity: 0; }
        }

        /* Achievements modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 16px;
        }

        .modal-box {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            max-width: 420px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: white;
        }

        .achievement-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .achievement-item.unlocked {
            background: rgba(234,179,8,0.1);
            border-color: rgba(234,179,8,0.3);
        }

        .achievement-item.locked {
            opacity: 0.5;
        }

        .achievement-item .ach-icon {
            font-size: 24px;
        }

        .achievement-item .ach-title {
            font-size: 14px;
            font-weight: 600;
        }

        .achievement-item .ach-desc {
            font-size: 12px;
            color: #9ca3af;
        }

        .achievement-item .ach-check {
            margin-left: auto;
            color: #4ade80;
            font-size: 14px;
        }

        /* Footer */
        .footer {
            padding: 10px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        /* Error message */
        .error-msg {
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.4);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fca5a5;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header {
                padding: 10px;
            }
            .stat-box {
                font-size: 13px;
                padding: 6px 10px;
            }
            .settings-panel {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
         HEADER
         ============================================ -->
    <header class="header">
        <div class="header-left">
            <span>🧩</span>
            <h1>Пазлы</h1>
        </div>
        <div class="header-right">
            <div class="stat-box" id="timerDisplay">⏱ 00:00</div>
            <div class="stat-box" id="counterDisplay">🧩 0 / 0</div>
            <button class="btn-achievements" id="btnShowAchievements" onclick="toggleAchievementsModal()">
                🏆 <span id="achCount">0</span>/<span id="achTotal">0</span>
            </button>
        </div>
    </header>

    <!-- ============================================
         MAIN CONTENT
         ============================================ -->
    <main class="main" id="mainContent">
        <!-- Контент рендерится через JS -->
    </main>

    <!-- ============================================
         FOOTER
         ============================================ -->
    <footer class="footer">
        Перетаскивайте кусочки мышкой • Кусочки примагничиваются при приближении к правильной позиции
    </footer>

    <!-- ============================================
         КОНТЕЙНЕР ДЛЯ УВЕДОМЛЕНИЙ
         ============================================ -->
    <div id="toastContainer"></div>
    <div id="modalContainer"></div>

    <script>
    /* ============================================
       КОНФИГУРАЦИЯ (меняйте здесь)
       ============================================

       imageUrl — URL изображения для пазла.
         Примеры:
         - https://picsum.photos/800/600  (случайное фото)
         - https://i.imgur.com/ВАШ_ID.jpg (ваше фото на imgur)

       gridRows / gridCols — размер сетки.
         3x3 = 9 кусочков (легко)
         4x4 = 16 кусочков (средне)
         5x5 = 25 кусочков (сложно)

       snapRadius — радиус примагничивания в пикселях.
    */
    const CONFIG = {
        imageUrl: 'https://picsum.photos/800/600',
        gridRows: 3,
        gridCols: 4,
        snapRadius: 25,
        canvasWidth: 900,
        canvasHeight: 650,
    };

    /* ============================================
       СОСТОЯНИЕ ИГРЫ
       ============================================ */
    let state = {
        pieces: [],
        image: null,
        isPaused: false,
        isComplete: false,
        elapsedTime: 0,
        timerInterval: null,
        dragPiece: null,
        dragOffsetX: 0,
        dragOffsetY: 0,
        moveCount: 0,
        mistakes: 0,
        achievements: [],
        gameStarted: false,
        showSettings: false,
        showAchievementsModal: false,
    };

    let canvas = null;
    let ctx = null;
    let animFrameId = null;

    /* ============================================
       СИСТЕМА АЧИВОК
       ============================================ */
    function createAchievements() {
        return [
            {
                id: 'first_piece',
                title: '🧩 Первый кусочек',
                description: 'Установите первый кусочек на место',
                icon: '🎯',
                unlocked: false,
                check: (s) => s.placedPieces >= 1,
            },
            {
                id: 'quarter_done',
                title: '📐 Четверть пути',
                description: 'Соберите 25% пазла',
                icon: '📊',
                unlocked: false,
                check: (s) => s.placedPieces >= s.totalPieces * 0.25,
            },
            {
                id: 'half_done',
                title: '⚡ На полпути',
                description: 'Соберите 50% пазла',
                icon: '🏃',
                unlocked: false,
                check: (s) => s.placedPieces >= s.totalPieces * 0.5,
            },
            {
                id: 'speed_demon',
                title: '⚡ Скоростная сборка',
                description: 'Соберите пазл менее чем за 60 секунд',
                icon: '🏎️',
                unlocked: false,
                check: (s) => s.isComplete && s.elapsedTime < 60,
            },
            {
                id: 'puzzle_master',
                title: '👑 Мастер пазлов',
                description: 'Соберите пазл полностью',
                icon: '🏆',
                unlocked: false,
                check: (s) => s.isComplete,
            },
            {
                id: 'no_mistakes',
                title: '🎯 Без ошибок',
                description: 'Соберите пазл без единого промаха',
                icon: '💎',
                unlocked: false,
                check: (s) => s.isComplete && s.noMistakes,
            },
            {
                id: 'speed_first',
                title: '🚀 Быстрый старт',
                description: 'Установите 3 кусочка за первые 15 секунд',
                icon: '🚀',
                unlocked: false,
                check: (s) => s.placedPieces >= 3 && s.elapsedTime < 15,
            },
        ];
    }

    function checkAchievements() {
        const checkState = {
            totalPieces: state.pieces.length,
            placedPieces: state.pieces.filter(p => p.isPlaced).length,
            elapsedTime: state.elapsedTime,
            isComplete: state.isComplete,
            noMistakes: state.mistakes === 0,
        };

        for (const ach of state.achievements) {
            if (!ach.unlocked && ach.check(checkState)) {
                ach.unlocked = true;
                showAchievementToast(ach);
            }
        }
        updateAchievementCounter();
        saveToLocalStorage();
    }

    /* ============================================
       ГЕНЕРАЦИЯ ФОРМ КУСОЧКОВ (Кривые Безье)
       ============================================ */
    function generatePieceShapes(rows, cols) {
        const shapes = [];
        for (let r = 0; r < rows; r++) {
            shapes[r] = [];
            for (let c = 0; c < cols; c++) {
                const top = r === 0 ? 0 : -shapes[r - 1][c].edges[2];
                const left = c === 0 ? 0 : -shapes[r][c - 1].edges[1];
                const right = c === cols - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1);
                const bottom = r === rows - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1);
                shapes[r][c] = { edges: [top, right, bottom, left] };
            }
        }
        return shapes;
    }

    function createPieces(rows, cols, imgW, imgH, cW, cH) {
        const shapes = generatePieceShapes(rows, cols);
        const pieceW = imgW / cols;
        const pieceH = imgH / rows;

        const scale = Math.min(cW / imgW, cH / imgH) * 0.7;
        const displayW = imgW * scale;
        const displayH = imgH * scale;
        const offsetX = (cW - displayW) / 2;
        const offsetY = (cH - displayH) / 2;
        const dpW = pieceW * scale;
        const dpH = pieceH * scale;

        const pieces = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const correctX = offsetX + c * dpW;
                const correctY = offsetY + r * dpH;

                let startX, startY;
                do {
                    startX = Math.random() * (cW - dpW);
                    startY = Math.random() * (cH - dpH);
                } while (
                    Math.abs(startX - correctX) < dpW * 1.5 &&
                    Math.abs(startY - correctY) < dpH * 1.5
                );

                pieces.push({
                    row: r,
                    col: c,
                    correctX, correctY,
                    currentX: startX,
                    currentY: startY,
                    width: dpW,
                    height: dpH,
                    shape: shapes[r][c],
                    isPlaced: false,
                    id: `piece_${r}_${c}`,
                });
            }
        }
        return pieces;
    }

    /* ============================================
       РИСОВАНИЕ КОНТУРА КУСОЧКА (Bezier)
       ============================================ */
    function drawPiecePath(ctx, x, y, w, h, edges) {
        const [top, right, bottom, left] = edges;
        const tabSize = Math.min(w, h) * 0.2;

        ctx.beginPath();
        ctx.moveTo(x, y);

        // Верхний край
        if (top === 0) {
            ctx.lineTo(x + w, y);
        } else {
            drawEdgeH(ctx, x, y, x + w, y, top, tabSize);
        }

        // Правый край
        if (right === 0) {
            ctx.lineTo(x + w, y + h);
        } else {
            drawEdgeV(ctx, x + w, y, x + w, y + h, right, tabSize);
        }

        // Нижний край (справа налево)
        if (bottom === 0) {
            ctx.lineTo(x, y + h);
        } else {
            drawEdgeH(ctx, x + w, y + h, x, y + h, -bottom, tabSize);
        }

        // Левый край (снизу вверх)
        if (left === 0) {
            ctx.lineTo(x, y);
        } else {
            drawEdgeV(ctx, x, y + h, x, y, -left, tabSize);
        }

        ctx.closePath();
    }

    function drawEdgeH(ctx, x1, y1, x2, y2, dir, tabSize) {
        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;
        const edgeLen = Math.abs(x2 - x1);
        const neckW = edgeLen * 0.34;
        const neckStart = midX - neckW / 2;
        const neckEnd = midX + neckW / 2;
        const offY = dir * tabSize;

        ctx.lineTo(neckStart, y1);
        ctx.bezierCurveTo(
            neckStart, y1 + offY * 0.1,
            neckStart - tabSize * 0.1, y1 + offY * 0.5,
            neckStart - tabSize * 0.15, midY + offY * 0.7
        );
        ctx.bezierCurveTo(
            neckStart - tabSize * 0.2, midY + offY * 1.2,
            midX - tabSize * 0.3, midY + offY * 1.3,
            midX, midY + offY
        );
        ctx.bezierCurveTo(
            midX + tabSize * 0.3, midY + offY * 1.3,
            neckEnd + tabSize * 0.2, midY + offY * 1.2,
            neckEnd + tabSize * 0.15, midY + offY * 0.7
        );
        ctx.bezierCurveTo(
            neckEnd + tabSize * 0.1, y1 + offY * 0.5,
            neckEnd, y1 + offY * 0.1,
            neckEnd, y1
        );
        ctx.lineTo(x2, y2);
    }

    function drawEdgeV(ctx, x1, y1, x2, y2, dir, tabSize) {
        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;
        const edgeLen = Math.abs(y2 - y1);
        const neckH = edgeLen * 0.34;
        const neckStart = midY - neckH / 2;
        const neckEnd = midY + neckH / 2;
        const offX = dir * tabSize;

        ctx.lineTo(x1, neckStart);
        ctx.bezierCurveTo(
            x1 + offX * 0.1, neckStart,
            x1 + offX * 0.5, neckStart - tabSize * 0.1,
            midX + offX * 0.7, neckStart - tabSize * 0.15
        );
        ctx.bezierCurveTo(
            midX + offX * 1.2, neckStart - tabSize * 0.2,
            midX + offX * 1.3, midY - tabSize * 0.3,
            midX + offX, midY
        );
        ctx.bezierCurveTo(
            midX + offX * 1.3, midY + tabSize * 0.3,
            midX + offX * 1.2, neckEnd + tabSize * 0.2,
            midX + offX * 0.7, neckEnd + tabSize * 0.15
        );
        ctx.bezierCurveTo(
            x1 + offX * 0.5, neckEnd + tabSize * 0.1,
            x1 + offX * 0.1, neckEnd,
            x1, neckEnd
        );
        ctx.lineTo(x2, y2);
    }

    /* ============================================
       HIT TESTING
       ============================================ */
    function isPointInPiece(px, py, piece) {
        const margin = Math.min(piece.width, piece.height) * 0.2;
        return (
            px >= piece.currentX - margin &&
            px <= piece.currentX + piece.width + margin &&
            py >= piece.currentY - margin &&
            py <= piece.currentY + piece.height + margin
        );
    }

    /* ============================================
       ЗАГРУЗКА ИЗОБРАЖЕНИЯ И ИНИЦИАЛИЗАЦИЯ
       ============================================ */
    function initGame() {
        cleanup();
        state.achievements = createAchievements();
        state.isComplete = false;
        state.isPaused = false;
        state.elapsedTime = 0;
        state.moveCount = 0;
        state.mistakes = 0;
        state.dragPiece = null;
        state.gameStarted = true;
        state.showSettings = false;

        // Восстанавливаем ачивки из localStorage
        const saved = loadFromLocalStorage();
        if (saved && saved.achievements) {
            for (const ach of state.achievements) {
                if (saved.achievements.includes(ach.id)) {
                    ach.unlocked = true;
                }
            }
        }

        renderUI();
        loadImage(CONFIG.imageUrl);
    }

    function loadImage(url) {
        const img = new Image();
        img.crossOrigin = 'anonymous';

        img.onload = () => {
            state.image = img;
            state.pieces = createPieces(
                CONFIG.gridRows, CONFIG.gridCols,
                img.width, img.height,
                CONFIG.canvasWidth, CONFIG.canvasHeight
            );

            // Восстанавливаем позиции из localStorage
            const saved = loadFromLocalStorage();
            if (saved && saved.pieces) {
                for (const piece of state.pieces) {
                    const sp = saved.pieces.find(p => p.id === piece.id);
                    if (sp) {
                        piece.currentX = sp.currentX;
                        piece.currentY = sp.currentY;
                        piece.isPlaced = sp.isPlaced;
                    }
                }
                if (saved.elapsedTime) state.elapsedTime = saved.elapsedTime;
                if (saved.moveCount) state.moveCount = saved.moveCount;
                if (saved.mistakes !== undefined) state.mistakes = saved.mistakes;
            }

            startTimer();
            startRenderLoop();
            updateUI();
        };

        img.onerror = () => {
            showError('Не удалось загрузить изображение. Проверьте URL или попробуйте другой.');
        };

        img.src = url;
    }

    /* ============================================
       ТАЙМЕР
       ============================================ */
    function startTimer() {
        state.timerInterval = setInterval(() => {
            if (!state.isPaused && !state.isComplete) {
                state.elapsedTime++;
                updateTimerDisplay();
            }
        }, 1000);
    }

    function togglePause() {
        state.isPaused = !state.isPaused;
        updateUI();
    }

    function resetGame() {
        clearLocalStorage();
        initGame();
    }

    function cleanup() {
        if (state.timerInterval) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
        }
        if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
        }
    }

    /* ============================================
       РЕНДЕРИНГ (requestAnimationFrame)
       ============================================ */
    function startRenderLoop() {
        function loop() {
            drawFrame();
            animFrameId = requestAnimationFrame(loop);
        }
        animFrameId = requestAnimationFrame(loop);
    }

    function drawFrame() {
        if (!ctx || !canvas) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        drawAssemblyZone();

        // Рисуем все кусочки (кроме перетаскиваемого)
        for (const piece of state.pieces) {
            if (piece === state.dragPiece) continue;
            drawPiece(piece, false);
        }

        // Перетаскиваемый поверх всех
        if (state.dragPiece) {
            drawPiece(state.dragPiece, true);
        }

        // Оверлей паузы
        if (state.isPaused) {
            drawPauseOverlay();
        }
    }

    function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a1a2e');
        gradient.addColorStop(1, '#16213e');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Сетка
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
    }

    function drawAssemblyZone() {
        if (state.pieces.length === 0) return;
        const first = state.pieces[0];
        const last = state.pieces[state.pieces.length - 1];

        ctx.strokeStyle = 'rgba(100,200,255,0.15)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(
            first.correctX - 5, first.correctY - 5,
            last.correctX + last.width - first.correctX + 10,
            last.correctY + last.height - first.correctY + 10
        );
        ctx.setLineDash([]);
    }

    function drawPiece(piece, isDragging) {
        if (!state.image) return;

        ctx.save();

        // Путь кусочка
        drawPiecePath(ctx, piece.currentX, piece.currentY, piece.width, piece.height, piece.shape.edges);

        // Тень
        if (isDragging) {
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;
        }

        // Клипаем и рисуем изображение
        ctx.clip();

        const img = state.image;
        const srcX = piece.col * (img.width / CONFIG.gridCols);
        const srcY = piece.row * (img.height / CONFIG.gridRows);
        const srcW = img.width / CONFIG.gridCols;
        const srcH = img.height / CONFIG.gridRows;

        ctx.drawImage(img, srcX, srcY, srcW, srcH, piece.currentX, piece.currentY, piece.width, piece.height);
        ctx.restore();

        // Обводка
        ctx.save();
        drawPiecePath(ctx, piece.currentX, piece.currentY, piece.width, piece.height, piece.shape.edges);
        ctx.strokeStyle = piece.isPlaced
            ? 'rgba(100,255,100,0.6)'
            : isDragging
                ? 'rgba(255,220,100,0.8)'
                : 'rgba(255,255,255,0.3)';
        ctx.lineWidth = isDragging ? 2.5 : 1.5;
        ctx.stroke();
        ctx.restore();
    }

    function drawPauseOverlay() {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⏸️ ПАУЗА', canvas.width / 2, canvas.height / 2);

        ctx.font = '18px sans-serif';
        ctx.fillStyle = '#aaaaaa';
        ctx.fillText('Нажмите "Продолжить" чтобы возобновить', canvas.width / 2, canvas.height / 2 + 50);
    }

    /* ============================================
       DRAG & DROP (мышь + тач)
       ============================================ */
    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        let clientX, clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else if (e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX;
            clientY = e.changedTouches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }

        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY,
        };
    }

    function onPointerDown(e) {
        if (state.isPaused || state.isComplete) return;
        const { x, y } = getCanvasCoords(e);

        for (let i = state.pieces.length - 1; i >= 0; i--) {
            const piece = state.pieces[i];
            if (piece.isPlaced) continue;
            if (isPointInPiece(x, y, piece)) {
                state.dragPiece = piece;
                state.dragOffsetX = x - piece.currentX;
                state.dragOffsetY = y - piece.currentY;
                // Наверх
                state.pieces.splice(i, 1);
                state.pieces.push(piece);
                break;
            }
        }
    }

    function onPointerMove(e) {
        if (!state.dragPiece) return;
        const { x, y } = getCanvasCoords(e);
        state.dragPiece.currentX = x - state.dragOffsetX;
        state.dragPiece.currentY = y - state.dragOffsetY;
    }

    function onPointerUp(e) {
        if (!state.dragPiece) return;

        const piece = state.dragPiece;
        state.dragPiece = null;
        state.moveCount++;

        // Проверка snap
        const dx = piece.currentX - piece.correctX;
        const dy = piece.currentY - piece.correctY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < CONFIG.snapRadius) {
            piece.currentX = piece.correctX;
            piece.currentY = piece.correctY;
            piece.isPlaced = true;
            checkAchievements();

            // Проверка завершения
            if (state.pieces.every(p => p.isPlaced)) {
                state.isComplete = true;
                checkAchievements();
                renderUI();
            }
        } else {
            state.mistakes++;
        }

        saveToLocalStorage();
        updateUI();
    }

    function setupCanvasEvents() {
        if (!canvas) return;

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('mouseleave', onPointerUp);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive: false });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); onPointerUp(e); }, { passive: false });
    }

    /* ============================================
       LOCAL STORAGE
       ============================================ */
    function saveToLocalStorage() {
        const data = {
            pieces: state.pieces.map(p => ({
                id: p.id,
                currentX: p.currentX,
                currentY: p.currentY,
                isPlaced: p.isPlaced,
            })),
            elapsedTime: state.elapsedTime,
            moveCount: state.moveCount,
            mistakes: state.mistakes,
            achievements: state.achievements.filter(a => a.unlocked).map(a => a.id),
        };
        localStorage.setItem('puzzle_game_state', JSON.stringify(data));
    }

    function loadFromLocalStorage() {
        try {
            const data = localStorage.getItem('puzzle_game_state');
            return data ? JSON.parse(data) : null;
        } catch {
            return null;
        }
    }

    function clearLocalStorage() {
        localStorage.removeItem('puzzle_game_state');
    }

    /* ============================================
       UI РЕНДЕРИНГ
       ============================================ */
    function renderUI() {
        const main = document.getElementById('mainContent');

        if (!state.gameStarted) {
            // Экран настроек
            main.innerHTML = `
                <div class="settings-panel">
                    <h2>🧩 Настройки пазла</h2>
                    <div class="form-group">
                        <label>URL изображения</label>
                        <input type="text" id="inputUrl" value="${CONFIG.imageUrl}" placeholder="https://picsum.photos/800/600">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Строки</label>
                            <select id="selectRows">
                                <option value="2" ${CONFIG.gridRows===2?'selected':''}>2</option>
                                <option value="3" ${CONFIG.gridRows===3?'selected':''}>3</option>
                                <option value="4" ${CONFIG.gridRows===4?'selected':''}>4</option>
                                <option value="5" ${CONFIG.gridRows===5?'selected':''}>5</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Столбцы</label>
                            <select id="selectCols">
                                <option value="2" ${CONFIG.gridCols===2?'selected':''}>2</option>
                                <option value="3" ${CONFIG.gridCols===3?'selected':''}>3</option>
                                <option value="4" ${CONFIG.gridCols===4?'selected':''}>4</option>
                                <option value="5" ${CONFIG.gridCols===5?'selected':''}>5</option>
                                <option value="6" ${CONFIG.gridCols===6?'selected':''}>6</option>
                            </select>
                        </div>
                    </div>
                    <div class="hint-box">
                        <strong>💡 Подсказки:</strong>
                        <ul>
                            <li>Используйте picsum.photos для случайных фото</li>
                            <li>Для своих фото загрузите на imgur.com и вставьте URL</li>
                            <li>Меньше кусочков = легче, больше = сложнее</li>
                        </ul>
                    </div>
                    <button class="btn-start" onclick="startGameFromUI()">🚀 Начать игру</button>
                    <div id="errorBox"></div>
                </div>
            `;
        } else {
            // Игровой экран
            const placed = state.pieces.filter(p => p.isPlaced).length;
            const total = state.pieces.length;

            main.innerHTML = `
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="puzzleCanvas" width="${CONFIG.canvasWidth}" height="${CONFIG.canvasHeight}"></canvas>
                    ${state.isComplete ? `
                        <div class="completion-overlay">
                            <div class="completion-box">
                                <div class="emoji">🎉</div>
                                <h2>Поздравляем!</h2>
                                <p>Пазл собран за ${formatTime(state.elapsedTime)}!</p>
                                <div class="btn-row">
                                    <button class="btn-new-game" onclick="resetGame()">🔄 Новая игра</button>
                                    <button class="btn-to-settings" onclick="goToSettings()">⚙️ Настройки</button>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
                <div class="controls">
                    <button class="btn-control btn-pause ${state.isPaused ? 'active' : ''}" onclick="togglePause()">
                        ${state.isPaused ? '▶️ Продолжить' : '⏸️ Пауза'}
                    </button>
                    <button class="btn-control btn-reset" onclick="resetGame()">🔄 Рестарт</button>
                    <button class="btn-control btn-settings" onclick="toggleInlineSettings()">⚙️ Настройки</button>
                </div>
                <div class="inline-settings" id="inlineSettings" style="display:${state.showSettings ? 'block' : 'none'}">
                    <h3>⚙️ Настройки</h3>
                    <div class="form-group">
                        <label>URL изображения</label>
                        <input type="text" id="inlineUrl" value="${CONFIG.imageUrl}">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Строки</label>
                            <select id="inlineRows">
                                <option value="2" ${CONFIG.gridRows===2?'selected':''}>2</option>
                                <option value="3" ${CONFIG.gridRows===3?'selected':''}>3</option>
                                <option value="4" ${CONFIG.gridRows===4?'selected':''}>4</option>
                                <option value="5" ${CONFIG.gridRows===5?'selected':''}>5</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Столбцы</label>
                            <select id="inlineCols">
                                <option value="2" ${CONFIG.gridCols===2?'selected':''}>2</option>
                                <option value="3" ${CONFIG.gridCols===3?'selected':''}>3</option>
                                <option value="4" ${CONFIG.gridCols===4?'selected':''}>4</option>
                                <option value="5" ${CONFIG.gridCols===5?'selected':''}>5</option>
                                <option value="6" ${CONFIG.gridCols===6?'selected':''}>6</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn-apply" onclick="applyInlineSettings()">Применить и начать заново</button>
                </div>
            `;

            // Инициализация canvas
            canvas = document.getElementById('puzzleCanvas');
            ctx = canvas.getContext('2d');
            setupCanvasEvents();
        }

        updateUI();
    }

    function startGameFromUI() {
        const url = document.getElementById('inputUrl').value.trim();
        const rows = parseInt(document.getElementById('selectRows').value);
        const cols = parseInt(document.getElementById('selectCols').value);

        if (!url) {
            showError('Введите URL изображения');
            return;
        }

        CONFIG.imageUrl = url;
        CONFIG.gridRows = rows;
        CONFIG.gridCols = cols;
        initGame();
    }

    function toggleInlineSettings() {
        state.showSettings = !state.showSettings;
        const el = document.getElementById('inlineSettings');
        if (el) el.style.display = state.showSettings ? 'block' : 'none';
    }

    function applyInlineSettings() {
        const url = document.getElementById('inlineUrl').value.trim();
        const rows = parseInt(document.getElementById('inlineRows').value);
        const cols = parseInt(document.getElementById('inlineCols').value);

        if (!url) {
            alert('Введите URL изображения');
            return;
        }

        CONFIG.imageUrl = url;
        CONFIG.gridRows = rows;
        CONFIG.gridCols = cols;
        state.showSettings = false;
        resetGame();
    }

    function goToSettings() {
        cleanup();
        state.gameStarted = false;
        renderUI();
    }

    function showError(msg) {
        const box = document.getElementById('errorBox');
        if (box) {
            box.innerHTML = `<div class="error-msg">${msg}</div>`;
        } else {
            alert(msg);
        }
    }

    /* ============================================
       ОБНОВЛЕНИЕ UI
       ============================================ */
    function updateUI() {
        updateTimerDisplay();
        updateCounterDisplay();
        updateAchievementCounter();
    }

    function updateTimerDisplay() {
        const el = document.getElementById('timerDisplay');
        if (el) el.textContent = `⏱ ${formatTime(state.elapsedTime)}`;
    }

    function updateCounterDisplay() {
        const el = document.getElementById('counterDisplay');
        if (el) {
            const placed = state.pieces.filter(p => p.isPlaced).length;
            const total = state.pieces.length;
            el.textContent = `🧩 ${placed} / ${total}`;
        }
    }

    function updateAchievementCounter() {
        const el = document.getElementById('achCount');
        const totalEl = document.getElementById('achTotal');
        if (el) el.textContent = state.achievements.filter(a => a.unlocked).length;
        if (totalEl) totalEl.textContent = state.achievements.length;
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    /* ============================================
       УВЕДОМЛЕНИЯ
       ============================================ */
    function showAchievementToast(achievement) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'achievement-toast';
        toast.innerHTML = `
            <div class="achievement-toast-inner">
                <span class="icon">${achievement.icon}</span>
                <div>
                    <div class="label">🏆 Достижение!</div>
                    <div class="title">${achievement.title}</div>
                    <div class="desc">${achievement.description}</div>
                </div>
            </div>
        `;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 4200);
    }

    /* ============================================
       МОДАЛЬНОЕ ОКНО ДОСТИЖЕНИЙ
       ============================================ */
    function toggleAchievementsModal() {
        state.showAchievementsModal = !state.showAchievementsModal;
        const container = document.getElementById('modalContainer');

        if (!state.showAchievementsModal) {
            container.innerHTML = '';
            return;
        }

        let items = '';
        for (const ach of state.achievements) {
            items += `
                <div class="achievement-item ${ach.unlocked ? 'unlocked' : 'locked'}">
                    <span class="ach-icon">${ach.unlocked ? ach.icon : '🔒'}</span>
                    <div>
                        <div class="ach-title">${ach.title}</div>
                        <div class="ach-desc">${ach.description}</div>
                    </div>
                    ${ach.unlocked ? '<span class="ach-check">✓</span>' : ''}
                </div>
            `;
        }

        container.innerHTML = `
            <div class="modal-overlay" onclick="closeModalOnOverlay(event)">
                <div class="modal-box">
                    <div class="modal-header">
                        <h2>🏆 Достижения</h2>
                        <button class="modal-close" onclick="toggleAchievementsModal()">×</button>
                    </div>
                    ${items}
                </div>
            </div>
        `;
    }

    function closeModalOnOverlay(e) {
        if (e.target.classList.contains('modal-overlay')) {
            toggleAchievementsModal();
        }
    }

    /* ============================================
       АВТОЗАПУСК
       ============================================ */
    // При загрузке страницы показываем экран настроек
    renderUI();
    updateAchievementCounter();

    </script>
</body>
