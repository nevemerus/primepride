        achClose.style.background = '#1a1a1a';
        achClose.style.color = '#fff';
        achClose.style.border = 'none';
        achClose.style.borderRadius = '8px';
        achClose.style.padding = '12px 32px';
        achClose.style.fontSize = '14px';
        achClose.style.fontWeight = '700';
        achClose.style.cursor = 'pointer';
        achModal.appendChild(achClose);

        achOverlay.appendChild(achModal);
        page.appendChild(achOverlay);

        var toastContainer = document.createElement('div');
        toastContainer.id = 'bpToastContainer';
        page.appendChild(toastContainer);

        wrapper.appendChild(page);

        document.getElementById('bpStartBtn').addEventListener('click', startGame);
        document.getElementById('bpPauseBtn').addEventListener('click', togglePause);
        document.getElementById('bpShowBtn').addEventListener('click', toggleShowImage);
        document.getElementById('bpAchBtn').addEventListener('click', openAchievements);
        document.getElementById('bpAchClose').addEventListener('click', function() {
            document.getElementById('bpAchOverlay').style.display = 'none';
        });
        document.getElementById('bpMenuBtn').addEventListener('click', backToMenu);
        document.getElementById('bpFullscreenBtn').addEventListener('click', toggleFullscreen);
        document.getElementById('bpZoomResetBtn').addEventListener('click', function() { setZoom(1); });
        document.getElementById('bpBgColorBtn').addEventListener('click', cycleBackgroundColor);

        document.getElementById('bpAchOverlay').addEventListener('click', function(e) {
            if (e.target.id === 'bpAchOverlay') {
                document.getElementById('bpAchOverlay').style.display = 'none';
            }
        });

        document.getElementById('bpRows').addEventListener('change', updatePiecesInfo);
        document.getElementById('bpCols').addEventListener('change', updatePiecesInfo);
        updatePiecesInfo();
    }

    function cycleBackgroundColor() {
        state.bgColorIndex = (state.bgColorIndex + 1) % BG_COLORS.length;
        setBackgroundColor(BG_COLORS[state.bgColorIndex]);
        var btn = document.getElementById('bpBgColorBtn');
        if (btn) {
            btn.style.background = BG_COLORS[state.bgColorIndex];
        }
    }

    function setBackgroundColor(color) {
        state.backgroundColor = color;
        var canvasArea = document.getElementById('bpCanvasArea');
        if (canvasArea) {
            canvasArea.style.background = color;
        }
    }

    function toggleFullscreen() {
        var container = document.getElementById('bpGameContainer');
        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
            if (container.requestFullscreen) container.requestFullscreen();
            else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
            else if (container.mozRequestFullScreen) container.mozRequestFullScreen();
            else if (container.msRequestFullscreen) container.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        }
    }

    function changeZoom(delta) {
        var newZoom = Math.max(0.2, Math.min(3, state.zoomLevel + delta));
        setZoom(newZoom);
    }

    function setZoom(zoom) {
        state.zoomLevel = Math.max(0.2, Math.min(3, zoom));
        var wrapper = document.getElementById('bpCanvasWrapper');
        if (wrapper) {
            wrapper.style.transform = 'scale(' + state.zoomLevel + ')';
        }
    }

    function updatePiecesInfo() {
        var rows = parseInt(document.getElementById('bpRows').value);
        var cols = parseInt(document.getElementById('bpCols').value);
        var total = rows * cols;
        var info = document.getElementById('bpPiecesInfo');
        var difficulty = '';
        if (total <= 9) difficulty = ' (Легко)';
        else if (total <= 20) difficulty = ' (Средне)';
        else if (total <= 36) difficulty = ' (Сложно)';
        else if (total <= 64) difficulty = ' (Очень сложно)';
        else difficulty = ' (Эксперт)';
        info.textContent = 'Всего кусочков: ' + total + difficulty;
    }

    function buildProgressBar() {
        var segments = document.getElementById('bpProgressBarSegments');
        if (!segments) return;
        segments.innerHTML = '';
        var total = state.pieces.length;
        if (total === 0) return;
        for (var i = 0; i < total; i++) {
            var seg = document.createElement('div');
            seg.style.flex = '1';
            seg.style.borderRight = i < total - 1 ? '1px solid rgba(255,255,255,0.6)' : 'none';
            seg.style.height = '100%';
            segments.appendChild(seg);
        }
    }

    function startGame() {
        var url = document.getElementById('bpUrlInput').value.trim();
        var rows = parseInt(document.getElementById('bpRows').value);
        var cols = parseInt(document.getElementById('bpCols').value);

        if (!url) { alert('Введите ссылку на изображение'); return; }

        localStorage.removeItem('bp_game_state');

        CONFIG.imageUrl = url;
        CONFIG.rows = rows;
        CONFIG.cols = cols;

        var totalPieces = rows * cols;
        CONFIG.snapRadius = Math.max(15, Math.min(35, 100 / Math.sqrt(totalPieces)));

        state.isComplete = false;
        state.isPaused = false;
        state.elapsedTime = 0;
        state.moveCount = 0;
        state.mistakes = 0;
        state.pieces = [];
        state.showImage = false;
        state.comboCount = 0;
        state.dragPiece = null;
        state.zoomLevel = 1;
        state.bgColorIndex = 0;
        state.pieceGroups = [];
        state.draggedGroup = [];

        state.achievements = ACHIEVEMENTS.map(function(a) {
            return { id: a.id, title: a.title, desc: a.desc, icon: a.icon, unlocked: false };
        });
        loadAchievements();

        saveGamesCount();

        document.getElementById('bpStartScreen').style.display = 'none';
        document.getElementById('bpGameScreen').style.display = 'block';

        setZoom(1);
        setBackgroundColor(BG_COLORS[0]);

        var timerCloud = document.getElementById('bpTimer');
        if (timerCloud) timerCloud.style.color = '#ffffff';

        loadImage(url);
    }

    function backToMenu() {
        if (state.timerInterval) clearInterval(state.timerInterval);
        document.getElementById('bpStartScreen').style.display = 'block';
        document.getElementById('bpGameScreen').style.display = 'none';
    }

    function loadImage(url) {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
            state.image = img;
            
            // Загрузка фонового изображения
            var bgImg = new Image();
            bgImg.crossOrigin = 'anonymous';
            bgImg.onload = function() {
                state.backgroundImage = bgImg;
                createPieces();
                buildProgressBar();
                startTimer();
                setupCanvas();
                draw();
                updateUI();
            };
            bgImg.src = CONFIG.backgroundUrl;
        };
        img.onerror = function() {
            alert('Не удалось загрузить изображение. Проверьте ссылку!');
        };
        img.src = url;
    }

    function createPieces() {
        var rows = CONFIG.rows;
        var cols = CONFIG.cols;
        var imgW = state.image.width;
        var imgH = state.image.height;
        var cW = CONFIG.canvasWidth;
        var cH = CONFIG.canvasHeight;

        var pieceW = imgW / cols;
        var pieceH = imgH / rows;
        var scale = Math.min(cW / imgW, cH / imgH) * 0.55;
        var displayW = imgW * scale;
        var displayH = imgH * scale;
        var offsetX = (cW - displayW) / 2;
        var offsetY = (cH - displayH) / 2;
        var dpW = pieceW * scale;
        var dpH = pieceH * scale;

        state.assemblyX = offsetX;
        state.assemblyY = offsetY;
        state.assemblyW = displayW;
        state.assemblyH = displayH;

        var shapes = [];
        var r, c;
        for (r = 0; r < rows; r++) {
            shapes[r] = [];
            for (c = 0; c < cols; c++) {
                shapes[r][c] = {
                    top: r === 0 ? 0 : -shapes[r-1][c].bottom,
                    right: c === cols-1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                    bottom: r === rows-1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                    left: c === 0 ? 0 : -shapes[r][c-1].right
                };
            }
        }

        state.pieces = [];
        for (r = 0; r < rows; r++) {
            for (c = 0; c < cols; c++) {
                var correctX = offsetX + c * dpW;
                var correctY = offsetY + r * dpH;
                var startX, startY;
                var attempts = 0;
                do {
                    startX = Math.random() * (cW - dpW * 1.5);
                    startY = Math.random() * (cH - dpH * 1.5);
                    attempts++;
                } while (attempts < 100 && Math.abs(startX - correctX) < dpW * 1.5 && Math.abs(startY - correctY) < dpH * 1.5);

                state.pieces.push({
                    row: r, col: c,
                    correctX: correctX, correctY: correctY,
                    currentX: startX, currentY: startY,
                    width: dpW, height: dpH,
                    shape: shapes[r][c],
                    isPlaced: false,
                    groupId: null,
                    id: 'p_' + r + '_' + c
                });
            }
        }
    }

    function setupCanvas() {
        state.canvas = document.getElementById('bpCanvas');
        state.ctx = state.canvas.getContext('2d');

        state.canvas.addEventListener('mousedown', handleStart);
        state.canvas.addEventListener('mousemove', handleMove);
        state.canvas.addEventListener('mouseup', handleEnd);
        state.canvas.addEventListener('mouseleave', handleEnd);
        state.canvas.addEventListener('touchstart', function(e) { e.preventDefault(); handleStart(e.touches[0]); }, {passive: false});
        state.canvas.addEventListener('touchmove', function(e) { e.preventDefault(); handleMove(e.touches[0]); }, {passive: false});
        state.canvas.addEventListener('touchend', function(e) { e.preventDefault(); handleEnd(); }, {passive: false});

        var canvasArea = document.getElementById('bpCanvasArea');
        canvasArea.addEventListener('wheel', function(e) {
            e.preventDefault();
            var delta = e.deltaY > 0 ? -0.2 : 0.2;
            changeZoom(delta);
        }, {passive: false});

        var pinchStartDist = 0;
        var pinchStartZoom = 1;
        canvasArea.addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                var dx = e.touches[0].clientX - e.touches[1].clientX;
                var dy = e.touches[0].clientY - e.touches[1].clientY;
                pinchStartDist = Math.sqrt(dx*dx + dy*dy);
                pinchStartZoom = state.zoomLevel;
            }
        }, {passive: false});
        canvasArea.addEventListener('touchmove', function(e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                var dx = e.touches[0].clientX - e.touches[1].clientX;
                var dy = e.touches[0].clientY - e.touches[1].clientY;
                var dist = Math.sqrt(dx*dx + dy*dy);
                var scale = dist / pinchStartDist;
                setZoom(pinchStartZoom * scale);
            }
        }, {passive: false});
    }

    function arePiecesAdjacent(piece1, piece2) {
        // Проверяем, являются ли кусочки соседними в правильной позиции
        var dr = Math.abs(piece1.row - piece2.row);
        var dc = Math.abs(piece1.col - piece2.col);
        return (dr === 1 && dc === 0) || (dr === 0 && dc === 1);
    }

    function getPiecesNearby(piece) {
        var nearby = [];
        var threshold = piece.width * 1.5; // Расстояние для "склеивания"
        
        for (var i = 0; i < state.pieces.length; i++) {
            var other = state.pieces[i];
            if (other === piece || other.isPlaced) continue;
            
            var dx = Math.abs(other.currentX - piece.currentX);
            var dy = Math.abs(other.currentY - piece.currentY);
            
            if (dx < threshold && dy < threshold) {
                nearby.push(other);
            }
        }
        return nearby;
    }

    function findGroup(piece) {
        var group = [piece];
        var visited = {};
        visited[piece.id] = true;
        
        var queue = [piece];
        while (queue.length > 0) {
            var current = queue.shift();
            var nearby = getPiecesNearby(current);
            
            for (var i = 0; i < nearby.length; i++) {
                var neighbor = nearby[i];
                if (!visited[neighbor.id] && arePiecesAdjacent(current, neighbor)) {
                    visited[neighbor.id] = true;
                    group.push(neighbor);
                    queue.push(neighbor);
                }
            }
        }
        
        return group;
    }

    function isPiecePlacedAt(row, col) {
        var i;
        for (i = 0; i < state.pieces.length; i++) {
            if (state.pieces[i].row === row && state.pieces[i].col === col && state.pieces[i].isPlaced) {
                return state.pieces[i];
            }
        }
        return null;
    }

    function getOpenEdges(piece) {
        var row = piece.row;
        var col = piece.col;
        var rows = CONFIG.rows;
        var cols = CONFIG.cols;
        return {
            top: row === 0 || !isPiecePlacedAt(row - 1, col),
            right: col === cols - 1 || !isPiecePlacedAt(row, col + 1),
            bottom: row === rows - 1 || !isPiecePlacedAt(row + 1, col),
            left: col === 0 || !isPiecePlacedAt(row, col - 1)
        };
    }

    function draw() {
        if (!state.ctx || !state.canvas) return;
        var ctx = state.ctx;
        var canvas = state.canvas;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Рисуем фоновое изображение за пределами игровой зоны
        if (state.backgroundImage) {
            ctx.save();
            ctx.globalAlpha = 0.3;
            ctx.drawImage(state.backgroundImage, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        // Цвет фона внутри игровой зоны
        ctx.fillStyle = state.backgroundColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Черная пунктирная рамка вокруг зоны сборки
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.lineWidth = 3;
        ctx.setLineDash([15, 10]);
        ctx.strokeRect(state.assemblyX - 10, state.assemblyY - 10,
            state.assemblyW + 20, state.assemblyH + 20);
        ctx.setLineDash([]);

        // Тонкая рыжая линия — граница, за которую нельзя убрать кусочки
        var borderMargin = 5;
        ctx.strokeStyle = 'rgba(255, 107, 53, 0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.strokeRect(borderMargin, borderMargin,
            canvas.width - borderMargin * 2, canvas.height - borderMargin * 2);

        if (state.showImage && state.image) {
            ctx.globalAlpha = 0.15;
            var img = state.image;
            var sc = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.55;
            var dw = img.width * sc;
            var dh = img.height * sc;
            var dx = (canvas.width - dw) / 2;
            var dy = (canvas.height - dh) / 2;
            ctx.drawImage(img, dx, dy, dw, dh);
            ctx.globalAlpha = 1.0;
        }

        // Сортируем кусочки: сначала неустановленные, потом установленные
        var piecesToDraw = state.pieces.slice().sort(function(a, b) {
            if (a.isPlaced && !b.isPlaced) return 1;
            if (!a.isPlaced && b.isPlaced) return -1;
            return 0;
        });

        var i;
        for (i = 0; i < piecesToDraw.length; i++) {
            var piece = piecesToDraw[i];
            if (piece.isPlaced && piece !== state.dragPiece && state.draggedGroup.indexOf(piece) === -1) {
                drawJigsawPiece(piece, false, true);
            }
        }
        for (i = 0; i < piecesToDraw.length; i++) {
            var piece = piecesToDraw[i];
            if (piece.isPlaced && piece !== state.dragPiece && state.draggedGroup.indexOf(piece) === -1) {
                drawOpenEdges(piece);
            }
        }
        for (i = 0; i < piecesToDraw.length; i++) {
            var piece = piecesToDraw[i];
            if (!piece.isPlaced && piece !== state.dragPiece && state.draggedGroup.indexOf(piece) === -1) {
                drawJigsawPiece(piece, false, false);
            }
        }
        
        // Рисуем перетаскиваемый кусочек и его группу
        if (state.dragPiece) {
            drawJigsawPiece(state.dragPiece, true, false);
            // Рисуем остальные кусочки группы
            for (i = 0; i < state.draggedGroup.length; i++) {
                var groupPiece = state.draggedGroup[i];
                if (groupPiece !== state.dragPiece) {
                    drawJigsawPiece(groupPiece, true, false);
                }
            }
        }

        if (!state.isComplete && !state.isPaused) {
            requestAnimationFrame(draw);
        }
    }

    function drawJigsawPiece(piece, isDragging, isPlaced) {
        if (!state.image) return;
        var ctx = state.ctx;

        var img = state.image;
        var srcX = piece.col * (img.width / CONFIG.cols);
        var srcY = piece.row * (img.height / CONFIG.rows);
        var srcW = img.width / CONFIG.cols;
        var srcH = img.height / CONFIG.rows;

        if (isPlaced) {
            var overlap = 3;
            ctx.save();
            ctx.drawImage(img, srcX, srcY, srcW, srcH,
                piece.currentX - overlap, piece.currentY - overlap,
                piece.width + overlap * 2, piece.height + overlap * 2);
            ctx.restore();
        } else {
            ctx.save();
            createJigsawPath(piece.currentX, piece.currentY, piece.width, piece.height, piece.shape);
            ctx.clip();

            if (isDragging) {
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetX = 6;
                ctx.shadowOffsetY = 6;
            }

            ctx.drawImage(img, srcX, srcY, srcW, srcH,
                piece.currentX, piece.currentY, piece.width, piece.height);
            ctx.restore();

            ctx.save();
            createJigsawPath(piece.currentX, piece.currentY, piece.width, piece.height, piece.shape);
            ctx.strokeStyle = isDragging ? 'rgba(255, 107, 53, 1)' : 'rgba(40, 40, 40, 0.5)';
            ctx.lineWidth = isDragging ? 3 : 1.5;
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawOpenEdges(piece) {
        var ctx = state.ctx;
        var edges = getOpenEdges(piece);
        var tabSize = Math.min(piece.width, piece.height) * 0.22;

        ctx.save();
        ctx.strokeStyle = 'rgba(255, 107, 53, 0.9)';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (edges.top) {
            ctx.beginPath();
            if (piece.shape.top === 0) {
                ctx.moveTo(piece.currentX, piece.currentY);
                ctx.lineTo(piece.currentX + piece.width, piece.currentY);
            } else {
                drawTabPath(piece.currentX, piece.currentY, piece.currentX + piece.width, piece.currentY, piece.shape.top * tabSize, 'h');
            }
            ctx.stroke();
        }
        if (edges.right) {
            ctx.beginPath();
            if (piece.shape.right === 0) {
                ctx.moveTo(piece.currentX + piece.width, piece.currentY);
                ctx.lineTo(piece.currentX + piece.width, piece.currentY + piece.height);
            } else {
                drawTabPath(piece.currentX + piece.width, piece.currentY, piece.currentX + piece.width, piece.currentY + piece.height, piece.shape.right * tabSize, 'v');
            }
            ctx.stroke();
        }
        if (edges.bottom) {
            ctx.beginPath();
            if (piece.shape.bottom === 0) {
                ctx.moveTo(piece.currentX + piece.width, piece.currentY + piece.height);
                ctx.lineTo(piece.currentX, piece.currentY + piece.height);
            } else {
                drawTabPath(piece.currentX + piece.width, piece.currentY + piece.height, piece.currentX, piece.currentY + piece.height, -piece.shape.bottom * tabSize, 'h');
            }
            ctx.stroke();
        }
        if (edges.left) {
            ctx.beginPath();
            if (piece.shape.left === 0) {
                ctx.moveTo(piece.currentX, piece.currentY + piece.height);
                ctx.lineTo(piece.currentX, piece.currentY);
            } else {
                drawTabPath(piece.currentX, piece.currentY + piece.height, piece.currentX, piece.currentY, -piece.shape.left * tabSize, 'v');
            }
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawTabPath(x1, y1, x2, y2, size, dir) {
        var ctx = state.ctx;
        var midX = (x1 + x2) / 2;
        var midY = (y1 + y2) / 2;
        var len = Math.abs(dir === 'h' ? x2 - x1 : y2 - y1);
        var neckW = len * 0.32;
        var neckStart = (dir === 'h' ? midX : midY) - neckW / 2;
        var neckEnd = (dir === 'h' ? midX : midY) + neckW / 2;
        var tabSize = Math.min(Math.abs(x2-x1), Math.abs(y2-y1)) * 0.22;

        if (dir === 'h') {
            var offY = size;
            ctx.moveTo(neckStart, y1);
            ctx.bezierCurveTo(neckStart, y1 + offY*0.15, neckStart - tabSize*0.15, y1 + offY*0.4, neckStart - tabSize*0.18, midY + offY*0.55);
            ctx.bezierCurveTo(neckStart - tabSize*0.22, midY + offY*1.05, midX - tabSize*0.28, midY + offY*1.15, midX, midY + offY);
            ctx.bezierCurveTo(midX + tabSize*0.28, midY + offY*1.15, neckEnd + tabSize*0.22, midY + offY*1.05, neckEnd + tabSize*0.18, midY + offY*0.55);
            ctx.bezierCurveTo(neckEnd + tabSize*0.15, y1 + offY*0.4, neckEnd, y1 + offY*0.15, neckEnd, y1);
            ctx.lineTo(x2, y2);
        } else {
            var offX = size;
            ctx.moveTo(x1, neckStart);
            ctx.bezierCurveTo(x1 + offX*0.15, neckStart, x1 + offX*0.4, neckStart - tabSize*0.15, midX + offX*0.55, neckStart - tabSize*0.18);
            ctx.bezierCurveTo(midX + offX*1.05, neckStart - tabSize*0.22, midX + offX*1.15, midY - tabSize*0.28, midX + offX, midY);
            ctx.bezierCurveTo(midX + offX*1.15, midY + tabSize*0.28, midX + offX*1.05, neckEnd + tabSize*0.22, midX + offX*0.55, neckEnd + tabSize*0.18);
            ctx.bezierCurveTo(x1 + offX*0.4, neckEnd + tabSize*0.15, x1 + offX*0.15, neckEnd, x1, neckEnd);
            ctx.lineTo(x2, y2);
        }
    }

    function createJigsawPath(x, y, w, h, shape) {
        var ctx = state.ctx;
        var tabSize = Math.min(w, h) * 0.22;

        ctx.beginPath();
        ctx.moveTo(x, y);

        if (shape.top === 0) ctx.lineTo(x + w, y);
        else drawTab(x, y, x + w, y, shape.top * tabSize, 'h');

        if (shape.right === 0) ctx.lineTo(x + w, y + h);
        else drawTab(x + w, y, x + w, y + h, shape.right * tabSize, 'v');

        if (shape.bottom === 0) ctx.lineTo(x, y + h);
        else drawTab(x + w, y + h, x, y + h, -shape.bottom * tabSize, 'h');

        if (shape.left === 0) ctx.lineTo(x, y);
        else drawTab(x, y + h, x, y, -shape.left * tabSize, 'v');

        ctx.closePath();
    }

    function drawTab(x1, y1, x2, y2, size, dir) {
        var ctx = state.ctx;
        var midX = (x1 + x2) / 2;
        var midY = (y1 + y2) / 2;
        var len = Math.abs(dir === 'h' ? x2 - x1 : y2 - y1);
        var neckW = len * 0.32;
        var neckStart = (dir === 'h' ? midX : midY) - neckW / 2;
        var neckEnd = (dir === 'h' ? midX : midY) + neckW / 2;
        var tabSize = Math.min(Math.abs(x2-x1), Math.abs(y2-y1)) * 0.22;

        if (dir === 'h') {
            var offY = size;
            ctx.lineTo(neckStart, y1);
            ctx.bezierCurveTo(neckStart, y1 + offY*0.15, neckStart - tabSize*0.15, y1 + offY*0.4, neckStart - tabSize*0.18, midY + offY*0.55);
            ctx.bezierCurveTo(neckStart - tabSize*0.22, midY + offY*1.05, midX - tabSize*0.28, midY + offY*1.15, midX, midY + offY);
            ctx.bezierCurveTo(midX + tabSize*0.28, midY + offY*1.15, neckEnd + tabSize*0.22, midY + offY*1.05, neckEnd + tabSize*0.18, midY + offY*0.55);
            ctx.bezierCurveTo(neckEnd + tabSize*0.15, y1 + offY*0.4, neckEnd, y1 + offY*0.15, neckEnd, y1);
            ctx.lineTo(x2, y2);
        } else {
            var offX = size;
            ctx.lineTo(x1, neckStart);
            ctx.bezierCurveTo(x1 + offX*0.15, neckStart, x1 + offX*0.4, neckStart - tabSize*0.15, midX + offX*0.55, neckStart - tabSize*0.18);
            ctx.bezierCurveTo(midX + offX*1.05, neckStart - tabSize*0.22, midX + offX*1.15, midY - tabSize*0.28, midX + offX, midY);
            ctx.bezierCurveTo(midX + offX*1.15, midY + tabSize*0.28, midX + offX*1.05, neckEnd + tabSize*0.22, midX + offX*0.55, neckEnd + tabSize*0.18);
            ctx.bezierCurveTo(x1 + offX*0.4, neckEnd + tabSize*0.15, x1 + offX*0.15, neckEnd, x1, neckEnd);
            ctx.lineTo(x2, y2);
        }
    }

    function getCoords(e) {
        var canvas = state.canvas;
        var rect = canvas.getBoundingClientRect();
        var scaleX = canvas.width / rect.width;
        var scaleY = canvas.height / rect.height;
        return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    }

    function handleStart(e) {
        if (state.isPaused || state.isComplete) return;
        var coords = getCoords(e);
        var x = coords.x;
        var y = coords.y;
        var i;
        
        // Ищем кусочек под курсором (сначала неустановленные)
        for (i = state.pieces.length - 1; i >= 0; i--) {
            var p = state.pieces[i];
            if (p.isPlaced) continue;
            if (x >= p.currentX - 10 && x <= p.currentX + p.width + 10 &&
                y >= p.currentY - 10 && y <= p.currentY + p.height + 10) {
                state.dragPiece = p;
                state.dragOffsetX = x - p.currentX;
                state.dragOffsetY = y - p.currentY;
                
                // Находим группу кусочков, которые нужно перемещать вместе
                state.draggedGroup = findGroup(p);
                
                // Сохраняем смещения для каждого кусочка в группе
                for (var j = 0; j < state.draggedGroup.length; j++) {
                    var gp = state.draggedGroup[j];
                    gp.dragOffsetX = gp.currentX - p.currentX;
                    gp.dragOffsetY = gp.currentY - p.currentY;
                }
                
                // Удаляем все кусочки группы из массива и добавляем в конец (чтобы рисовались сверху)
                for (var k = state.draggedGroup.length - 1; k >= 0; k--) {
                    var gp = state.draggedGroup[k];
                    var idx = state.pieces.indexOf(gp);
                    if (idx !== -1) {
                        state.pieces.splice(idx, 1);
                        state.pieces.push(gp);
                    }
                }
                break;
            }
        }
    }

    function handleMove(e) {
        if (!state.dragPiece) return;
        var coords = getCoords(e);
        
        // Двигаем главный кусочек
        var newX = coords.x - state.dragOffsetX;
        var newY = coords.y - state.dragOffsetY;
        
        // Ограничение: кусочки не могут выйти за рыжую границу
        var borderMargin = 5;
        var maxX = CONFIG.canvasWidth - state.dragPiece.width - borderMargin;
        var maxY = CONFIG.canvasHeight - state.dragPiece.height - borderMargin;
        newX = Math.max(borderMargin, Math.min(maxX, newX));
        newY = Math.max(borderMargin, Math.min(maxY, newY));
        
        state.dragPiece.currentX = newX;
        state.dragPiece.currentY = newY;
        
        // Двигаем остальные кусочки группы
        for (var i = 0; i < state.draggedGroup.length; i++) {
            var gp = state.draggedGroup[i];
            if (gp !== state.dragPiece) {
                gp.currentX = newX + gp.dragOffsetX;
                gp.currentY = newY + gp.dragOffsetY;
                
                // Также ограничиваем группу
                var gpMaxX = CONFIG.canvasWidth - gp.width - borderMargin;
                var gpMaxY = CONFIG.canvasHeight - gp.height - borderMargin;
                gp.currentX = Math.max(borderMargin, Math.min(gpMaxX, gp.currentX));
                gp.currentY = Math.max(borderMargin, Math.min(gpMaxY, gp.currentY));
            }
        }
    }

    function handleEnd() {
        if (!state.dragPiece) return;
        var p = state.dragPiece;
        state.dragPiece = null;
        state.draggedGroup = [];
        state.moveCount++;

        var dx = p.currentX - p.correctX;
        var dy = p.currentY - p.correctY;
        var dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < CONFIG.snapRadius) {
            p.currentX = p.correctX;
            p.currentY = p.correctY;
            p.isPlaced = true;
            state.comboCount++;
            checkAchievement('combo', state.comboCount >= 5);
            checkAchievements();
            if (state.pieces.every(function(piece) { return piece.isPlaced; })) {
                state.isComplete = true;
                checkAchievements();
                saveAchievements();
                drawCompletedImage();
                showCompletion();
            }
        } else {
            state.mistakes++;
            state.comboCount = 0;
        }
        saveState();
        updateUI();
    }

    function drawCompletedImage() {
        if (!state.ctx || !state.image) return;
        var ctx = state.ctx;
        var canvas = state.canvas;
        var img = state.image;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        var rows = CONFIG.rows;
        var cols = CONFIG.cols;
        var pieceW = img.width / cols;
        var pieceH = img.height / rows;
        var scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.7;
        var displayW = img.width * scale;
        var displayH = img.height * scale;
        var offsetX = (canvas.width - displayW) / 2;
        var offsetY = (canvas.height - displayH) / 2;
        var dpW = pieceW * scale;
        var dpH = pieceH * scale;

        for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
                var x = offsetX + c * dpW;
                var y = offsetY + r * dpH;
                var srcX = c * pieceW;
                var srcY = r * pieceH;

                ctx.save();
                ctx.drawImage(img, srcX, srcY, pieceW, pieceH, x, y, dpW, dpH);
                ctx.restore();
            }
        }
    }

    function checkAchievements() {
        var placed = state.pieces.filter(function(p) { return p.isPlaced; }).length;
        var total = state.pieces.length;
        var time = state.elapsedTime;

        state.achievements.forEach(function(ach) {
            if (ach.unlocked) return;
            var unlock = false;
            if (ach.id === 'first' && placed >= 1) unlock = true;
            if (ach.id === 'quarter' && placed >= total * 0.25) unlock = true;
            if (ach.id === 'half' && placed >= total * 0.5) unlock = true;
            if (ach.id === 'three_quarters' && placed >= total * 0.75) unlock = true;
            if (ach.id === 'speed_30' && state.isComplete && time < 30) unlock = true;
            if (ach.id === 'speed_60' && state.isComplete && time < 60) unlock = true;
            if (ach.id === 'speed_120' && state.isComplete && time < 120) unlock = true;
            if (ach.id === 'master' && state.isComplete) unlock = true;
            if (ach.id === 'perfect' && state.isComplete && state.mistakes === 0) unlock = true;
            if (ach.id === 'no_hints' && state.isComplete && !state.showImage) unlock = true;
            if (ach.id === 'quick_start' && placed >= 3 && time < 10) unlock = true;
            if (ach.id === 'patient' && time >= 600) unlock = true;

            if (unlock) {
                ach.unlocked = true;
                showToast(ach);
            }
        });
    }

    function checkAchievement(id, condition) {
        var ach = null;
        var i;
        for (i = 0; i < state.achievements.length; i++) {
            if (state.achievements[i].id === id) {
                ach = state.achievements[i];
                break;
            }
        }
        if (ach && !ach.unlocked && condition) {
            ach.unlocked = true;
            showToast(ach);
            saveAchievements();
        }
    }

    function togglePause() {
        state.isPaused = !state.isPaused;
        var btn = document.getElementById('bpPauseBtn');
        btn.innerHTML = state.isPaused ? '<span style="font-size:20px;">▶</span>' : '<span style="font-size:20px;">⏸</span>';

        var timerCloud = document.getElementById('bpTimer');

        if (state.isPaused) {
            if (timerCloud) timerCloud.style.color = '#ff6b35';

            var ctx = state.ctx;
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillRect(0, 0, state.canvas.width, state.canvas.height);
            ctx.fillStyle = '#1a1a1a';
            ctx.font = 'bold 48px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ПАУЗА', state.canvas.width / 2, state.canvas.height / 2);
        } else {
            if (timerCloud) timerCloud.style.color = '#ffffff';
            draw();
        }
    }

        state.showImage = !state.showImage;
        var btn = document.getElementById('bpShowBtn');
        if (state.showImage) {
            btn.style.background = '#ff6b35';
            btn.style.color = '#ffffff';
        } else {

    function startTimer() {
        state.timerInterval = setInterval(function() {
            if (!state.isPaused && !state.isComplete) {
                state.elapsedTime++;
                updateUI();
            }
        }, 1000);
    }

    function updateUI() {
        document.getElementById('bpTimer').textContent = formatTime(state.elapsedTime);
        var placed = state.pieces.filter(function(p) { return p.isPlaced; }).length;
        var total = state.pieces.length;

        var fill = document.getElementById('bpProgressBarFill');
        if (fill && total > 0) {
            var percent = (placed / total) * 100;
            fill.style.width = percent + '%';
        }
    }

    function formatTime(sec) {
        var m = Math.floor(sec / 60);
        var s = sec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function saveState() {
        var data = {
            pieces: state.pieces.map(function(p) {
                return { id: p.id, currentX: p.currentX, currentY: p.currentY, isPlaced: p.isPlaced };
            }),
            elapsedTime: state.elapsedTime,
            moveCount: state.moveCount,
            mistakes: state.mistakes
        };
        localStorage.setItem('bp_game_state', JSON.stringify(data));
    }

    function saveAchievements() {
        var unlocked = state.achievements.filter(function(a) { return a.unlocked; }).map(function(a) { return a.id; });
        localStorage.setItem('bp_achievements', JSON.stringify(unlocked));
    }

    function loadAchievements() {
        var saved = localStorage.getItem('bp_achievements');
        if (saved) {
            var unlocked = JSON.parse(saved);
            ACHIEVEMENTS.forEach(function(ach) {
                if (unlocked.indexOf(ach.id) !== -1) ach.unlocked = true;
            });
        }
    }

    function loadGamesCount() {
        state.gamesCount = parseInt(localStorage.getItem('bp_games_count') || '0');
    }

    function saveGamesCount() {
        state.gamesCount++;
        localStorage.setItem('bp_games_count', state.gamesCount.toString());
        checkAchievement('five_games', state.gamesCount >= 5);
        checkAchievement('ten_games', state.gamesCount >= 10);
    }

    createPage();
