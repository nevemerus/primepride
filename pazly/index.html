    function startGame() {
        const url = document.getElementById('bpUrlInput').value.trim();
        const rows = parseInt(document.getElementById('bpRows').value);
        const cols = parseInt(document.getElementById('bpCols').value);

        if (!url) { alert('Введите ссылку на изображение'); return; }

        CONFIG.imageUrl = url; CONFIG.rows = rows; CONFIG.cols = cols;
        state.isComplete = false; state.isPaused = false;
        state.elapsedTime = 0; state.moveCount = 0; state.mistakes = 0;
        state.pieces = []; state.showImage = false; state.comboCount = 0;
        state.achievements = ACHIEVEMENTS.map(a => ({...a}));
        loadAchievements();

        saveGamesCount();

        document.getElementById('bpStartScreen').style.display = 'none';
        document.getElementById('bpGameScreen').style.display = 'block';

        loadImage(url);
    }

    function backToMenu() {
        if (state.timerInterval) clearInterval(state.timerInterval);
        document.getElementById('bpStartScreen').style.display = 'block';
        document.getElementById('bpGameScreen').style.display = 'none';
    }

    function loadImage(url) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
            state.image = img;
            createPieces();
            startTimer();
            setupCanvas();
            draw();
            updateUI();
        };
        img.onerror = function() {
            alert('Не удалось загрузить изображение. Проверьте ссылку!');
        };
        img.src = url;
    }

    function createPieces() {
        const rows = CONFIG.rows, cols = CONFIG.cols;
        const imgW = state.image.width, imgH = state.image.height;
        const cW = CONFIG.canvasWidth, cH = CONFIG.canvasHeight;

        const pieceW = imgW / cols, pieceH = imgH / rows;
        const scale = Math.min(cW / imgW, cH / imgH) * 0.85;
        const displayW = imgW * scale, displayH = imgH * scale;
        const offsetX = (cW - displayW) / 2, offsetY = (cH - displayH) / 2;
        const dpW = pieceW * scale, dpH = pieceH * scale;

        const shapes = [];
        for (let r = 0; r < rows; r++) {
            shapes[r] = [];
            for (let c = 0; c < cols; c++) {
                shapes[r][c] = {
                    top: r === 0 ? 0 : -shapes[r-1][c].bottom,
                    right: c === cols-1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                    bottom: r === rows-1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                    left: c === 0 ? 0 : -shapes[r][c-1].right
                };
            }
        }

        state.pieces = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const correctX = offsetX + c * dpW;
                const correctY = offsetY + r * dpH;
                let startX, startY;
                do {
                    startX = Math.random() * (cW - dpW * 1.3);
                    startY = Math.random() * (cH - dpH * 1.3);
                } while (Math.abs(startX - correctX) < dpW * 2 && Math.abs(startY - correctY) < dpH * 2);

                state.pieces.push({
                    row: r, col: c, correctX, correctY,
                    currentX: startX, currentY: startY,
                    width: dpW, height: dpH,
                    shape: shapes[r][c],
                    isPlaced: false, id: `p_${r}_${c}`
                });
            }
        }
        restoreState();
    }

    function setupCanvas() {
        state.canvas = document.getElementById('bpCanvas');
        state.ctx = state.canvas.getContext('2d');

        state.canvas.addEventListener('mousedown', handleStart);
        state.canvas.addEventListener('mousemove', handleMove);
        state.canvas.addEventListener('mouseup', handleEnd);
        state.canvas.addEventListener('mouseleave', handleEnd);
        state.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e.touches[0]); }, {passive: false});
        state.canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e.touches[0]); }, {passive: false});
        state.canvas.addEventListener('touchend', (e) => { e.preventDefault(); handleEnd(); }, {passive: false});
    }

    function draw() {
        if (!state.ctx || !state.canvas) return;
        const ctx = state.ctx, canvas = state.canvas;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(60, 60, 60, 0.12)';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        if (state.pieces.length > 0) {
            const first = state.pieces[0], last = state.pieces[state.pieces.length - 1];
            ctx.strokeStyle = 'rgba(255, 107, 53, 0.4)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.strokeRect(first.correctX - 5, first.correctY - 5,
                last.correctX + last.width - first.correctX + 10,
                last.correctY + last.height - first.correctY + 10);
            ctx.setLineDash([]);
        }

        if (state.showImage && state.image) {
            ctx.globalAlpha = 0.2;
            const img = state.image;
            const scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.85;
            const dw = img.width * scale, dh = img.height * scale;
            const dx = (canvas.width - dw) / 2, dy = (canvas.height - dh) / 2;
            ctx.drawImage(img, dx, dy, dw, dh);
            ctx.globalAlpha = 1.0;
        }

        state.pieces.forEach(piece => {
            if (piece === state.dragPiece) return;
            drawJigsawPiece(piece, false);
        });
        if (state.dragPiece) drawJigsawPiece(state.dragPiece, true);

        if (!state.isComplete && !state.isPaused) requestAnimationFrame(draw);
    }

    function drawJigsawPiece(piece, isDragging) {
        if (!state.image) return;
        const ctx = state.ctx;

        ctx.save();
        createJigsawPath(piece.currentX, piece.currentY, piece.width, piece.height, piece.shape);
        ctx.clip();

        if (isDragging) {
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 6;
            ctx.shadowOffsetY = 6;
        }

        const img = state.image;
        const srcX = piece.col * (img.width / CONFIG.cols);
        const srcY = piece.row * (img.height / CONFIG.rows);
        const srcW = img.width / CONFIG.cols;
        const srcH = img.height / CONFIG.rows;

        ctx.drawImage(img, srcX, srcY, srcW, srcH,
            piece.currentX, piece.currentY, piece.width, piece.height);
        ctx.restore();

        ctx.save();
        createJigsawPath(piece.currentX, piece.currentY, piece.width, piece.height, piece.shape);
        if (piece.isPlaced) {
            ctx.strokeStyle = 'rgba(255, 107, 53, 0.9)';
            ctx.lineWidth = 3;
            ctx.stroke();
        } else {
            ctx.strokeStyle = isDragging ? 'rgba(255, 107, 53, 1)' : 'rgba(40, 40, 40, 0.5)';
            ctx.lineWidth = isDragging ? 3 : 1.5;
            ctx.stroke();
        }
        ctx.restore();
    }

    function createJigsawPath(x, y, w, h, shape) {
        const ctx = state.ctx;
        const tabSize = Math.min(w, h) * 0.22;

        ctx.beginPath();
        ctx.moveTo(x, y);

        if (shape.top === 0) ctx.lineTo(x + w, y);
        else drawTab(x, y, x + w, y, shape.top * tabSize, 'h');

        if (shape.right === 0) ctx.lineTo(x + w, y + h);
        else drawTab(x + w, y, x + w, y + h, shape.right * tabSize, 'v');

        if (shape.bottom === 0) ctx.lineTo(x, y + h);
        else drawTab(x + w, y + h, x, y + h, -shape.bottom * tabSize, 'h');

        if (shape.left === 0) ctx.lineTo(x, y);
        else drawTab(x, y + h, x, y, -shape.left * tabSize, 'v');

        ctx.closePath();
    }

    function drawTab(x1, y1, x2, y2, size, dir) {
        const ctx = state.ctx;
        const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;
        const len = Math.abs(dir === 'h' ? x2 - x1 : y2 - y1);
        const neckW = len * 0.32;
        const neckStart = (dir === 'h' ? midX : midY) - neckW / 2;
        const neckEnd = (dir === 'h' ? midX : midY) + neckW / 2;
        const tabSize = Math.min(Math.abs(x2-x1), Math.abs(y2-y1)) * 0.22;

        if (dir === 'h') {
            const offY = size;
            ctx.lineTo(neckStart, y1);
            ctx.bezierCurveTo(neckStart, y1 + offY*0.15, neckStart - tabSize*0.15, y1 + offY*0.4, neckStart - tabSize*0.18, midY + offY*0.55);
            ctx.bezierCurveTo(neckStart - tabSize*0.22, midY + offY*1.05, midX - tabSize*0.28, midY + offY*1.15, midX, midY + offY);
            ctx.bezierCurveTo(midX + tabSize*0.28, midY + offY*1.15, neckEnd + tabSize*0.22, midY + offY*1.05, neckEnd + tabSize*0.18, midY + offY*0.55);
            ctx.bezierCurveTo(neckEnd + tabSize*0.15, y1 + offY*0.4, neckEnd, y1 + offY*0.15, neckEnd, y1);
            ctx.lineTo(x2, y2);
        } else {
            const offX = size;
            ctx.lineTo(x1, neckStart);
            ctx.bezierCurveTo(x1 + offX*0.15, neckStart, x1 + offX*0.4, neckStart - tabSize*0.15, midX + offX*0.55, neckStart - tabSize*0.18);
            ctx.bezierCurveTo(midX + offX*1.05, neckStart - tabSize*0.22, midX + offX*1.15, midY - tabSize*0.28, midX + offX, midY);
            ctx.bezierCurveTo(midX + offX*1.15, midY + tabSize*0.28, midX + offX*1.05, neckEnd + tabSize*0.22, midX + offX*0.55, neckEnd + tabSize*0.18);
            ctx.bezierCurveTo(x1 + offX*0.4, neckEnd + tabSize*0.15, x1 + offX*0.15, neckEnd, x1, neckEnd);
            ctx.lineTo(x2, y2);
        }
    }

    function getCoords(e) {
        const rect = state.canvas.getBoundingClientRect();
        const scaleX = state.canvas.width / rect.width, scaleY = state.canvas.height / rect.height;
        return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    }

    function handleStart(e) {
        if (state.isPaused || state.isComplete) return;
        const {x, y} = getCoords(e);
        for (let i = state.pieces.length - 1; i >= 0; i--) {
            const p = state.pieces[i];
            if (p.isPlaced) continue;
            if (x >= p.currentX - 10 && x <= p.currentX + p.width + 10 &&
                y >= p.currentY - 10 && y <= p.currentY + p.height + 10) {
                state.dragPiece = p;
                state.dragOffsetX = x - p.currentX;
                state.dragOffsetY = y - p.currentY;
                state.pieces.splice(i, 1);
                state.pieces.push(p);
                break;
            }
        }
    }

    function handleMove(e) {
        if (!state.dragPiece) return;
        const {x, y} = getCoords(e);
        state.dragPiece.currentX = x - state.dragOffsetX;
        state.dragPiece.currentY = y - state.dragOffsetY;
    }

    function handleEnd() {
        if (!state.dragPiece) return;
        const p = state.dragPiece;
        state.dragPiece = null;
        state.moveCount++;

        const dx = p.currentX - p.correctX, dy = p.currentY - p.correctY;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < CONFIG.snapRadius) {
            p.currentX = p.correctX; p.currentY = p.correctY; p.isPlaced = true;
            state.comboCount++;
            checkAchievement('combo', state.comboCount >= 5);
            checkAchievements();
            if (state.pieces.every(piece => piece.isPlaced)) {
                state.isComplete = true;
                checkAchievements();
                saveAchievements();
                showCompletion();
            }
        } else {
            state.mistakes++;
            state.comboCount = 0;
        }
        saveState();
        updateUI();
    }

        overlay.style.background = 'rgba(255,255,255,0.95)';
        overlay.style.display = 'flex';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.zIndex = '100';

        box.style.textAlign = 'center';
        box.style.padding = '40px';

        emoji.textContent = '';
        emoji.style.fontSize = '64px';
        box.appendChild(emoji);

        title.style.fontWeight = '900';
        title.style.margin = '10px 0';

        text.textContent = `Пазл собран за ${formatTime(state.elapsedTime)}`;
        text.style.fontSize = '18px';
        text.style.color = '#666';
        text.style.marginBottom = '24px';
        box.appendChild(text);

        const btn = document.createElement('button');
        btn.textContent = 'Новая игра';
        btn.style.background = '#1a1a1a';
        btn.style.color = '#fff';
        btn.style.border = 'none';
        btn.style.borderRadius = '8px';
        btn.style.padding = '14px 36px';
        btn.style.fontSize = '16px';

    function checkAchievements() {
        const placed = state.pieces.filter(p => p.isPlaced).length;
        const total = state.pieces.length;
        const time = state.elapsedTime;

        state.achievements.forEach(ach => {
            if (ach.unlocked) return;
            let unlock = false;
            if (ach.id === 'first' && placed >= 1) unlock = true;
            if (ach.id === 'quarter' && placed >= total * 0.25) unlock = true;
            if (ach.id === 'half' && placed >= total * 0.5) unlock = true;
            if (ach.id === 'three_quarters' && placed >= total * 0.75) unlock = true;
            if (ach.id === 'speed_30' && state.isComplete && time < 30) unlock = true;
            if (ach.id === 'speed_60' && state.isComplete && time < 60) unlock = true;
            if (ach.id === 'speed_120' && state.isComplete && time < 120) unlock = true;
            if (ach.id === 'master' && state.isComplete) unlock = true;
            if (ach.id === 'perfect' && state.isComplete && state.mistakes === 0) unlock = true;
            if (ach.id === 'no_hints' && state.isComplete && !state.showImage) unlock = true;
            if (ach.id === 'quick_start' && placed >= 3 && time < 10) unlock = true;
            if (ach.id === 'patient' && time >= 600) unlock = true;

            if (unlock) {
                ach.unlocked = true;
                showToast(ach);
            }
        });
    }

    function checkAchievement(id, condition) {
        const ach = state.achievements.find(a => a.id === id);
        if (ach && !ach.unlocked && condition) {
            ach.unlocked = true;
            showToast(ach);
            saveAchievements();
        }
    }

    function showToast(ach) {
        const container = document.getElementById('bpToastContainer');
        const toast = document.createElement('div');
        toast.style.position = 'fixed';
        toast.style.top = '20px';
        toast.style.right = '20px';
        toast.style.zIndex = '10001';
        toast.style.animation = 'bpSlideIn 0.4s ease';

        const inner = document.createElement('div');
        inner.style.background = '#1a1a1a';
        inner.style.color = '#ffffff';
        inner.style.padding = '16px 24px';
        inner.style.borderRadius = '12px';
        inner.style.borderLeft = '4px solid #ff6b35';
        inner.style.boxShadow = '0 8px 30px rgba(0,0,0,0.3)';
        inner.style.minWidth = '280px';

        const title = document.createElement('div');
        title.textContent = `🏆 ${ach.title}`;
        title.style.fontWeight = '800';
        title.style.fontSize = '14px';
        title.style.color = '#ff6b35';
        title.style.marginBottom = '4px';
        title.style.textTransform = 'uppercase';
        title.style.letterSpacing = '1px';
        inner.appendChild(title);

        const desc = document.createElement('div');
        desc.textContent = ach.desc;
        desc.style.fontSize = '13px';
        desc.style.color = '#ccc';
        inner.appendChild(desc);

        toast.appendChild(inner);
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    function togglePause() {
        state.isPaused = !state.isPaused;
        const btn = document.getElementById('bpPauseBtn');
        btn.textContent = state.isPaused ? '▶' : '⏸';
        if (state.isPaused) {
            const ctx = state.ctx;
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillRect(0, 0, state.canvas.width, state.canvas.height);
            ctx.fillStyle = '#1a1a1a';
            ctx.font = 'bold 48px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ПАУЗА', state.canvas.width / 2, state.canvas.height / 2);
        } else {
            draw();
        }
    }

    function toggleShowImage() {
        state.showImage = !state.showImage;
        const btn = document.getElementById('bpShowBtn');
        if (state.showImage) {
            btn.style.background = '#ff6b35';
            btn.style.color = '#ffffff';
        } else {
            btn.style.background = '#ffffff';
            btn.style.color = '#ff6b35';
        }
    }

    function openAchievements() {
        renderAchievements();
        document.getElementById('bpAchOverlay').style.display = 'flex';
    }

    function renderAchievements() {
        const grid = document.getElementById('bpAchGrid');
        grid.innerHTML = '';
        state.achievements.forEach(ach => {
            const item = document.createElement('div');
            item.style.background = ach.unlocked ? 'linear-gradient(135deg, #fff5f0, #ffe8e0)' : '#f5f5f5';
            item.style.border = ach.unlocked ? '1px solid #ff6b35' : '1px solid #e0e0e0';
            item.style.borderRadius = '8px';
            item.style.padding = '12px';
            item.style.display = 'flex';
            item.style.alignItems = 'center';
            item.style.gap = '10px';
            item.style.transition = 'all 0.3s';

            const icon = document.createElement('span');
            icon.textContent = ach.unlocked ? ach.icon : '🔒';
            icon.style.fontSize = '22px';
            item.appendChild(icon);

            const content = document.createElement('div');
            const title = document.createElement('div');
            title.textContent = ach.title;
            title.style.fontSize = '12px';
            title.style.fontWeight = '700';
            title.style.color = '#1a1a1a';
            content.appendChild(title);

            const desc = document.createElement('div');
            desc.textContent = ach.desc;
            desc.style.fontSize = '10px';
            desc.style.color = '#666';
            desc.style.marginTop = '2px';
            content.appendChild(desc);

            item.appendChild(content);
            grid.appendChild(item);
        });
    }

    function startTimer() {
        state.timerInterval = setInterval(() => {
            if (!state.isPaused && !state.isComplete) {
                state.elapsedTime++;
                updateUI();
            }
        }, 1000);
    }

    function updateUI() {
        document.getElementById('bpTimer').textContent = formatTime(state.elapsedTime);
        const placed = state.pieces.filter(p => p.isPlaced).length;
        document.getElementById('bpCounter').textContent = `${placed} / ${state.pieces.length}`;
    }

    function formatTime(sec) {
        const m = Math.floor(sec / 60), s = sec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function saveState() {
        const data = {
            pieces: state.pieces.map(p => ({ id: p.id, currentX: p.currentX, currentY: p.currentY, isPlaced: p.isPlaced })),
            elapsedTime: state.elapsedTime, moveCount: state.moveCount, mistakes: state.mistakes
        };
        localStorage.setItem('bp_game_state', JSON.stringify(data));
    }

    function loadState() {
        const saved = localStorage.getItem('bp_game_state');
        if (saved) {
            const data = JSON.parse(saved);
            state.elapsedTime = data.elapsedTime || 0;
            state.moveCount = data.moveCount || 0;
            state.mistakes = data.mistakes || 0;
        }
    }

    function restoreState() {
        const saved = localStorage.getItem('bp_game_state');
        if (saved && state.pieces.length > 0) {
            const data = JSON.parse(saved);
            if (data.pieces) {
                data.pieces.forEach(sp => {
                    const p = state.pieces.find(piece => piece.id === sp.id);
                    if (p) { p.currentX = sp.currentX; p.currentY = sp.currentY; p.isPlaced = sp.isPlaced; }
                });
            }
        }
    }

    function saveAchievements() {
        const unlocked = state.achievements.filter(a => a.unlocked).map(a => a.id);
        localStorage.setItem('bp_achievements', JSON.stringify(unlocked));
    }

    function loadAchievements() {
        const saved = localStorage.getItem('bp_achievements');
        if (saved) {
            const unlocked = JSON.parse(saved);
            ACHIEVEMENTS.forEach(ach => { if (unlocked.includes(ach.id)) ach.unlocked = true; });
        }
    }

    function loadGamesCount() {
        state.gamesCount = parseInt(localStorage.getItem('bp_games_count') || '0');
    }

    function saveGamesCount() {
        state.gamesCount++;
        localStorage.setItem('bp_games_count', state.gamesCount.toString());
        checkAchievement('five_games', state.gamesCount >= 5);
        checkAchievement('ten_games', state.gamesCount >= 10);
    }
