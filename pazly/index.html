    function resetPan() {
        state.panOffsetX = 0;
        state.panOffsetY = 0;
        updatePan();
    }

    function cycleBackgroundColor() {
        state.bgColorIndex = (state.bgColorIndex + 1) % BG_COLORS.length;
        var newColor = BG_COLORS[state.bgColorIndex];
        setBackgroundColor(newColor);
        
        if (state.bgColorIndex !== 3) {
            state.useBackgroundImage = false;
        } else {
            state.useBackgroundImage = true;
        }
        
        var btn = document.getElementById('bpBgColorBtn');
        if (btn) {
            btn.style.background = newColor;
        }
    }

    function setBackgroundColor(color) {
        state.backgroundColor = color;
        var canvasArea = document.getElementById('bpCanvasArea');
        if (canvasArea) {
            canvasArea.style.background = color;
        }
    }

    function toggleFullscreen() {
        var container = document.getElementById('bpGameContainer');
        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
            if (container.requestFullscreen) container.requestFullscreen();
            else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
            else if (container.mozRequestFullScreen) container.mozRequestFullScreen();
            else if (container.msRequestFullscreen) container.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        }
    }

    function changeZoom(delta) {
        var newZoom = Math.max(0.2, Math.min(3, state.zoomLevel + delta));
        setZoom(newZoom);
    }

    function setZoom(zoom) {
        state.zoomLevel = Math.max(0.2, Math.min(3, zoom));
        updatePan();
    }

    function updatePan() {
        var wrapper = document.getElementById('bpCanvasWrapper');
        if (wrapper) {
            wrapper.style.transform = 'translate(' + state.panOffsetX + 'px, ' + state.panOffsetY + 'px) scale(' + state.zoomLevel + ')';
        }
    }

    function updatePiecesInfo() {
        var rows = parseInt(document.getElementById('bpRows').value);
        var cols = parseInt(document.getElementById('bpCols').value);
        var total = rows * cols;
        var info = document.getElementById('bpPiecesInfo');
        var difficulty = '';
        if (total <= 9) difficulty = ' (Легко)';
        else if (total <= 20) difficulty = ' (Средне)';
        else if (total <= 36) difficulty = ' (Сложно)';
        else if (total <= 64) difficulty = ' (Очень сложно)';
        else difficulty = ' (Эксперт)';
        info.textContent = 'Всего кусочков: ' + total + difficulty;
    }

        var segments = document.getElementById('bpProgressBarSegments');
        if (!segments) return;
        segments.innerHTML = '';
        var total = state.pieces.length;
        if (total === 0) return;
        for (var i = 0; i < total; i++) {
            var seg = document.createElement('div');
            seg.style.flex = '1';
            seg.style.borderRight = i < total - 1 ? '1px solid rgba(255,107,53,0.4)' : 'none';
            seg.style.height = '100%';
            segments.appendChild(seg);
        }
    }

    function startGame() {
        var url = document.getElementById('bpUrlInput').value.trim();

        var cols = parseInt(document.getElementById('bpCols').value);

        if (!url) { alert('Введите ссылку на изображение'); return; }

        localStorage.removeItem('bp_game_state');

        CONFIG.imageUrl = url;
        CONFIG.rows = rows;
        CONFIG.cols = cols;

        var totalPieces = rows * cols;
        CONFIG.snapRadius = Math.max(15, Math.min(30, 80 / Math.sqrt(totalPieces)));

        state.isComplete = false;
        state.isPaused = false;
        state.elapsedTime = 0;
        state.moveCount = 0;
        state.mistakes = 0;
        state.pieces = [];
        state.showImage = false;
        state.comboCount = 0;
        state.dragPiece = null;
        state.draggedGroup = [];
        state.groupOffsets = {};
        state.zoomLevel = 1;
        state.bgColorIndex = 3;
        state.useBackgroundImage = true;
        state.timerColorBeforePause = '#ff6b35';
        state.isPanning = false;
        state.panOffsetX = 0;
        state.panOffsetY = 0;

        state.achievements = ACHIEVEMENTS.map(function(a) {

    function loadImage(url) {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
            state.image = img;
            
            var bgImg = new Image();
            bgImg.crossOrigin = 'anonymous';
            bgImg.onload = function() {
                state.backgroundImage = bgImg;
                createPieces();
                buildProgressBar();
                startTimer();
                setupCanvas();
                draw();
                updateUI();
            };
            bgImg.onerror = function() {
                state.backgroundImage = null;
                createPieces();
                buildProgressBar();
                startTimer();
                setupCanvas();
                draw();
                updateUI();
            };
            bgImg.src = CONFIG.backgroundUrl;
        };
        img.onerror = function() {
            alert('Не удалось загрузить изображение. Проверьте ссылку!');
        };
        img.src = url;
    }

    function createPieces() {
        var rows = CONFIG.rows;
        var cols = CONFIG.cols;
        var imgW = state.image.width;
        var imgH = state.image.height;
        var cW = CONFIG.canvasWidth;
        var cH = CONFIG.canvasHeight;

        var pieceW = imgW / cols;
        var pieceH = imgH / rows;
        var scale = Math.min(cW / imgW, cH / imgH) * 0.6;
        var displayW = imgW * scale;
        var displayH = imgH * scale;
        var offsetX = (cW - displayW) / 2;
        var offsetY = (cH - displayH) / 2;
        var dpW = pieceW * scale;
        var dpH = pieceH * scale;

        state.assemblyX = offsetX;
        state.assemblyY = offsetY;
        state.assemblyW = displayW;
        state.assemblyH = displayH;

        var shapes = [];
        var r, c;
        for (r = 0; r < rows; r++) {
            shapes[r] = [];
            for (c = 0; c < cols; c++) {
                shapes[r][c] = {
                    top: r === 0 ? 0 : -shapes[r-1][c].bottom,
                    right: c === cols-1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                    bottom: r === rows-1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                    left: c === 0 ? 0 : -shapes[r][c-1].right
                };
            }
        }

        state.pieces = [];
        for (r = 0; r < rows; r++) {
            for (c = 0; c < cols; c++) {
                var correctX = offsetX + c * dpW;
                var correctY = offsetY + r * dpH;
                var startX, startY;
                var attempts = 0;
                do {
                    startX = Math.random() * (cW - dpW * 1.5);
                    startY = Math.random() * (cH - dpH * 1.5);
                    attempts++;
                } while (attempts < 100 && Math.abs(startX - correctX) < dpW * 1.5 && Math.abs(startY - correctY) < dpH * 1.5);

                state.pieces.push({
                    row: r, col: c,
                    correctX: correctX, correctY: correctY,
                    currentX: startX, currentY: startY,
                    width: dpW, height: dpH,
                    shape: shapes[r][c],
                    isPlaced: false,
                    groupId: 'p_' + r + '_' + c,
                    id: 'p_' + r + '_' + c
                });
            }
        }
    }

    function setupCanvas() {
        state.canvas = document.getElementById('bpCanvas');
        state.ctx = state.canvas.getContext('2d');

        state.canvas.addEventListener('mousedown', handleStart);
        state.canvas.addEventListener('mousemove', handleMove);
        state.canvas.addEventListener('mouseup', handleEnd);
        state.canvas.addEventListener('mouseleave', handleEnd);
        state.canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        
        state.canvas.addEventListener('touchstart', function(e) { e.preventDefault(); handleStart(e.touches[0]); }, {passive: false});
        state.canvas.addEventListener('touchmove', function(e) { e.preventDefault(); handleMove(e.touches[0]); }, {passive: false});
        state.canvas.addEventListener('touchend', function(e) { e.preventDefault(); handleEnd(); }, {passive: false});

        var canvasArea = document.getElementById('bpCanvasArea');
        
        canvasArea.addEventListener('mousedown', function(e) {
            if (e.button === 2) {
                e.preventDefault();
                state.isPanning = true;
                state.panStartX = e.clientX - state.panOffsetX;
                state.panStartY = e.clientY - state.panOffsetY;
                canvasArea.style.cursor = 'grabbing';
            }
        });
        
        canvasArea.addEventListener('mousemove', function(e) {
            if (state.isPanning) {
                state.panOffsetX = e.clientX - state.panStartX;
                state.panOffsetY = e.clientY - state.panStartY;
                updatePan();
            }
        });
        
        canvasArea.addEventListener('mouseup', function(e) {
            if (e.button === 2 && state.isPanning) {
                state.isPanning = false;
                canvasArea.style.cursor = 'grab';
            }
        });
        
        canvasArea.addEventListener('mouseleave', function() {
            if (state.isPanning) {
                state.isPanning = false;
                canvasArea.style.cursor = 'grab';
            }
        });
        
        canvasArea.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        canvasArea.addEventListener('wheel', function(e) {
            e.preventDefault();
            var delta = e.deltaY > 0 ? -0.2 : 0.2;
            changeZoom(delta);
        }, {passive: false});

        var pinchStartDist = 0;
        var pinchStartZoom = 1;
        canvasArea.addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                var dx = e.touches[0].clientX - e.touches[1].clientX;
                var dy = e.touches[0].clientY - e.touches[1].clientY;
                pinchStartDist = Math.sqrt(dx*dx + dy*dy);
                pinchStartZoom = state.zoomLevel;
            }
        }, {passive: false});
        canvasArea.addEventListener('touchmove', function(e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                var dx = e.touches[0].clientX - e.touches[1].clientX;
                var dy = e.touches[0].clientY - e.touches[1].clientY;
                var dist = Math.sqrt(dx*dx + dy*dy);
                var scale = dist / pinchStartDist;
                setZoom(pinchStartZoom * scale);
            }
        }, {passive: false});
    }

    function getGroup(piece) {
        return state.pieces.filter(function(p) {
            return p.groupId === piece.groupId && !p.isPlaced;
        });
    }

    function isPiecePlacedAt(row, col) {
        var i;
        for (i = 0; i < state.pieces.length; i++) {
            if (state.pieces[i].row === row && state.pieces[i].col === col && state.pieces[i].isPlaced) {
                return state.pieces[i];
            }
        }
        return null;
    }

    function getOpenEdges(piece) {
        var row = piece.row;
        var col = piece.col;
        var rows = CONFIG.rows;
        var cols = CONFIG.cols;
        return {
            top: row === 0 || !isPiecePlacedAt(row - 1, col),
            right: col === cols - 1 || !isPiecePlacedAt(row, col + 1),
            bottom: row === rows - 1 || !isPiecePlacedAt(row + 1, col),
            left: col === 0 || !isPiecePlacedAt(row, col - 1)
        };
    }

    function draw() {
        if (!state.ctx || !state.canvas) return;
        var ctx = state.ctx;
        var canvas = state.canvas;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (state.useBackgroundImage && state.backgroundImage) {
            ctx.save();
            ctx.globalAlpha = 0.25;
            ctx.drawImage(state.backgroundImage, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        ctx.fillStyle = state.backgroundColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255, 107, 53, 0.4)';
        ctx.lineWidth = 3;
        ctx.setLineDash([15, 10]);
        ctx.strokeRect(state.assemblyX - 10, state.assemblyY - 10,
            state.assemblyW + 20, state.assemblyH + 20);
        ctx.setLineDash([]);

        var borderMargin = 5;
        ctx.strokeStyle = 'rgba(255, 107, 53, 0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.strokeRect(borderMargin, borderMargin,
            canvas.width - borderMargin * 2, canvas.height - borderMargin * 2);

        if (state.showImage && state.image) {
            ctx.globalAlpha = 0.15;
            var img = state.image;
            var sc = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.6;
            var dw = img.width * sc;
            var dh = img.height * sc;
            var dx = (canvas.width - dw) / 2;
            var dy = (canvas.height - dh) / 2;
            ctx.drawImage(img, dx, dy, dw, dh);
            ctx.globalAlpha = 1.0;
        }

        var piecesToDraw = state.pieces.slice().sort(function(a, b) {
            if (a.isPlaced && !b.isPlaced) return 1;
            if (!a.isPlaced && b.isPlaced) return -1;
            return 0;
        });

        var i;
        for (i = 0; i < piecesToDraw.length; i++) {
            var piece = piecesToDraw[i];
            if (piece.isPlaced && piece !== state.dragPiece && state.draggedGroup.indexOf(piece) === -1) {
                drawJigsawPiece(piece, false, true);
            }
        }
        for (i = 0; i < piecesToDraw.length; i++) {
            var piece = piecesToDraw[i];
            if (piece.isPlaced && piece !== state.dragPiece && state.draggedGroup.indexOf(piece) === -1) {
                drawOpenEdges(piece);
            }
        }
        for (i = 0; i < piecesToDraw.length; i++) {
            var piece = piecesToDraw[i];
            if (!piece.isPlaced && piece !== state.dragPiece && state.draggedGroup.indexOf(piece) === -1) {
                drawJigsawPiece(piece, false, false);
            }
        }
        
        if (state.dragPiece) {
            drawJigsawPiece(state.dragPiece, true, false);
            for (i = 0; i < state.draggedGroup.length; i++) {
                var groupPiece = state.draggedGroup[i];
                if (groupPiece !== state.dragPiece) {
                    drawJigsawPiece(groupPiece, true, false);
                }
            }
        }

        if (!state.isComplete && !state.isPaused) {
            requestAnimationFrame(draw);
        }
    }

    function drawJigsawPiece(piece, isDragging, isPlaced) {
        if (!state.image) return;
        var ctx = state.ctx;

        var img = state.image;
        var srcX = piece.col * (img.width / CONFIG.cols);
        var srcY = piece.row * (img.height / CONFIG.rows);
        var srcW = img.width / CONFIG.cols;
        var srcH = img.height / CONFIG.rows;

        if (isPlaced) {
            var overlap = 3;
            ctx.save();
            ctx.drawImage(img, srcX, srcY, srcW, srcH,
                piece.currentX - overlap, piece.currentY - overlap,
                piece.width + overlap * 2, piece.height + overlap * 2);
            ctx.restore();
        } else {
            ctx.save();
            createJigsawPath(piece.currentX, piece.currentY, piece.width, piece.height, piece.shape);
            ctx.clip();

            if (isDragging) {
                ctx.shadowColor = 'rgba(255,107,53,0.6)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetX = 8;
                ctx.shadowOffsetY = 8;
            }

            ctx.drawImage(img, srcX, srcY, srcW, srcH,
                piece.currentX, piece.currentY, piece.width, piece.height);
            ctx.restore();

            ctx.save();
            createJigsawPath(piece.currentX, piece.currentY, piece.width, piece.height, piece.shape);
            ctx.strokeStyle = isDragging ? 'rgba(255, 107, 53, 1)' : 'rgba(255, 107, 53, 0.5)';
            ctx.lineWidth = isDragging ? 3 : 1.5;
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawOpenEdges(piece) {
        var ctx = state.ctx;
        var edges = getOpenEdges(piece);
        var tabSize = Math.min(piece.width, piece.height) * 0.22;

        ctx.save();
        ctx.strokeStyle = 'rgba(255, 107, 53, 0.9)';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (edges.top) {
            ctx.beginPath();
            if (piece.shape.top === 0) {
                ctx.moveTo(piece.currentX, piece.currentY);
                ctx.lineTo(piece.currentX + piece.width, piece.currentY);
            } else {
                drawTabPath(piece.currentX, piece.currentY, piece.currentX + piece.width, piece.currentY, piece.shape.top * tabSize, 'h');
            }
            ctx.stroke();
        }
        if (edges.right) {
            ctx.beginPath();
            if (piece.shape.right === 0) {
                ctx.moveTo(piece.currentX + piece.width, piece.currentY);
                ctx.lineTo(piece.currentX + piece.width, piece.currentY + piece.height);
            } else {
                drawTabPath(piece.currentX + piece.width, piece.currentY, piece.currentX + piece.width, piece.currentY + piece.height, piece.shape.right * tabSize, 'v');
            }
            ctx.stroke();
        }
        if (edges.bottom) {
            ctx.beginPath();
            if (piece.shape.bottom === 0) {
                ctx.moveTo(piece.currentX + piece.width, piece.currentY + piece.height);
                ctx.lineTo(piece.currentX, piece.currentY + piece.height);
            } else {
                drawTabPath(piece.currentX + piece.width, piece.currentY + piece.height, piece.currentX, piece.currentY + piece.height, -piece.shape.bottom * tabSize, 'h');
            }
            ctx.stroke();
        }
        if (edges.left) {
            ctx.beginPath();
            if (piece.shape.left === 0) {
                ctx.moveTo(piece.currentX, piece.currentY + piece.height);
                ctx.lineTo(piece.currentX, piece.currentY);
            } else {
                drawTabPath(piece.currentX, piece.currentY + piece.height, piece.currentX, piece.currentY, -piece.shape.left * tabSize, 'v');
            }
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawTabPath(x1, y1, x2, y2, size, dir) {
        var ctx = state.ctx;
        var midX = (x1 + x2) / 2;
        var midY = (y1 + y2) / 2;
        var len = Math.abs(dir === 'h' ? x2 - x1 : y2 - y1);
        var neckW = len * 0.32;
        var neckStart = (dir === 'h' ? midX : midY) - neckW / 2;
        var neckEnd = (dir === 'h' ? midX : midY) + neckW / 2;
        var tabSize = Math.min(Math.abs(x2-x1), Math.abs(y2-y1)) * 0.22;

        if (dir === 'h') {
            var offY = size;
            ctx.moveTo(neckStart, y1);
            ctx.bezierCurveTo(neckStart, y1 + offY*0.15, neckStart - tabSize*0.15, y1 + offY*0.4, neckStart - tabSize*0.18, midY + offY*0.55);
            ctx.bezierCurveTo(neckStart - tabSize*0.22, midY + offY*1.05, midX - tabSize*0.28, midY + offY*1.15, midX, midY + offY);
            ctx.bezierCurveTo(midX + tabSize*0.28, midY + offY*1.15, neckEnd + tabSize*0.22, midY + offY*1.05, neckEnd + tabSize*0.18, midY + offY*0.55);
            ctx.bezierCurveTo(neckEnd + tabSize*0.15, y1 + offY*0.4, neckEnd, y1 + offY*0.15, neckEnd, y1);
            ctx.lineTo(x2, y2);
        } else {
            var offX = size;
            ctx.moveTo(x1, neckStart);
            ctx.bezierCurveTo(x1 + offX*0.15, neckStart, x1 + offX*0.4, neckStart - tabSize*0.15, midX + offX*0.55, neckStart - tabSize*0.18);
            ctx.bezierCurveTo(midX + offX*1.05, neckStart - tabSize*0.22, midX + offX*1.15, midY - tabSize*0.28, midX + offX, midY);
            ctx.bezierCurveTo(midX + offX*1.15, midY + tabSize*0.28, midX + offX*1.05, neckEnd + tabSize*0.22, midX + offX*0.55, neckEnd + tabSize*0.18);
            ctx.bezierCurveTo(x1 + offX*0.4, neckEnd + tabSize*0.15, x1 + offX*0.15, neckEnd, x1, neckEnd);
            ctx.lineTo(x2, y2);
        }
    }

    function createJigsawPath(x, y, w, h, shape) {
        var ctx = state.ctx;
        var tabSize = Math.min(w, h) * 0.22;

        ctx.beginPath();
        ctx.moveTo(x, y);

        if (shape.top === 0) ctx.lineTo(x + w, y);
        else drawTab(x, y, x + w, y, shape.top * tabSize, 'h');

        if (shape.right === 0) ctx.lineTo(x + w, y + h);
        else drawTab(x + w, y, x + w, y + h, shape.right * tabSize, 'v');

        if (shape.bottom === 0) ctx.lineTo(x, y + h);
        else drawTab(x + w, y + h, x, y + h, -shape.bottom * tabSize, 'h');

        if (shape.left === 0) ctx.lineTo(x, y);
        else drawTab(x, y + h, x, y, -shape.left * tabSize, 'v');

        ctx.closePath();
    }

    function drawTab(x1, y1, x2, y2, size, dir) {
        var ctx = state.ctx;
        var midX = (x1 + x2) / 2;
        var midY = (y1 + y2) / 2;
        var len = Math.abs(dir === 'h' ? x2 - x1 : y2 - y1);
        var neckW = len * 0.32;
        var neckStart = (dir === 'h' ? midX : midY) - neckW / 2;
        var neckEnd = (dir === 'h' ? midX : midY) + neckW / 2;
        var tabSize = Math.min(Math.abs(x2-x1), Math.abs(y2-y1)) * 0.22;

        if (dir === 'h') {
            var offY = size;
            ctx.lineTo(neckStart, y1);
            ctx.bezierCurveTo(neckStart, y1 + offY*0.15, neckStart - tabSize*0.15, y1 + offY*0.4, neckStart - tabSize*0.18, midY + offY*0.55);
            ctx.bezierCurveTo(neckStart - tabSize*0.22, midY + offY*1.05, midX - tabSize*0.28, midY + offY*1.15, midX, midY + offY);
            ctx.bezierCurveTo(midX + tabSize*0.28, midY + offY*1.15, neckEnd + tabSize*0.22, midY + offY*1.05, neckEnd + tabSize*0.18, midY + offY*0.55);
            ctx.bezierCurveTo(neckEnd + tabSize*0.15, y1 + offY*0.4, neckEnd, y1 + offY*0.15, neckEnd, y1);
            ctx.lineTo(x2, y2);
        } else {
            var offX = size;
            ctx.lineTo(x1, neckStart);
            ctx.bezierCurveTo(x1 + offX*0.15, neckStart, x1 + offX*0.4, neckStart - tabSize*0.15, midX + offX*0.55, neckStart - tabSize*0.18);
            ctx.bezierCurveTo(midX + offX*1.05, neckStart - tabSize*0.22, midX + offX*1.15, midY - tabSize*0.28, midX + offX, midY);
            ctx.bezierCurveTo(midX + offX*1.15, midY + tabSize*0.28, midX + offX*1.05, neckEnd + tabSize*0.22, midX + offX*0.55, neckEnd + tabSize*0.18);
            ctx.bezierCurveTo(x1 + offX*0.4, neckEnd + tabSize*0.15, x1 + offX*0.15, neckEnd, x1, neckEnd);
            ctx.lineTo(x2, y2);
        }
    }

    function getCoords(e) {
        var canvas = state.canvas;
        var rect = canvas.getBoundingClientRect();
        var scaleX = canvas.width / rect.width;
        var scaleY = canvas.height / rect.height;
        return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    }

    function getGroupBounds(group) {
        var minX = Infinity, minY = Infinity;
        var maxX = -Infinity, maxY = -Infinity;
        
        for (var i = 0; i < group.length; i++) {
            var p = group[i];
            minX = Math.min(minX, p.currentX);
            minY = Math.min(minY, p.currentY);
            maxX = Math.max(maxX, p.currentX + p.width);
            maxY = Math.max(maxY, p.currentY + p.height);
        }
        
        return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
    }

    function handleStart(e) {
        if (state.isPaused || state.isComplete || state.isPanning) return;
        var coords = getCoords(e);
        var x = coords.x;
        var y = coords.y;
        var i;
        
        for (i = state.pieces.length - 1; i >= 0; i--) {
            var p = state.pieces[i];
            if (p.isPlaced) continue;
            if (x >= p.currentX - 10 && x <= p.currentX + p.width + 10 &&
                y >= p.currentY - 10 && y <= p.currentY + p.height + 10) {
                
                state.dragPiece = p;
                state.draggedGroup = getGroup(p);
                state.dragOffsetX = x - p.currentX;
                state.dragOffsetY = y - p.currentY;
                
                state.groupOffsets = {};
                for (var k = 0; k < state.draggedGroup.length; k++) {
                    var gp = state.draggedGroup[k];
                    state.groupOffsets[gp.id] = {
                        x: gp.currentX - p.currentX,
                        y: gp.currentY - p.currentY
                    };
                }
                
                for (var k = state.draggedGroup.length - 1; k >= 0; k--) {
                    var gp = state.draggedGroup[k];
                    var idx = state.pieces.indexOf(gp);
                    if (idx !== -1) {
                        state.pieces.splice(idx, 1);
                        state.pieces.push(gp);
                    }
                }
                break;
            }
        }
    }

    function handleMove(e) {
        if (state.isPanning) return;
        if (!state.dragPiece) return;
        var coords = getCoords(e);
        
        var newX = coords.x - state.dragOffsetX;
        var newY = coords.y - state.dragOffsetY;
        
        var deltaX = newX - state.dragPiece.currentX;
        var deltaY = newY - state.dragPiece.currentY;
        
        var borderMargin = 5;
        var bounds = getGroupBounds(state.draggedGroup);
        
        var newMinX = bounds.minX + deltaX;
        var newMinY = bounds.minY + deltaY;
        var newMaxX = bounds.maxX + deltaX;
        var newMaxY = bounds.maxY + deltaY;
        
        if (newMinX < borderMargin) {
            deltaX += (borderMargin - newMinX);
        }
        if (newMinY < borderMargin) {
            deltaY += (borderMargin - newMinY);
        }
        if (newMaxX > CONFIG.canvasWidth - borderMargin) {
            deltaX -= (newMaxX - (CONFIG.canvasWidth - borderMargin));
        }
        if (newMaxY > CONFIG.canvasHeight - borderMargin) {
            deltaY -= (newMaxY - (CONFIG.canvasHeight - borderMargin));
        }
        
        for (var i = 0; i < state.draggedGroup.length; i++) {
            var gp = state.draggedGroup[i];
            gp.currentX += deltaX;
            gp.currentY += deltaY;
        }
    }

    function handleEnd() {
        if (state.isPanning) return;
        if (!state.dragPiece) return;
        var primary = state.dragPiece;
        state.dragPiece = null;
        state.moveCount++;

        var allCorrect = true;
        for (var i = 0; i < state.draggedGroup.length; i++) {
            var gp = state.draggedGroup[i];
            var dist = Math.sqrt(Math.pow(gp.currentX - gp.correctX, 2) + Math.pow(gp.currentY - gp.correctY, 2));
            if (dist >= CONFIG.snapRadius) {
                allCorrect = false;
                break;
            }
        }

        if (allCorrect) {
            for (var i = 0; i < state.draggedGroup.length; i++) {
                var gp = state.draggedGroup[i];
                gp.currentX = gp.correctX;
                gp.currentY = gp.correctY;
                gp.isPlaced = true;
            }
            state.comboCount += state.draggedGroup.length;
            checkAchievement('combo', state.comboCount >= 5);
            checkAchievements();
            
            if (state.pieces.every(function(piece) { return piece.isPlaced; })) {
                state.isComplete = true;
                checkAchievements();
                saveAchievements();
                drawCompletedImage();
                showCompletion();
            }
        } else {
            var pieceW = state.pieces[0].width;
            var pieceH = state.pieces[0].height;

            for (var i = 0; i < state.draggedGroup.length; i++) {
                var target = state.draggedGroup[i];
                
                for (var j = 0; j < state.pieces.length; j++) {
                    var other = state.pieces[j];
                    if (other.isPlaced || other.groupId === target.groupId) continue;

                    var isNeighbor = (Math.abs(target.row - other.row) + Math.abs(target.col - other.col)) === 1;
                    
                    if (isNeighbor) {
                        var expX = target.currentX + (other.col - target.col) * pieceW;
                        var expY = target.currentY + (other.row - target.row) * pieceH;

                        var dist = Math.sqrt(Math.pow(other.currentX - expX, 2) + Math.pow(other.currentY - expY, 2));
                        
                        if (dist < CONFIG.snapRadius) {
                            other.currentX = expX;
                            other.currentY = expY;
                            
                            var oldGroupId = other.groupId;
                            var newGroupId = target.groupId;

                            for (var k = 0; k < state.pieces.length; k++) {
                                if (state.pieces[k].groupId === oldGroupId) {
                                    state.pieces[k].groupId = newGroupId;
                                }
                            }
                        }
                    }
                }
            }
        }
        
        state.draggedGroup = [];
        state.groupOffsets = {};
        saveState();
        updateUI();
    }

    function drawCompletedImage() {
        if (!state.ctx || !state.image) return;
        var ctx = state.ctx;
        var canvas = state.canvas;
        var img = state.image;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        var rows = CONFIG.rows;
        var cols = CONFIG.cols;
        var pieceW = img.width / cols;
        var pieceH = img.height / rows;
        var scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.7;
        var displayW = img.width * scale;
        var displayH = img.height * scale;
        var offsetX = (canvas.width - displayW) / 2;
        var offsetY = (canvas.height - displayH) / 2;
        var dpW = pieceW * scale;
        var dpH = pieceH * scale;

        for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
                var x = offsetX + c * dpW;
                var y = offsetY + r * dpH;
                var srcX = c * pieceW;
                var srcY = r * pieceH;

                ctx.save();
                ctx.drawImage(img, srcX, srcY, pieceW, pieceH, x, y, dpW, dpH);
                ctx.restore();
            }
        }
    }

    function checkAchievements() {
        var placed = state.pieces.filter(function(p) { return p.isPlaced; }).length;
        var total = state.pieces.length;
        var time = state.elapsedTime;

        state.achievements.forEach(function(ach) {
            if (ach.unlocked) return;
            var unlock = false;
            if (ach.id === 'first' && placed >= 1) unlock = true;
            if (ach.id === 'quarter' && placed >= total * 0.25) unlock = true;
            if (ach.id === 'half' && placed >= total * 0.5) unlock = true;
            if (ach.id === 'three_quarters' && placed >= total * 0.75) unlock = true;
            if (ach.id === 'speed_30' && state.isComplete && time < 30) unlock = true;
            if (ach.id === 'speed_60' && state.isComplete && time < 60) unlock = true;
            if (ach.id === 'speed_120' && state.isComplete && time < 120) unlock = true;
            if (ach.id === 'master' && state.isComplete) unlock = true;
            if (ach.id === 'perfect' && state.isComplete && state.mistakes === 0) unlock = true;
            if (ach.id === 'no_hints' && state.isComplete && !state.showImage) unlock = true;
            if (ach.id === 'quick_start' && placed >= 3 && time < 10) unlock = true;
            if (ach.id === 'patient' && time >= 600) unlock = true;

            if (unlock) {
                ach.unlocked = true;
                showToast(ach);
            }
        });
    }

    function checkAchievement(id, condition) {
        var ach = null;
        var i;
        for (i = 0; i < state.achievements.length; i++) {
            if (state.achievements[i].id === id) {
                ach = state.achievements[i];
                break;
            }
        }
        if (ach && !ach.unlocked && condition) {
            ach.unlocked = true;
            showToast(ach);
            saveAchievements();
        }
    }

    function showToast(ach) {
        var container = document.getElementById('bpToastContainer');
        var toast = document.createElement('div');
        toast.style.position = 'fixed';
        toast.style.top = '20px';
        toast.style.right = '20px';
        toast.style.zIndex = '10001';

        var inner = document.createElement('div');
        inner.style.background = 'linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%)';
        inner.style.color = '#ffffff';
        inner.style.padding = '16px 24px';
        inner.style.borderRadius = '12px';
        inner.style.border = '2px solid #ff6b35';
        inner.style.boxShadow = '0 8px 30px rgba(255,107,53,0.5), 0 0 20px rgba(255, 107, 53, 0.3)';
        inner.style.minWidth = '280px';

        var title = document.createElement('div');
        title.textContent = '🏆 ' + ach.title;
        title.style.fontWeight = '800';
        title.style.fontSize = '14px';
        title.style.color = '#ff6b35';
        title.style.marginBottom = '4px';
        title.style.textTransform = 'uppercase';
        title.style.letterSpacing = '1px';
        inner.appendChild(title);

        var desc = document.createElement('div');
        desc.textContent = ach.desc;
        desc.style.fontSize = '13px';
        desc.style.color = '#ccc';
        inner.appendChild(desc);

        toast.appendChild(inner);
        container.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 4000);
    }

    function togglePause() {
        state.isPaused = !state.isPaused;
        var btn = document.getElementById('bpPauseBtn');
        btn.innerHTML = state.isPaused ? '<span style="font-size:20px;">▶</span>' : '<span style="font-size:20px;">⏸</span>';

        var timerCloud = document.getElementById('bpTimer');

        if (state.isPaused) {
            if (timerCloud) {
                state.timerColorBeforePause = timerCloud.style.color || '#ff6b35';
                timerCloud.style.color = '#ff6b35';
                timerCloud.style.textShadow = '0 0 15px rgba(255, 107, 53, 1), 0 0 30px rgba(255, 107, 53, 0.6), 0 0 45px rgba(255, 107, 53, 0.3)';
            }

            var ctx = state.ctx;
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, state.canvas.width, state.canvas.height);
            ctx.fillStyle = '#ff6b35';
            ctx.font = 'bold 48px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#ff6b35';
            ctx.shadowBlur = 20;
            ctx.fillText('ПАУЗА', state.canvas.width / 2, state.canvas.height / 2);
            ctx.shadowBlur = 0;
        } else {
            if (timerCloud) {
                timerCloud.style.color = state.timerColorBeforePause;
                timerCloud.style.textShadow = '0 0 10px rgba(255, 107, 53, 0.8), 0 0 20px rgba(255, 107, 53, 0.4), 0 0 30px rgba(255, 107, 53, 0.2)';
            }
            draw();
        }
    }

    function toggleShowImage() {
        state.showImage = !state.showImage;
        var btn = document.getElementById('bpShowBtn');
        if (state.showImage) {
            btn.style.background = '#ff6b35';
            btn.style.color = '#ffffff';
            btn.style.boxShadow = '0 0 20px rgba(255, 107, 53, 0.6)';
        } else {
            btn.style.background = 'rgba(255,255,255,0.05)';
            btn.style.color = '#ff6b35';
            btn.style.boxShadow = '0 0 10px rgba(255, 107, 53, 0.3)';
        }
    }

    function openAchievements() {
        renderAchievements();
        document.getElementById('bpAchOverlay').style.display = 'flex';
    }

    function renderAchievements() {
        var grid = document.getElementById('bpAchGrid');
        grid.innerHTML = '';
        state.achievements.forEach(function(ach) {
            var item = document.createElement('div');
            item.style.background = ach.unlocked ? 'linear-gradient(135deg, rgba(255,107,53,0.2), rgba(255,140,90,0.1))' : 'rgba(255,255,255,0.05)';
            item.style.border = ach.unlocked ? '2px solid #ff6b35' : '1px solid rgba(255,255,255,0.1)';
            item.style.borderRadius = '8px';
            item.style.padding = '12px';
            item.style.display = 'flex';
            item.style.alignItems = 'center';
            item.style.gap = '10px';
            if (ach.unlocked) {
                item.style.boxShadow = '0 0 15px rgba(255, 107, 53, 0.3)';
            }

            var icon = document.createElement('span');
            icon.textContent = ach.unlocked ? ach.icon : '🔒';
            icon.style.fontSize = '22px';
            item.appendChild(icon);

            var content = document.createElement('div');
            var title = document.createElement('div');
            title.textContent = ach.title;
            title.style.fontSize = '12px';
            title.style.fontWeight = '700';
            title.style.color = ach.unlocked ? '#ff6b35' : '#888';
            content.appendChild(title);

            var desc = document.createElement('div');
            desc.textContent = ach.desc;
            desc.style.fontSize = '10px';
            desc.style.color = '#888';
            desc.style.marginTop = '2px';
            content.appendChild(desc);

            item.appendChild(content);
            grid.appendChild(item);
        });
    }

    function startTimer() {
        state.timerInterval = setInterval(function() {
            if (!state.isPaused && !state.isComplete) {
                state.elapsedTime++;
                updateUI();
            }
        }, 1000);
    }

    function updateUI() {
        document.getElementById('bpTimer').textContent = formatTime(state.elapsedTime);
        var placed = state.pieces.filter(function(p) { return p.isPlaced; }).length;
        var total = state.pieces.length;

        var fill = document.getElementById('bpProgressBarFill');
        if (fill && total > 0) {
            var percent = (placed / total) * 100;
            fill.style.width = percent + '%';
        }
    }

    function formatTime(sec) {
        var m = Math.floor(sec / 60);
        var s = sec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function saveState() {
        var data = {
            pieces: state.pieces.map(function(p) {
                return { id: p.id, currentX: p.currentX, currentY: p.currentY, isPlaced: p.isPlaced, groupId: p.groupId };
            }),
            elapsedTime: state.elapsedTime,
            moveCount: state.moveCount,
            mistakes: state.mistakes
        };
        localStorage.setItem('bp_game_state', JSON.stringify(data));
    }

    function saveAchievements() {
        var unlocked = state.achievements.filter(function(a) { return a.unlocked; }).map(function(a) { return a.id; });
        localStorage.setItem('bp_achievements', JSON.stringify(unlocked));
    }

    function loadAchievements() {
        var saved = localStorage.getItem('bp_achievements');
        if (saved) {
            var unlocked = JSON.parse(saved);
            ACHIEVEMENTS.forEach(function(ach) {
                if (unlocked.indexOf(ach.id) !== -1) ach.unlocked = true;
            });
        }
    }

    function loadGamesCount() {
        state.gamesCount = parseInt(localStorage.getItem('bp_games_count') || '0');
    }

    function saveGamesCount() {
        state.gamesCount++;
        localStorage.setItem('bp_games_count', state.gamesCount.toString());
        checkAchievement('five_games', state.gamesCount >= 5);
        checkAchievement('ten_games', state.gamesCount >= 10);
    }

    createPage();
})();</script></p></div></article></main><footer class="footer"><div class="wrapper"><div class="footer__copyright"><p>Powered by Publii</p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://nevemerus.github.io/primepride/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://nevemerus.github.io/primepride/assets/js/scripts.min.js?v&#x3D;548663b90e1600fd2c2dd54433d04b71"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'sidebar',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
