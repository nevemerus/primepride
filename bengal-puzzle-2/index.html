function loadImage(url) {
  return new Promise(function(resolve, reject) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() { resolve(img); };
    img.onerror = function() { reject(new Error('Failed: ' + url)); };
    img.src = url;
  });
}

function createPlaceholderImage() {
  var c = document.createElement('canvas');
  c.width = 800; c.height = 600;
  var g = c.getContext('2d');
  var grad = g.createLinearGradient(0, 0, 800, 600);
  grad.addColorStop(0, '#e94560');
  grad.addColorStop(0.5, '#533483');
  grad.addColorStop(1, '#0f3460');
  g.fillStyle = grad;
  g.fillRect(0, 0, 800, 600);
  g.fillStyle = 'rgba(255,255,255,0.15)';
  g.font = 'bold 48px sans-serif';
  g.textAlign = 'center';
  g.fillText('Puzzle Garage', 400, 300);
  return c;
}

async function pickAndLoadImage() {
  var startIdx = Math.floor(Math.random() * IMAGES.length);
  var order = [];
  for (var i = 0; i < IMAGES.length; i++) {
    order.push(IMAGES[(startIdx + i) % IMAGES.length]);
  }
  for (var j = 0; j < order.length; j++) {
    try {
      S.image = await loadImage(order[j]);
      S.imageUrl = order[j];
      previewImgEl.src = order[j];
      return;
    } catch (e) { /* next */ }
  }
  S.image = createPlaceholderImage();
  S.imageUrl = '';
}

// ============ EDGE MAP ============
function randomPolarity() { return Math.random() > 0.5 ? 1 : -1; }

function generateEdgeMap(rows, cols) {
  var hEdges = [], vEdges = [];
  for (var r = 1; r < rows; r++) {
    hEdges[r] = [];
    for (var c = 0; c < cols; c++) hEdges[r][c] = randomPolarity();
  }
  for (var r2 = 0; r2 < rows; r2++) {
    vEdges[r2] = [];
    for (var c2 = 1; c2 < cols; c2++) vEdges[r2][c2] = randomPolarity();
  }
  return { hEdges: hEdges, vEdges: vEdges };
}

// ============ EDGE PATH BUILDER ============
function buildEdgePath(path, x0, y0, x1, y1, polarity, edgeType) {
  var dx = x1 - x0;
  var dy = y1 - y0;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len < 0.001) { path.lineTo(x1, y1); return; }

  var nx, ny;
  switch (edgeType) {
    case 'top':    nx = 0;  ny = -1; break;
    case 'right':  nx = 1;  ny = 0;  break;
    case 'bottom': nx = 0;  ny = 1;  break;
    case 'left':   nx = -1; ny = 0;  break;
    default:       nx = 0;  ny = -1;
  }

  var tabD = len * TAB_DEPTH * polarity;
  var neckStart = 0.35;
  var neckEnd = 0.65;

  function pt(t, off) {
    return {
      x: x0 + dx * t + nx * off,
      y: y0 + dy * t + ny * off
    };
  }

  path.lineTo(x0 + dx * neckStart, y0 + dy * neckStart);

  var lc1 = pt(0.36, tabD * 0.30);
  var lc2 = pt(0.42, tabD * 0.95);
  var lend = pt(0.50, tabD * 1.00);
  path.bezierCurveTo(lc1.x, lc1.y, lc2.x, lc2.y, lend.x, lend.y);

  var rc1 = pt(0.58, tabD * 0.95);
  var rc2 = pt(0.64, tabD * 0.30);
  var rend = pt(neckEnd, 0);
  path.bezierCurveTo(rc1.x, rc1.y, rc2.x, rc2.y, rend.x, rend.y);

  path.lineTo(x1, y1);
}

// ============ PIECE RENDERING ============
function renderPieceOffscreen(piece) {
  var image = S.image, pw = S.pieceW, ph = S.pieceH;
  var margin = Math.ceil(Math.max(pw, ph) * TAB_DEPTH) + 4;
  var cw = pw + margin * 2;
  var ch = ph + margin * 2;

  var off = document.createElement('canvas');
  off.width = Math.round(cw * S.dpr);
  off.height = Math.round(ch * S.dpr);
  var octx = off.getContext('2d');
  octx.scale(S.dpr, S.dpr);

  var path = new Path2D();
  var x0 = margin;
  var y0 = margin;

  path.moveTo(x0, y0);

  if (piece.edges.top === 0) path.lineTo(x0 + pw, y0);
  else buildEdgePath(path, x0, y0, x0 + pw, y0, piece.edges.top, 'top');

  if (piece.edges.right === 0) path.lineTo(x0 + pw, y0 + ph);
  else buildEdgePath(path, x0 + pw, y0, x0 + pw, y0 + ph, piece.edges.right, 'right');

  if (piece.edges.bottom === 0) path.lineTo(x0, y0 + ph);
  else buildEdgePath(path, x0 + pw, y0 + ph, x0, y0 + ph, piece.edges.bottom, 'bottom');

  if (piece.edges.left === 0) path.lineTo(x0, y0);
  else buildEdgePath(path, x0, y0 + ph, x0, y0, piece.edges.left, 'left');

  path.closePath();

  octx.save();
  octx.clip(path);
  octx.drawImage(image, piece.srcX, piece.srcY, piece.srcW, piece.srcH, x0, y0, pw, ph);
  octx.strokeStyle = 'rgba(255,255,255,0.08)';
  octx.lineWidth = 2;
  octx.stroke(path);
  octx.restore();

  octx.save();
  octx.strokeStyle = BORDER_COLOR;
  octx.lineWidth = BORDER_WIDTH;
  octx.stroke(path);
  octx.restore();

  off.margin = margin;
  return off;
}

// ============ PIECE CREATION ============
function createPieces() {
  var cols = S.cols, rows = S.rows, image = S.image;
  var pw = S.pieceW, ph = S.pieceH;

  S.pieces = [];
  S.clusters = [];
  S.placedCount = 0;
  S.totalPieces = cols * rows;

  var edgeMap = S.hEdges.length ? S : generateEdgeMap(rows, cols);
  S.hEdges = edgeMap.hEdges;
  S.vEdges = edgeMap.vEdges;

  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var id = r * cols + c;
      var piece = {
        id: id, row: r, col: c,
        correctX: (S.boardW - cols * pw) / 2 + c * pw,
        correctY: (S.boardH - rows * ph) / 2 + r * ph,
        srcX: c * (image.width / cols),
        srcY: r * (image.height / rows),
        srcW: image.width / cols,
        srcH: image.height / rows,
        x: 0, y: 0,
        canvas: null,
        isPlaced: false,
        cluster: null
      };
      piece.edges = {
        top:    r === 0        ? 0 : -S.hEdges[r][c],
        right:  c === cols - 1 ? 0 :  S.vEdges[r][c + 1],
        bottom: r === rows - 1 ? 0 :  S.hEdges[r + 1][c],
        left:   c === 0        ? 0 : -S.vEdges[r][c]
      };
      S.pieces.push(piece);
    }
  }

  for (var i = 0; i < S.pieces.length; i++) {
    S.pieces[i].canvas = renderPieceOffscreen(S.pieces[i]);
  }

  for (var k = 0; k < S.pieces.length; k++) {
    var p = S.pieces[k];
    var cluster = {
      id: S.clusters.length,
      pieces: [p],
      anchor: p,
      x: 0, y: 0
    };
    p.cluster = cluster;
    S.clusters.push(cluster);
  }

  shufflePieces();
}

// ============ SHUFFLE ============
function shufflePieces() {
  var cols = S.cols, rows = S.rows;
  var pw = S.pieceW, ph = S.pieceH;
  var boardW = S.boardW, boardH = S.boardH;
  var puzzleW = cols * pw, puzzleH = rows * ph;
  var puzzleLeft = (boardW - puzzleW) / 2;
  var puzzleTop = (boardH - puzzleH) / 2;

  var margin = 30;
  var minX = margin;
  var maxX = boardW - pw - margin;
  var minY = margin;
  var maxY = boardH - ph - margin;

  for (var i = 0; i < S.pieces.length; i++) {
    var piece = S.pieces[i];
    var px, py, attempts = 0;
    do {
      px = minX + Math.random() * (maxX - minX);
      py = minY + Math.random() * (maxY - minY);
      attempts++;
    } while (
      attempts < 80 &&
      px + pw > puzzleLeft - 20 && px < puzzleLeft + puzzleW + 20 &&
      py + ph > puzzleTop - 20 && py < puzzleTop + puzzleH + 20
    );

    if (attempts >= 80) {
      var side = Math.floor(Math.random() * 4);
      if (side === 0) { px = minX; py = minY + Math.random() * (maxY - minY); }
      else if (side === 1) { px = maxX; py = minY + Math.random() * (maxY - minY); }
      else if (side === 2) { px = minX + Math.random() * (maxX - minX); py = minY; }
      else { px = minX + Math.random() * (maxX - minX); py = maxY; }
    }

    piece.x = px;
    piece.y = py;
    piece.isPlaced = false;

    piece.cluster.pieces = [piece];
    piece.cluster.anchor = piece;
    piece.cluster.x = px;
    piece.cluster.y = py;
  }

  S.clusters = S.pieces.map(function(p) { return p.cluster; });
  S.placedCount = 0;
  updateHUD();
}

// ============ RENDER ============
function render() {
  ctx.clearRect(0, 0, S.boardW, S.boardH);

  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, S.boardW, S.boardH);

  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 1;
  var gridSize = 40;
  for (var gx = 0; gx < S.boardW; gx += gridSize) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, S.boardH); ctx.stroke();
  }
  for (var gy = 0; gy < S.boardH; gy += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(S.boardW, gy); ctx.stroke();
  }

  if (!S.gameActive || S.pieces.length === 0) return;

  var cols = S.cols, rows = S.rows;
  var pw = S.pieceW, ph = S.pieceH;
  var boardW = S.boardW, boardH = S.boardH;
  var puzzleW = cols * pw, puzzleH = rows * ph;
  var puzzleLeft = (boardW - puzzleW) / 2;
  var puzzleTop = (boardH - puzzleH) / 2;

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.strokeRect(puzzleLeft, puzzleTop, puzzleW, puzzleH);
  ctx.restore();

  var placed = [], notPlaced = [];
  for (var i = 0; i < S.clusters.length; i++) {
    if (isClusterPlaced(S.clusters[i])) placed.push(S.clusters[i]);
    else notPlaced.push(S.clusters[i]);
  }

  for (var j = 0; j < placed.length; j++) drawCluster(placed[j]);

  var ordered = notPlaced.filter(function(c) { return c !== S.activeCluster; });
  if (S.activeCluster) ordered.push(S.activeCluster);
  for (var k = 0; k < ordered.length; k++) drawCluster(ordered[k]);
}

function drawCluster(cluster) {
  for (var i = 0; i < cluster.pieces.length; i++) {
    var piece = cluster.pieces[i];
    var off = piece.canvas;
    var margin = off.margin;
    var drawX = piece.x - margin;
    var drawY = piece.y - margin;

    ctx.save();
    if (!piece.isPlaced) {
      ctx.shadowColor = SHADOW_COLOR;
      ctx.shadowBlur = SHADOW_BLUR;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 2;
    }
    ctx.drawImage(off, drawX, drawY, off.width / S.dpr, off.height / S.dpr);
    ctx.restore();
  }
}

function isClusterPlaced(cluster) {
  for (var i = 0; i < cluster.pieces.length; i++) {
    if (!cluster.pieces[i].isPlaced) return false;
  }
  return cluster.pieces.length > 0;
}

// ============ HUD ============
function updateHUD() {
  progressEl.textContent = S.placedCount + '/' + S.totalPieces;
}

function updateTimer() {
  if (!S.gameActive) return;
  S.elapsed = Math.floor((Date.now() - S.startTime) / 1000);
  var m = String(Math.floor(S.elapsed / 60)).padStart(2, '0');
  var s = String(S.elapsed % 60).padStart(2, '0');
  timerEl.textContent = m + ':' + s;
}

// ============ HIT TESTING ============
function getPointerPos(e) {
  var rect = canvas.getBoundingClientRect();
  var clientX = e.touches ? e.touches[0].clientX : e.clientX;
  var clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function hitTest(px, py) {
  var nonPlaced = [], placed = [];
  for (var i = 0; i < S.clusters.length; i++) {
    if (isClusterPlaced(S.clusters[i])) placed.push(S.clusters[i]);
    else nonPlaced.push(S.clusters[i]);
  }
  for (var j = nonPlaced.length - 1; j >= 0; j--) {
    if (hitTestCluster(nonPlaced[j], px, py)) return nonPlaced[j];
  }
  return null;
}

function hitTestCluster(cluster, px, py) {
  for (var i = 0; i < cluster.pieces.length; i++) {
    var piece = cluster.pieces[i];
    var off = piece.canvas;
    var margin = off.margin;
    var left = piece.x - margin;
    var top = piece.y - margin;
    var w = off.width / S.dpr;
    var h = off.height / S.dpr;
    if (px >= left && px <= left + w && py >= top && py <= top + h) {
      return true;
    }
  }
  return false;
}

// ============ POINTER ============
function onPointerDown(e) {
  if (!S.gameActive) return;
  e.preventDefault();
  var pos = getPointerPos(e);
  var cluster = hitTest(pos.x, pos.y);
  if (!cluster) return;
  if (isClusterPlaced(cluster)) return;

  S.isDragging = true;
  S.activeCluster = cluster;
  S.dragStartX = pos.x;
  S.dragStartY = pos.y;
  S.dragOriginX = cluster.x;
  S.dragOriginY = cluster.y;
  canvas.classList.add('dragging');

  var idx = S.clusters.indexOf(cluster);
  if (idx !== -1) {
    S.clusters.splice(idx, 1);
    S.clusters.push(cluster);
  }

  render();
}

function onPointerMove(e) {
  if (!S.isDragging || !S.activeCluster) return;
  e.preventDefault();
  var pos = getPointerPos(e);
  var dx = pos.x - S.dragStartX;
  var dy = pos.y - S.dragStartY;
  S.activeCluster.x = S.dragOriginX + dx;
  S.activeCluster.y = S.dragOriginY + dy;

  for (var i = 0; i < S.activeCluster.pieces.length; i++) {
    var piece = S.activeCluster.pieces[i];
    var relX = piece.x - S.dragOriginX;
    var relY = piece.y - S.dragOriginY;
    piece.x = S.activeCluster.x + relX;
    piece.y = S.activeCluster.y + relY;
  }

  render();
}

function onPointerUp() {
  if (!S.isDragging || !S.activeCluster) return;
  S.isDragging = false;
  canvas.classList.remove('dragging');

  var cluster = S.activeCluster;
  S.activeCluster = null;

  trySnapCluster(cluster);
  tryMergeClusters(cluster);
  checkWin();
  render();
}

// ============ SNAP & MERGE ============
function trySnapCluster(cluster) {
  if (isClusterPlaced(cluster)) return;

  var allClose = true;
  for (var i = 0; i < cluster.pieces.length; i++) {
    var p = cluster.pieces[i];
    var d = Math.sqrt((p.x - p.correctX) * (p.x - p.correctX) + (p.y - p.correctY) * (p.y - p.correctY));
    if (d > SNAP_DISTANCE) { allClose = false; break; }
  }
  if (!allClose) return;

  var snapped = false;
  for (var j = 0; j < cluster.pieces.length; j++) {
    var piece = cluster.pieces[j];
    piece.x = piece.correctX;
    piece.y = piece.correctY;
    if (!piece.isPlaced) {
      piece.isPlaced = true;
      S.placedCount++;
      snapped = true;
    }
  }
  cluster.x = cluster.anchor.x;
  cluster.y = cluster.anchor.y;
  if (snapped) { updateHUD(); playSnapSound(); }
}

function getNeighborPieces(piece) {
  var cols = S.cols, rows = S.rows;
  var result = [];
  var row = piece.row, col = piece.col;
  if (row > 0) result.push(S.pieces[(row - 1) * cols + col]);
  if (row < rows - 1) result.push(S.pieces[(row + 1) * cols + col]);
  if (col > 0) result.push(S.pieces[row * cols + (col - 1)]);
  if (col < cols - 1) result.push(S.pieces[row * cols + (col + 1)]);
  return result;
}

function mergeClusters(target, source) {
  if (target === source) return;
  for (var i = 0; i < source.pieces.length; i++) {
    var piece = source.pieces[i];
    piece.cluster = target;
    target.pieces.push(piece);
  }
  var idx = S.clusters.indexOf(source);
  if (idx !== -1) S.clusters.splice(idx, 1);
  target.anchor = target.pieces[0];
  target.x = target.anchor.x;
  target.y = target.anchor.y;
}

function tryMergeClusters(cluster) {
  var merged = true;
  while (merged) {
    merged = false;
    var currentPieces = cluster.pieces.slice();
    for (var i = 0; i < currentPieces.length; i++) {
      var piece = currentPieces[i];
      var neighbors = getNeighborPieces(piece);
      for (var j = 0; j < neighbors.length; j++) {
        var neighbor = neighbors[j];
        if (neighbor.cluster === cluster) continue;

        var relX = neighbor.x - piece.x;
        var relY = neighbor.y - piece.y;
        var expectedRelX = neighbor.correctX - piece.correctX;
        var expectedRelY = neighbor.correctY - piece.correctY;
        var dx = relX - expectedRelX;
        var dy = relY - expectedRelY;
        var dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < CLUSTER_MERGE_DIST) {
          mergeClusters(cluster, neighbor.cluster);
          merged = true;
          break;
        }
      }
      if (merged) break;
    }
  }
  trySnapCluster(cluster);
}

// ============ WIN ============
function checkWin() {
  var placed = 0;
  for (var i = 0; i < S.pieces.length; i++) {
    if (S.pieces[i].isPlaced) placed++;
  }
  S.placedCount = placed;
  updateHUD();

  if (placed === S.totalPieces && S.totalPieces > 0) {
    S.gameActive = false;
    clearInterval(S.timerInterval);
    var finalTime = Math.floor((Date.now() - S.startTime) / 1000);
    var m = String(Math.floor(finalTime / 60)).padStart(2, '0');
    var s = String(finalTime % 60).padStart(2, '0');
    winStatsEl.innerHTML = 'Время: <strong>' + m + ':' + s + '</strong><br>Деталей: <strong>' + S.totalPieces + '</strong>';
    winOverlayEl.classList.add('pg-visible');
    playWinSound();
  }
}

// ============ SOUND ============

  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  return audioCtx;
}

}
