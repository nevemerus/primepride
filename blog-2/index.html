 border-bottom: 2px solid #f0f0f0; padding-bottom: 20px; margin-bottom: 40px; max-width: 1000px; margin-left: auto; margin-right: auto; justify-content: center;"><button id="filter-all" style="background: linear-gradient(135deg, #ff6b00, #ff9a56); color: white; border: none; padding: 12px 28px; border-radius: 50px; font-size: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(255,107,0,0.3);">Все статьи</button> <button id="filter-ourstory" style="background: #f5f5f5; color: #666; border: 2px solid #e0e0e0; padding: 12px 28px; border-radius: 50px; font-size: 15px; cursor: pointer; font-weight: 600;">Наша история</button> <button id="filter-reviews" style="background: #f5f5f5; color: #666; border: 2px solid #e0e0e0; padding: 12px 28px; border-radius: 50px; font-size: 15px; cursor: pointer; font-weight: 600;">Обзоры</button> <button id="filter-care" style="background: #f5f5f5; color: #666; border: 2px solid #e0e0e0; padding: 12px 28px; border-radius: 50px; font-size: 15px; cursor: pointer; font-weight: 600;">Уход и здоровье</button> <button id="filter-food" style="background: #f5f5f5; color: #666; border: 2px solid #e0e0e0; padding: 12px 28px; border-radius: 50px; font-size: 15px; cursor: pointer; font-weight: 600;">Питание</button> <button id="filter-education" style="background: #f5f5f5; color: #666; border: 2px solid #e0e0e0; padding: 12px 28px; border-radius: 50px; font-size: 15px; cursor: pointer; font-weight: 600;">Воспитание</button></div><div id="articles-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto;"><p style="color: #999; text-align: center; grid-column: 1 / -1; padding: 60px; font-size: 16px;">Загрузка статей...</p></div></div></div><p><script>(function() {
  const categoryColors = {
    'ourstory': '#1abc9c',
    'reviews': '#f1c40f',
    'care': '#27ae60',
    'food': '#e67e22',
    'education': '#9b59b6',
    'default': '#3498db'
  };

  let articlesData = [];

  function getTagName(tag) {
    if (!tag) return '';
    if (typeof tag === 'string') return tag.toLowerCase();
    if (tag.name) return tag.name.toLowerCase();
    if (tag.slug) return tag.slug.toLowerCase();
    return String(tag).toLowerCase();
  }

  function getCategoryFromTags(tags) {
    if (!tags || !Array.isArray(tags) || tags.length === 0) return 'ourstory';
    for (let i = 0; i < tags.length; i++) {
      const tagName = getTagName(tags[i]);
      if (tagName.includes('наша история') || tagName === 'истории' || tagName === 'блог: истории') return 'ourstory';
      if (tagName.includes('обзор') || tagName === 'блог: обзоры') return 'reviews';
      if (tagName.includes('уход') || tagName.includes('здоров') || tagName === 'блог: уход' || tagName === 'блог: здоровье') return 'care';
      if (tagName.includes('питан') || tagName === 'блог: питание') return 'food';
      if (tagName.includes('воспитан') || tagName === 'блог: воспитание') return 'education';
    }
    return 'ourstory';
  }

  function loadArticles() {
    const feedUrl = '/primepride/feed.json';
    fetch(feedUrl)
      .then(function(response) {
        if (!response.ok) throw new Error('Feed not found');
        return response.json();
      })
      .then(function(data) {
        const items = data.items || [];
        articlesData = items.map(function(item, index) {
          const category = getCategoryFromTags(item.tags || []);
          const cleanExcerpt = item.summary ? item.summary.replace(/<[^>]*>/g, '') : '';
          return {
            id: item.id || index,
            category: category,
            title: item.title || 'Без названия',
            excerpt: cleanExcerpt,
            link: item.url || '#',
            color: categoryColors[category] || categoryColors.default
          };
        });
        renderArticles('all');
        setupFilters();
      })
      .catch(function(error) {
        console.error('Ошибка:', error);
        const grid = document.getElementById('articles-grid');
        if (grid) {
          grid.innerHTML = '<p style="color: #999; text-align: center; grid-column: 1 / -1; padding: 60px;">Не удалось загрузить статьи</p>';
        }
      });
  }

  function renderArticles(filter) {
    const grid = document.getElementById('articles-grid');
    if (!grid) return;
    const filtered = filter === 'all' ? articlesData : articlesData.filter(function(a) { return a.category === filter; });
    if (filtered.length === 0) {
      grid.innerHTML = '<p style="color: #999; text-align: center; grid-column: 1 / -1; padding: 60px; font-size: 16px;">Статьи не найдены</p>';
      return;
    }
    grid.innerHTML = filtered.map(function(article) {
      const displayExcerpt = article.excerpt.length > 200 ? article.excerpt.substring(0, 200) + '...' : article.excerpt;
      return '<a href="' + article.link + '" style="text-decoration: none; display: block; background: white; border-radius: 16px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); border: 1px solid #f0f0f0; transition: transform 0.3s, box-shadow 0.3s;" onmouseover="this.style.transform=\'translateY(-5px)\'; this.style.boxShadow=\'0 15px 40px rgba(0,0,0,0.12)\';" onmouseout="this.style.transform=\'translateY(0)\'; this.style.boxShadow=\'0 5px 20px rgba(0,0,0,0.08)\';">' +
        '<div style="border-left: 4px solid ' + article.color + '; padding-left: 20px;">' +
        '<h3 style="font-size: 22px; font-weight: 700; margin: 0 0 12px 0; color: #1a1a1a; line-height: 1.3;">' + article.title + '</h3>' +
        '<p style="font-size: 15px; color: #666; line-height: 1.6; margin: 0;">' + displayExcerpt + ' <span style="color: #ff6b00; font-weight: 600;">→ читать далее</span></p>' +
        '</div></a>';
    }).join('');
  }

  function setupFilters() {
    const buttons = {
      'all': document.getElementById('filter-all'),
      'ourstory': document.getElementById('filter-ourstory'),
      'reviews': document.getElementById('filter-reviews'),
      'care': document.getElementById('filter-care'),
      'food': document.getElementById('filter-food'),
      'education': document.getElementById('filter-education')
    };
    Object.keys(buttons).forEach(function(key) {
      const btn = buttons[key];
      if (btn) {
        btn.addEventListener('click', function() {
          Object.keys(buttons).forEach(function(k) {
            const b = buttons[k];
            if (b) {
              if (k === 'all') {
                b.style.background = k === 'all' ? 'linear-gradient(135deg, #ff6b00, #ff9a56)' : '#f5f5f5';
                b.style.color = k === 'all' ? 'white' : '#666';
              } else {
                b.style.background = '#f5f5f5';
                b.style.color = '#666';
              }
              b.style.borderColor = '#e0e0e0';
            }
          });
          btn.style.background = key === 'all' ? 'linear-gradient(135deg, #ff6b00, #ff9a56)' : '#f5f5f5';
          btn.style.color = key === 'all' ? 'white' : '#666';
          renderArticles(key);
        });
      }
    });
  }

  loadArticles();
})();</script></p></div></article></main><footer class="footer"><div class="wrapper"><div class="footer__copyright"><p>Powered by Publii</p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://nevemerus.github.io/primepride/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://nevemerus.github.io/primepride/assets/js/scripts.min.js?v&#x3D;548663b90e1600fd2c2dd54433d04b71"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'sidebar',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
        for (var i = 0; i < images.length; i++) {
