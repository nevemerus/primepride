t x="50" y="590" transform="rotate(0.2 50 590)" filter="url(#textBlur)">omnes accepimus et gratiam pro gratia quia lex per moysen data est</text><text x="50" y="620" transform="rotate(-0.3 50 620)" filter="url(#textBlur)">gratia et veritas per iesum christum facta est deum nemo vidit umquam</text><text x="50" y="650" transform="rotate(0.4 50 650)" filter="url(#textBlur)">unigenitus filius qui est in sinu patris ipse enarravit</text></g><g opacity="0.12" fill="#4a3728" font-family="'Times New Roman', serif" font-style="italic" font-size="13"><text x="600" y="100" transform="rotate(1 600 100)" filter="url(#heavyBlur)">Liber primus de natura rerum et principiis mundi secundum</text><text x="600" y="130" transform="rotate(-0.5 600 130)" filter="url(#textBlur)">philosophos antiquos qui de materia et forma disputaverunt</text><text x="600" y="160" transform="rotate(0.8 600 160)" filter="url(#textBlur)">aristoteles in physicis suis demonstrat motum esse actum</text><rect x="650" y="145" width="160" height="18" fill="#f5e6c8" opacity="0.7"></rect><text x="600" y="190" transform="rotate(-0.3 600 190)" filter="url(#textBlur)">entis potentia ad actum et hunc motum esse aeternum</text><text x="600" y="220" transform="rotate(0.4 600 220)" filter="url(#heavyBlur)">plato vero in timeo suo mundum factum esse a deo</text><text x="600" y="250" transform="rotate(-0.6 600 250)" filter="url(#textBlur)">artifice ex materia praexistente formasse affirmat</text><rect x="700" y="235" width="180" height="20" fill="#f5e6c8" opacity="0.75"></rect><rect x="720" y="238" width="140" height="14" fill="#d4b896" opacity="0.5"></rect><text x="600" y="280" transform="rotate(0.3 600 280)" filter="url(#textBlur)">stoici autem ignem esse principium rerum omnium</text><text x="600" y="310" transform="rotate(-0.4 600 310)" filter="url(#textBlur)">et ex igne omnia generari et in ignem omnia resolvi</text><text x="600" y="340" transform="rotate(0.5 600 340)" filter="url(#textBlur)">epicurus atomos esse principia rerum et inane</text><rect x="680" y="325" width="170" height="18" fill="#f5e6c8" opacity="0.7"></rect><text x="600" y="370" transform="rotate(-0.2 600 370)" filter="url(#textBlur)">in quo atomi moventur et concursu suo mundos efficiunt</text><text x="600" y="400" transform="rotate(0.6 600 400)" filter="url(#textBlur)">haec sunt principia philosophiae naturalis antiquae</text><text x="600" y="430" transform="rotate(-0.5 600 430)" filter="url(#heavyBlur)">quae usque ad nostra tempora pervenerunt</text></g><g opacity="0.08" fill="#2a1f18" font-family="'Times New Roman', serif" font-style="italic" font-size="12"><text x="100" y="700" transform="rotate(2 100 700)" filter="url(#heavyBlur)">Capitulum primum de origine mundi et creatione</text><text x="100" y="730" transform="rotate(-1 100 730)" filter="url(#textBlur)">omnium rerum visibilium et invisibilium</text><text x="100" y="760" transform="rotate(1.5 100 760)" filter="url(#heavyBlur)">in principio creavit deus caelum et terram</text><rect x="150" y="745" width="200" height="18" fill="#f5e6c8" opacity="0.8"></rect><text x="100" y="790" transform="rotate(-0.8 100 790)" filter="url(#textBlur)">terra autem erat inanis et vacua et tenebrae</text><text x="100" y="820" transform="rotate(0.5 100 820)" filter="url(#textBlur)">erant super faciem abyssi et spiritus dei</text><text x="100" y="850" transform="rotate(-1.2 100 850)" filter="url(#heavyBlur)">ferebatur super aquas dixitque deus fiat lux</text><rect x="200" y="835" width="150" height="18" fill="#f5e6c8" opacity="0.75"></rect><text x="100" y="880" transform="rotate(0.7 100 880)" filter="url(#textBlur)">et facta est lux et vidit deus lucem quod</text><text x="100" y="910" transform="rotate(-0.4 100 910)" filter="url(#textBlur)">esset bona et divisit lucem a tenebris</text></g><g opacity="0.6"><rect x="800" y="200" width="120" height="15" fill="#f5e6c8" rx="2"></rect><rect x="820" y="203" width="80" height="9" fill="#e8d5b0" rx="1"></rect><rect x="300" y="450" widt /svg><div style="width: 100vw; position: relative; left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw; background: transparent;"><div style="font-family: 'Georgia', 'Times New Roman', serif; width: 100%; max-width: 1400px; margin: 0 auto; padding: 40px 40px; background: rgba(245, 230, 200, 0.97); color: #1a1a1a; box-sizing: border-box; position: relative; z-index: 1; border: 1px solid #c4a882; box-shadow: 0 0 60px rgba(0, 0, 0, 0.3);"><div style="margin-bottom: 60px; text-align: center; position: relative;"><div style="display: inline-block; position: relative;"><h1 style="font-size: 52px; font-weight: 400; margin-bottom: 15px; letter-spacing: 3px; line-height: 1.2; color: #000000; font-family: 'Georgia', serif; text-transform: uppercase; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">Все статьи</h1><div style="position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 200px; height: 2px; background: linear-gradient(to right, transparent, #4a3728, transparent);"> </div></div><p style="font-size: 18px; color: #1a1a1a; font-style: italic; margin-top: 25px; font-family: 'Georgia', serif; font-weight: 500;">Истории, советы и рекомендации о наших бенгальских кошках</p></div><div id="filters-container" style="display: flex; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #4a3728; padding-bottom: 25px; margin-bottom: 50px; max-width: 1000px; margin-left: auto; margin-right: auto; justify-content: center;"><button id="filter-all" style="background: #1a1a1a; color: #f5e6c8; border: 2px solid #1a1a1a; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; box-shadow: 0 3px 10px rgba(0,0,0,0.3); font-family: 'Georgia', serif; transition: all 0.3s;">Все статьи</button> <button id="filter-ourstory" style="background: #f5ebe0; color: #1a1a1a; border: 2px solid #4a3728; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: 'Georgia', serif; transition: all 0.3s;">Наша история</button> <button id="filter-reviews" style="background: #f5ebe0; color: #1a1a1a; border: 2px solid #4a3728; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: 'Georgia', serif; transition: all 0.3s;">Обзоры</button> <button id="filter-care" style="background: #f5ebe0; color: #1a1a1a; border: 2px solid #4a3728; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: 'Georgia', serif; transition: all 0.3s;">Уход и здоровье</button> <button id="filter-food" style="background: #f5ebe0; color: #1a1a1a; border: 2px solid #4a3728; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: 'Georgia', serif; transition: all 0.3s;">Питание</button> <button id="filter-education" style="background: #f5ebe0; color: #1a1a1a; border: 2px solid #4a3728; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: 'Georgia', serif; transition: all 0.3s;">Воспитание</button></div><div id="articles-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 35px; max-width: 1200px; margin: 0 auto;"><p style="color: #1a1a1a; text-align: center; grid-column: 1 / -1; padding: 60px; font-size: 18px; font-family: 'Georgia', serif; font-style: italic;">Загрузка статей...</p></div></div></div><p><script>(function() {
  const categoryColors = {
    'ourstory': '#8b7355',
    'reviews': '#a08060',
    'care': '#6b8e6b',
    'food': '#b8956a',
    'education': '#8b6b8e',
    'default': '#6b8e8e'
  };

  let articlesData = [];

  function getTagName(tag) {
    if (!tag) return '';
    if (typeof tag === 'string') return tag.toLowerCase();
    if (tag.name) return tag.name.toLowerCase();
    if (tag.slug) return tag.slug.toLowerCase();
    return String(tag).toLowerCase();
  }

  function getCategoryFromTags(tags) {
    if (!tags || !Array.isArray(tags) || tags.length === 0) return 'ourstory';
    for (let i = 0; i < tags.length; i++) {
      const tagName = getTagName(tags[i]);
      if (tagName.includes('наша история') || tagName === 'истории' || tagName === 'блог: истории') return 'ourstory';
      if (tagName.includes('обзор') || tagName === 'блог: обзоры') return 'reviews';
      if (tagName.includes('уход') || tagName.includes('здоров') || tagName === 'блог: уход' || tagName === 'блог: здоровье') return 'care';
      if (tagName.includes('питан') || tagName === 'блог: питание') return 'food';
      if (tagName.includes('воспитан') || tagName === 'блог: воспитание') return 'education';
    }
    return 'ourstory';
  }

  function loadArticles() {
    const feedUrl = '/primepride/feed.json';
    fetch(feedUrl)
      .then(function(response) {
        if (!response.ok) throw new Error('Feed not found');
        return response.json();
      })
      .then(function(data) {
        const items = data.items || [];
        articlesData = items.map(function(item, index) {
          const category = getCategoryFromTags(item.tags || []);
          const cleanExcerpt = item.summary ? item.summary.replace(/<[^>]*>/g, '') : '';
          return {
            id: item.id || index,
            category: category,
            title: item.title || 'Без названия',
            excerpt: cleanExcerpt,
            link: item.url || '#',
            color: categoryColors[category] || categoryColors.default
          };
        });
        renderArticles('all');
        setupFilters();
      })
      .catch(function(error) {
        console.error('Ошибка:', error);
        const grid = document.getElementById('articles-grid');
        if (grid) {
          grid.innerHTML = '<p style="color: #1a1a1a; text-align: center; grid-column: 1 / -1; padding: 60px; font-size: 18px; font-family: \'Georgia\', serif; font-style: italic;">Не удалось загрузить статьи</p>';
        }
      });
  }

  function renderArticles(filter) {
    const grid = document.getElementById('articles-grid');
    if (!grid) return;
    const filtered = filter === 'all' ? articlesData : articlesData.filter(function(a) { return a.category === filter; });
    if (filtered.length === 0) {
      grid.innerHTML = '<p style="color: #1a1a1a; text-align: center; grid-column: 1 / -1; padding: 60px; font-size: 18px; font-family: \'Georgia\', serif; font-style: italic;">Статьи не найдены</p>';
      return;
    }
    grid.innerHTML = filtered.map(function(article) {
      const displayExcerpt = article.excerpt.length > 200 ? article.excerpt.substring(0, 200) + '...' : article.excerpt;
      return '<a href="' + article.link + '" style="text-decoration: none; display: block; background: #f5e6c8; border-radius: 2px; padding: 35px; box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2); border: 1px solid #c4a882; transition: all 0.3s; position: relative; overflow: hidden;" onmouseover="this.style.transform=\'translateY(-8px)\'; this.style.boxShadow=\'0 15px 40px rgba(0, 0, 0, 0.3)\'; this.style.borderColor=\'#4a3728\';" onmouseout="this.style.transform=\'translateY(0)\'; this.style.boxShadow=\'0 5px 25px rgba(0, 0, 0, 0.2)\'; this.style.borderColor=\'#c4a882\';">' +

        '<div style="position: absolute; top: 0; left: -8px; width: 12px; height: 12px; background: ' + article.color + '; transform: rotate(45deg);"></div>' +
        '<h3 style="font-size: 24px; font-weight: 400; margin: 0 0 15px 0; color: #000000; line-height: 1.35; font-family: \'Georgia\', serif;">' + article.title + '</h3>' +
        '<p style="font-size: 15px; color: #1a1a1a; line-height: 1.7; margin: 0; font-family: \'Georgia\', serif;">' + displayExcerpt + ' <span style="color: #1a1a1a; font-weight: 700; font-style: italic;">→ читать далее</span></p>' +
        '</div></a>';
    }).join('');
  }

  function setupFilters() {
    const buttons = {
      'all': document.getElementById('filter-all'),
      'ourstory': document.getElementById('filter-ourstory'),
      'reviews': document.getElementById('filter-reviews'),
      'care': document.getElementById('filter-care'),
      'food': document.getElementById('filter-food'),
      'education': document.getElementById('filter-education')
    };
    Object.keys(buttons).forEach(function(key) {
      const btn = buttons[key];
      if (btn) {
        btn.addEventListener('click', function() {
          Object.keys(buttons).forEach(function(k) {
            const b = buttons[k];
            if (b) {
              if (k === 'all') {
                b.style.background = '#1a1a1a';
                b.style.color = '#f5e6c8';
                b.style.borderColor = '#1a1a1a';
              } else {
                b.style.background = '#f5ebe0';
                b.style.color = '#1a1a1a';
                b.style.borderColor = '#4a3728';
              }
            }
          });
          btn.style.background = key === 'all' ? '#1a1a1a' : '#f5ebe0';
          btn.style.color = key === 'all' ? '#f5e6c8' : '#1a1a1a';
          renderArticles(key);
        });
      }
    });
  }

  loadArticles();
