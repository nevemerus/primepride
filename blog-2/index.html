ial-gradient(ellipse at 20% 30%, rgba(212, 184, 150, 0.3) 0%, transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(196, 168, 130, 0.25) 0%, transparent 50%); pointer-events: none; border-radius: 3px;"> </div><div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to right, rgba(139, 115, 85, 0.15) 0%, transparent 8%, transparent 92%, rgba(139, 115, 85, 0.15) 100%), linear-gradient(to bottom, rgba(139, 115, 85, 0.12) 0%, transparent 6%, transparent 94%, rgba(139, 115, 85, 0.12) 100%); pointer-events: none; border-radius: 3px;"> </div><div style="margin-bottom: 60px; text-align: center; position: relative; z-index: 2;"><div style="display: inline-block; position: relative;"><h1 class="blog-h1" style="font-size: 52px; font-weight: 400; margin-bottom: 15px; letter-spacing: 3px; line-height: 1.2; color: #1a1a1a; font-family: 'Georgia', serif; text-transform: uppercase;">Все статьи</h1><div style="position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 200px; height: 2px; background: linear-gradient(to right, transparent, #4a3728, transparent);"> </div></div><p class="blog-subtitle" style="font-size: 18px; color: #3a2718; font-style: italic; margin-top: 25px; font-family: 'Georgia', serif; font-weight: 500;">Истории, советы и рекомендации о наших бенгальских кошках</p></div><div id="filters-container" class="filters-container" style="display: flex; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #4a3728; padding-bottom: 25px; margin-bottom: 50px; max-width: 1000px; margin-left: auto; margin-right: auto; justify-content: center; position: relative; z-index: 2;"><button id="filter-all" class="filter-btn" style="background: #1a1a1a; color: #f5e6c8; border: 2px solid #1a1a1a; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; box-shadow: 0 3px 10px rgba(0,0,0,0.3); font-family: 'Georgia', serif; transition: all 0.3s;">Все статьи</button> <button id="filter-ourstory" class="filter-btn" style="background: #f5ebe0; color: #1a1a1a; border: 2px solid #4a3728; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: 'Georgia', serif; transition: all 0.3s;">Наша история</button> <button id="filter-reviews" class="filter-btn" style="background: #f5ebe0; color: #1a1a1a; border: 2px solid #4a3728; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: 'Georgia', serif; transition: all 0.3s;">Обзоры</button> <button id="filter-care" class="filter-btn" style="background: #f5ebe0; color: #1a1a1a; border: 2px solid #4a3728; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: 'Georgia', serif; transition: all 0.3s;">Уход и здоровье</button> <button id="filter-food" class="filter-btn" style="background: #f5ebe0; color: #1a1a1a; border: 2px solid #4a3728; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: 'Georgia', serif; transition: all 0.3s;">Питание</button> <button id="filter-education" class="filter-btn" style="background: #f5ebe0; color: #1a1a1a; border: 2px solid #4a3728; padding: 12px 32px; border-radius: 3px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: 'Georgia', serif; transition: all 0.3s;">Воспитание</button></div><div id="articles-grid" class="articles-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 35px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 2;"><p style="color: #1a1a1a; text-align: center; grid-column: 1 / -1; padding: 60px; font-size: 18px; font-family: 'Georgia', serif; font-style: italic;">Загрузка статей...</p></div></div></div></div><p><script>(function() {
  const categoryColors = {
    'ourstory': '#8b7355',
    'reviews': '#a08060',
    'care': '#6b8e6b',
    'food': '#b8956a',
    'education': '#8b6b8e',
    'default': '#6b8e8e'
  };

  let articlesData = [];

  function getTagName(tag) {
    if (!tag) return '';
    if (typeof tag === 'string') return tag.toLowerCase();
    if (tag.name) return tag.name.toLowerCase();
    if (tag.slug) return tag.slug.toLowerCase();
    return String(tag).toLowerCase();
  }

  function getCategoryFromTags(tags) {
    if (!tags || !Array.isArray(tags) || tags.length === 0) return 'ourstory';
    for (let i = 0; i < tags.length; i++) {
      const tagName = getTagName(tags[i]);
      if (tagName.includes('наша история') || tagName === 'истории' || tagName === 'блог: истории') return 'ourstory';
      if (tagName.includes('обзор') || tagName === 'блог: обзоры') return 'reviews';
      if (tagName.includes('уход') || tagName.includes('здоров') || tagName === 'блог: уход' || tagName === 'блог: здоровье') return 'care';
      if (tagName.includes('питан') || tagName === 'блог: питание') return 'food';
      if (tagName.includes('воспитан') || tagName === 'блог: воспитание') return 'education';
    }
    return 'ourstory';
  }

  function loadArticles() {
    const feedUrl = '/primepride/feed.json';
    fetch(feedUrl)
      .then(function(response) {
        if (!response.ok) throw new Error('Feed not found');
        return response.json();
      })
      .then(function(data) {
        const items = data.items || [];
        articlesData = items.map(function(item, index) {
          const category = getCategoryFromTags(item.tags || []);
          const cleanExcerpt = item.summary ? item.summary.replace(/<[^>]*>/g, '') : '';
          return {
            id: item.id || index,
            category: category,
            title: item.title || 'Без названия',
            excerpt: cleanExcerpt,
            link: item.url || '#',
            color: categoryColors[category] || categoryColors.default
          };
        });
        renderArticles('all');
        setupFilters();
      })
      .catch(function(error) {
        console.error('Ошибка:', error);
        const grid = document.getElementById('articles-grid');
        if (grid) {
          grid.innerHTML = '<p style="color: #1a1a1a; text-align: center; grid-column: 1 / -1; padding: 60px; font-size: 18px; font-family: \'Georgia\', serif; font-style: italic;">Не удалось загрузить статьи</p>';
        }
      });
  }

  function renderArticles(filter) {
    const grid = document.getElementById('articles-grid');
    if (!grid) return;
    const filtered = filter === 'all' ? articlesData : articlesData.filter(function(a) { return a.category === filter; });
    if (filtered.length === 0) {
      grid.innerHTML = '<p style="color: #1a1a1a; text-align: center; grid-column: 1 / -1; padding: 60px; font-size: 18px; font-family: \'Georgia\', serif; font-style: italic;">Статьи не найдены</p>';
      return;
    }
    grid.innerHTML = filtered.map(function(article) {
      const displayExcerpt = article.excerpt.length > 200 ? article.excerpt.substring(0, 200) + '...' : article.excerpt;
      return '<a href="' + article.link + '" class="article-card" style="text-decoration: none; display: block; background: linear-gradient(135deg, #f5e6c8, #e8d5b0); border-radius: 2px; padding: 35px; box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2), inset 0 0 30px rgba(139, 115, 85, 0.1); border: 1px solid #c4a882; transition: all 0.3s; position: relative; overflow: hidden;" onmouseover="this.style.transform=\'translateY(-8px)\'; this.style.boxShadow=\'0 15px 40px rgba(0, 0, 0, 0.3), inset 0 0 30px rgba(139, 115, 85, 0.15)\'; this.style.borderColor=\'#4a3728\';" onmouseout="this.style.transform=\'translateY(0)\'; this.style.boxShadow=\'0 5px 25px rgba(0, 0, 0, 0.2), inset 0 0 30px rgba(139, 115, 85, 0.1)\'; this.style.borderColor=\'#c4a882\';">' +
        '<div style="border-left: 4px solid ' + article.color + '; padding-left: 22px; position: relative;">' +

          renderArticles(key);
        });
      }
    });
