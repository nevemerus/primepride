<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин товаров для кошек - Prime Pride</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .last-updated {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0f0f0;
        }
        
        .product-info {
            padding: 20px;
        }
        
        .product-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .product-price {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .buy-button {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }
        
        .buy-button:hover {
            opacity: 0.9;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }
        
        .error {
            text-align: center;
            color: #ff6b6b;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://nevemerus.github.io/primepride/" class="back-link">← На главную</a>
        
        <h1>🐱 Магазин товаров для кошек</h1>
        <p class="subtitle">Лучшие товары для ваших пушистых друзей</p>
        <p class="last-updated" id="lastUpdated">Загрузка...</p>
        
        <div id="productsContainer" class="products-grid">
            <div class="loading">Загружаем товары...</div>
        </div>
    </div>

    <script>
        // Загружаем товары из products.json
        fetch('data/products.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Не удалось загрузить товары');
                }
                return response.json();
            })
            .then(data => {
                displayProducts(data);
            })
            .catch(error => {
                document.getElementById('productsContainer').innerHTML = 
                    '<div class="error">⚠️ Пока нет доступных товаров. Попробуйте позже!</div>';
                console.error('Ошибка:', error);
            });

        function displayProducts(data) {
            const container = document.getElementById('productsContainer');
            const lastUpdated = document.getElementById('lastUpdated');
            
            // Показываем дату обновления
            if (data.last_updated) {
                const date = new Date(data.last_updated);
                lastUpdated.textContent = `Последнее обновление: ${date.toLocaleDateString('ru-RU')} в ${date.toLocaleTimeString('ru-RU')}`;
            }
            
            // Если товаров нет
            if (!data.products || data.products.length === 0) {
                container.innerHTML = '<div class="error"> Пока нет доступных товаров. Попробуйте позже!</div>';
                return;
            }
            
            // Очищаем контейнер
            container.innerHTML = '';
            
            // Создаём карточки товаров
            data.products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const image = product.picture ? 
                    `<img src="${product.picture}" alt="${product.name}" class="product-image">` :
                    '<div class="product-image" style="display:flex;align-items:center;justify-content:center;color:#999;">Нет фото</div>';
                
                card.innerHTML = `
                    ${image}
                    <div class="product-info">
                        <div class="product-name">${product.name || 'Товар'}</div>
                        <div class="product-price">${product.price ? product.price.toFixed(2) + ' ₽' : 'Цена уточняется'}</div>
                        <a href="${product.url || '#'}" class="buy-button" target="_blank" rel="noopener">
                            Купить →
                        </a>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
