    { id: 30, category: "dry-food", title: "Корм Monge Cat Sterilized сухой 1,5кг", price: 2166, oldPrice: 2500, badges: ["ХИТ!", "ТОП"], image: "img-dryfood-monge-sterilized-1500g.jpg", link: "https://c.gdeslon.ru/cm/2c075b70b30a4434d62cbce17e240f2cfe842d4b/?mid=80549&goto=https%3A%2F%2Fwww.bethowen.ru%2Fcatalogue%2Fcats%2Fkorma%2Fsukhie-korma%2Fkorm-dlya-koshek-monge-cat-sterilized-dlya-sterilizovannykh-koshek%2F&erid=Kra23rpsy" },
    { id: 34, category: "grooming", title: "Пуходёрка «Риф» средняя 10×14 см", price: 188, oldPrice: 250, badges: ["СВОЁ", "ХИТ!"], image: "img-grooming-rif-pushodyorka.jpg", link: "https://c.gdeslon.ru/cm/2c075b70b30a4434d62cbce17e240f2cfe842d4b/?mid=105470&goto=https%3A%2F%2Fwww.sima-land.ru%2F7437898%2Fpuhoderka-rif-srednyaya-10-14-cm-bez-kapel-s-rezinovoy-ruchkoy-chernaya-krasnaya%2F&erid=2SDnjefynZy" },
    { id: 35, category: "toys", title: "Дразнилка-удочка «Гусеница с перьями» 49см", price: 144, oldPrice: 190, badges: ["ХИТ!", "СУПЕР ЦЕНА"], image: "img-toys-gusenica-udochka.jpg", link: "https://c.gdeslon.ru/cm/2c075b70b30a4434d62cbce17e240f2cfe842d4b/?mid=105470&goto=https%3A%2F%2Fwww.sima-land.ru%2F7806302%2Fdraznilka-udochka-gusenica-s-peryami-ruchka-49-cm-golubaya%2F&erid=2SDnjefynZy" }
  ];

  const track = document.getElementById('vitrine-track');
  if (!track) return;

  let popularItems = shopProducts.filter(p => p.badges && p.badges.some(b => b.includes('ХИТ') || b.includes('ТОП') || b.includes('СУПЕР')));
  if (popularItems.length < 6) popularItems = shopProducts.slice(0, 8);

  const marqueeItems = [...popularItems, ...popularItems, ...popularItems];
  const itemWidth = 305;
  const singleSetWidth = popularItems.length * itemWidth;
  let currentPos = 0;
  const speed = 0.8;
  let isPaused = false;

  function createProductCard(item) {
    const card = document.createElement('div');
    card.style.cssText = 'background: white; border-radius: 16px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); border: 1px solid #f0f0f0; display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; min-width: 280px; max-width: 280px; flex-shrink: 0;';
    card.onmouseover = function() { this.style.transform = 'translateY(-5px)'; this.style.boxShadow = '0 15px 40px rgba(0,0,0,0.15)'; };
    card.onmouseout = function() { this.style.transform = 'translateY(0)'; this.style.boxShadow = '0 5px 20px rgba(0,0,0,0.08)'; };

    const imgContainer = document.createElement('div');
    imgContainer.style.cssText = 'width: 100%; height: 200px; background-color: #f8f9fa; border-radius: 12px; margin-bottom: 15px; position: relative; overflow: hidden; background-size: cover; background-position: center;';
    imgContainer.style.backgroundImage = 'url(' + IMG_URL + item.image + ')';

    const badgesDiv = document.createElement('div');
    badgesDiv.style.cssText = 'position: absolute; top: 10px; left: 10px; display: flex; gap: 5px; flex-wrap: wrap;';
    if (item.badges) {
      item.badges.forEach(b => {
        let c = '#ff6b00';
        if (b.includes('СВОЁ')) c = '#4caf50';
        if (b.includes('НОВИНКА')) c = '#00bcd4';
        if (b.includes('ТОП')) c = '#9c27b0';
        if (b.includes('ПРЕМИУМ')) c = '#ff9800';
        if (b.includes('СУПЕР')) c = '#e91e63';
        const badge = document.createElement('span');
        badge.style.cssText = 'background: ' + c + '; color: white; padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: bold;';
        badge.textContent = b;
        badgesDiv.appendChild(badge);

      if (Math.abs(currentPos) >= singleSetWidth) currentPos = 0;
      track.style.transform = 'translateX(' + currentPos + 'px)';
    }
    requestAnimationFrame(animate);
  }
  
  requestAnimationFrame(animate);

  const container = track.parentElement;

  container.addEventListener('mouseleave', () => { isPaused = false; });
})();</script><div style="margin-top: 60px; margin-bottom: 60px; padding: 0 20px;"><div id="filters-container" style="display: flex; gap: 15px; flex-wrap: wrap; border-bottom: 1px solid #e0e0e0; padding-bottom: 15px; margin-bottom: 30px; max-width: 1000px; margin-left: auto; margin-right: auto;"><button id="filter-all" style="background: none; border: none; font-size: 15px; color: #1a1a1a; cursor: pointer; padding: 5px 0; font-weight: bold; border-bottom: 2px solid #1a1a1a;">Все статьи</button> <button id="filter-ourstory" style="background: none; border: none; font-size: 15px; color: #666; cursor: pointer; padding: 5px 0; font-weight: 500;">Наша история</button> <button id="filter-reviews" style="background: none; border: none; font-size: 15px; color: #666; cursor: pointer; padding: 5px 0; font-weight: 500;">Обзоры</button> <button id="filter-care" style="background: none; border: none; font-size: 15px; color: #666; cursor: pointer; padding: 5px 0; font-weight: 500;">Уход и здоровье</button> <button id="filter-food" style="background: none; border: none; font-size: 15px; color: #666; cursor: pointer; padding: 5px 0; font-weight: 500;">Питание</button> <button id="filter-education" style="background: none; border: none; font-size: 15px; color: #666; cursor: pointer; padding: 5px 0; font-weight: 500;">Воспитание</button></div><div id="articles-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; max-width: 1000px; margin: 0 auto;"><p style="color: #999; text-align: center; grid-column: 1 / -1; padding: 40px;">Загрузка статей...</p></div><div style="text-align: center; margin-top: 40px;"><a href="/primepride/blog/" style="color: #ff6b00; font-size: 15px; font-weight: 600; text-decoration: none; border-bottom: 1px solid #ff6b00; padding-bottom: 2px;">Показать все статьи →</a></div></div><script>(function() {
  const categoryColors = {
    'ourstory': '#1abc9c',
    'reviews': '#f1c40f',
    'care': '#27ae60',
    'food': '#e67e22',
    'education': '#9b59b6',
    'default': '#3498db'
  };

  let articlesData = [];

  function getTagName(tag) {
    if (!tag) return '';
    if (typeof tag === 'string') return tag.toLowerCase();
    if (tag.name) return tag.name.toLowerCase();
    if (tag.slug) return tag.slug.toLowerCase();
    return String(tag).toLowerCase();
  }

  function getCategoryFromTags(tags) {
    if (!tags || !Array.isArray(tags) || tags.length === 0) return 'ourstory';
    
    for (let i = 0; i < tags.length; i++) {
      const tagName = getTagName(tags[i]);
      if (tagName.includes('наша история') || tagName === 'истории' || tagName === 'блог: истории') return 'ourstory';
      if (tagName.includes('обзор') || tagName === 'блог: обзоры') return 'reviews';
      if (tagName.includes('уход') || tagName.includes('здоров') || tagName === 'блог: уход' || tagName === 'блог: здоровье') return 'care';
      if (tagName.includes('питан') || tagName === 'блог: питание') return 'food';
      if (tagName.includes('воспитан') || tagName === 'блог: воспитание') return 'education';
    }
    
    return 'ourstory';
  }

  function loadArticles() {
    const feedUrl = '/primepride/feed.json';
    fetch(feedUrl)
      .then(function(response) {
        if (!response.ok) throw new Error('Feed not found: ' + response.status);
        return response.json();
      })
      .then(function(data) {
        const items = data.items || [];
        articlesData = items.map(function(item, index) {
          const category = getCategoryFromTags(item.tags || []);
          const cleanExcerpt = item.summary ? item.summary.replace(/<[^>]*>/g, '') : '';
          return {
            id: item.id || index,
            category: category,
            title: item.title || 'Без названия',
            excerpt: cleanExcerpt,
            link: item.url || '#',
            color: categoryColors[category] || categoryColors.default
          };
        });
        renderArticles('all');
        setupFilters();
      })
      .catch(function(error) {
        console.error('Ошибка загрузки:', error);
        const grid = document.getElementById('articles-grid');
        if (grid) {
          grid.innerHTML = '<p style="color: #999; text-align: center; grid-column: 1 / -1; padding: 40px;">Не удалось загрузить статьи</p>';
        }
      });
  }

  function renderArticles(filter) {
    const grid = document.getElementById('articles-grid');
    if (!grid) return;
    const filtered = filter === 'all' ? articlesData : articlesData.filter(function(a) { return a.category === filter; });
    if (filtered.length === 0) {
      grid.innerHTML = '<p style="color: #999; text-align: center; grid-column: 1 / -1; padding: 40px;">Статьи не найдены</p>';
      return;
    }
    grid.innerHTML = filtered.map(function(article) {
      const displayExcerpt = article.excerpt.length > 150 ? article.excerpt.substring(0, 150) + '...' : article.excerpt;
      return '<a href="' + article.link + '" style="text-decoration: none; display: block; cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform=\'translateX(4px)\'" onmouseout="this.style.transform=\'translateX(0)\'">' +
        '<div style="border-left: 3px solid ' + article.color + '; padding-left: 16px;">' +
        '<h3 style="font-size: 17px; font-weight: 700; margin: 0 0 8px 0; color: #1a1a1a; line-height: 1.3;">' + article.title + '</h3>' +
        '<p style="font-size: 14px; color: #666; line-height: 1.5; margin: 0;">' + displayExcerpt + ' <span style="color: #999; font-size: 13px;">(читать далее)</span></p>' +
        '</div></a>';
    }).join('');
  }

  function setupFilters() {
    const buttons = {
      'all': document.getElementById('filter-all'),
      'ourstory': document.getElementById('filter-ourstory'),
      'reviews': document.getElementById('filter-reviews'),
      'care': document.getElementById('filter-care'),
      'food': document.getElementById('filter-food'),
      'education': document.getElementById('filter-education')
    };
    Object.keys(buttons).forEach(function(key) {
      const btn = buttons[key];
      if (btn) {
        btn.addEventListener('click', function() {
          Object.keys(buttons).forEach(function(k) {
            const b = buttons[k];
            if (b) {
              b.style.color = '#666';
              b.style.fontWeight = '500';
              b.style.borderBottom = 'none';
            }
          });
          btn.style.color = '#1a1a1a';
          btn.style.fontWeight = '700';
          btn.style.borderBottom = '2px solid #1a1a1a';
          renderArticles(key);
        });
      }
    });
  }

  loadArticles();
})();</script></div></div></div></article></main><footer class="footer"><div class="wrapper"><div class="footer__copyright"><p>Powered by Publii</p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://nevemerus.github.io/primepride/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://nevemerus.github.io/primepride/assets/js/scripts.min.js?v&#x3D;548663b90e1600fd2c2dd54433d04b71"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'sidebar',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');

                    this.classList.add('is-loaded');
                }, false);
            }
        }</script></body></html>
