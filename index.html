  const categoryColors = {
    'ourstory': '#1abc9c',
    'reviews': '#f1c40f',
    'care': '#27ae60',
    'food': '#e67e22',
    'education': '#9b59b6',
    'default': '#3498db'
  };

  let articlesData = [];

  function getCategoryFromTags(tags) {
    if (!tags || tags.length === 0) return 'ourstory';
    for (let i = 0; i < tags.length; i++) {
      const tagName = tags[i].name ? tags[i].name.toLowerCase() : String(tags[i]).toLowerCase();
      if (tagName.includes('наша история') || tagName.includes('истори')) return 'ourstory';
      if (tagName.includes('обзор')) return 'reviews';
      if (tagName.includes('уход') || tagName.includes('здоров')) return 'care';
      if (tagName.includes('питан')) return 'food';
      if (tagName.includes('воспитан')) return 'education';
    }
    return 'ourstory';
  }

  function loadArticles() {
    const feedUrl = '/primepride/feed.json';
    fetch(feedUrl)
      .then(function(response) {
        if (!response.ok) throw new Error('Feed not found');
        return response.json();
      })
      .then(function(data) {
        const items = data.items || [];
        console.log('Загружено статей из feed:', items.length);
        articlesData = items.map(function(item, index) {
          const category = getCategoryFromTags(item.tags || []);
          const cleanExcerpt = item.summary ? item.summary.replace(/<[^>]*>/g, '') : '';
          return {
            id: item.id || index,
            category: category,
            title: item.title || 'Без названия',
            excerpt: cleanExcerpt,
            link: item.url || '#',
            color: categoryColors[category] || categoryColors.default
          };
        });
        renderArticles('all');
        setupFilters();
      })
      .catch(function(error) {
        console.error('Ошибка загрузки статей:', error);
        const grid = document.getElementById('articles-grid');
        if (grid) {
          grid.innerHTML = '<p style="color: #888; text-align: center; grid-column: 1 / -1; padding: 40px;">Не удалось загрузить статьи. Откройте консоль (F12) для деталей.</p>';
        }
      });
  }

  function renderArticles(filter) {
    const grid = document.getElementById('articles-grid');
    if (!grid) return;
    const filtered = filter === 'all' ? articlesData : articlesData.filter(function(a) { return a.category === filter; });
    if (filtered.length === 0) {
      grid.innerHTML = '<p style="color: #888; text-align: center; grid-column: 1 / -1; padding: 40px;">Статьи не найдены</p>';
      return;
    }
    grid.innerHTML = filtered.map(function(article) {
      const displayExcerpt = article.excerpt.length > 150 ? article.excerpt.substring(0, 150) + '...' : article.excerpt;
      return '<a href="' + article.link + '" style="text-decoration: none; display: block; cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform=\'translateX(4px)\'" onmouseout="this.style.transform=\'translateX(0)\'">' +
        '<div style="border-left: 3px solid ' + article.color + '; padding-left: 16px;">' +
        '<h3 style="font-size: 17px; font-weight: 700; margin: 0 0 8px 0; color: #ffffff; line-height: 1.3;">' + article.title + '</h3>' +
        '<p style="font-size: 14px; color: #cccccc; line-height: 1.5; margin: 0;">' + displayExcerpt + ' <span style="color: #888888; font-size: 13px;">(читать далее)</span></p>' +
        '</div></a>';
    }).join('');
  }

  function setupFilters() {
    const buttons = {
      'all': document.getElementById('filter-all'),
      'ourstory': document.getElementById('filter-ourstory'),
      'reviews': document.getElementById('filter-reviews'),
      'care': document.getElementById('filter-care'),
      'food': document.getElementById('filter-food'),
      'education': document.getElementById('filter-education')
    };
    Object.keys(buttons).forEach(function(key) {
      const btn = buttons[key];
      if (btn) {
        btn.addEventListener('click', function() {
          Object.keys(buttons).forEach(function(k) {
            const b = buttons[k];
            if (b) {
              b.style.color = '#aaaaaa';
              b.style.fontWeight = '500';
              b.style.borderBottom = 'none';
            }
          });
          btn.style.color = '#ffffff';
          btn.style.fontWeight = '700';
          btn.style.borderBottom = '2px solid #ffffff';
          renderArticles(key);
        });
      }
    });
  }

  loadArticles();
})();</script></div></article></main><footer class="footer"><div class="wrapper"><div class="footer__copyright"><p>Powered by Publii</p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://nevemerus.github.io/primepride/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://nevemerus.github.io/primepride/assets/js/scripts.min.js?v&#x3D;548663b90e1600fd2c2dd54433d04b71"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'sidebar',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
