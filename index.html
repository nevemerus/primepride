  const gradients = [

  if (!track) return;

  const vitrineItems = shopProducts.slice(0, 4);
  const allItems = [...vitrineItems, ...vitrineItems];

  track.innerHTML = allItems.map((item, index) => {
    const grad = gradients[index % gradients.length];

    const image = item.image || '📦';

      if (b.includes('СВОЁ')) color = '#4caf50';
      if (b.includes('НОВИНКА')) color = '#00bcd4';
      if (b.includes('ТОП')) color = '#9c27b0';
      if (b.includes('-') || b.includes('%')) color = '#e91e63';
      return '<span style="background: ' + color + '; color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700;">' + b + '</span>';
    }).join('');

  const totalWidth = itemWidth * originalCount;
  let currentPos = 0;
  const speed = 0.5;

    currentPos -= speed;
    if (Math.abs(currentPos) >= totalWidth) currentPos = 0;
    track.style.transform = 'translateX(' + currentPos + 'px)';
    requestAnimationFrame(animate);
  }
  
  requestAnimationFrame(animate);
