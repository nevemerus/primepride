  function createProductCard(item) {

  const categoryColors = {
    'ourstory': '#ff6b00',
    'reviews': '#000000',
    'care': '#27ae60',
    'food': '#e67e22',
    'education': '#9b59b6',
    'default': '#3498db'
  };

  let articlesData = [];

  function getTagName(tag) {
    if (!tag) return '';
    if (typeof tag === 'string') return tag.toLowerCase();
    if (tag.name) return tag.name.toLowerCase();
    if (tag.slug) return tag.slug.toLowerCase();
    return String(tag).toLowerCase();
  }

  function getCategoryFromTags(tags) {
    if (!tags || !Array.isArray(tags) || tags.length === 0) return 'ourstory';
    
    for (let i = 0; i < tags.length; i++) {
      const tagName = getTagName(tags[i]);
      if (tagName.includes('наша история') || tagName === 'истории' || tagName === 'блог: истории') return 'ourstory';
      if (tagName.includes('обзор') || tagName === 'блог: обзоры') return 'reviews';
      if (tagName.includes('уход') || tagName.includes('здоров') || tagName === 'блог: уход' || tagName === 'блог: здоровье') return 'care';
      if (tagName.includes('питан') || tagName === 'блог: питание') return 'food';
      if (tagName.includes('воспитан') || tagName === 'блог: воспитание') return 'education';
    }
    
    return 'ourstory';
  }

  function loadArticles() {
    const feedUrl = '/primepride/feed.json';
    fetch(feedUrl)
      .then(function(response) {
        if (!response.ok) throw new Error('Feed not found: ' + response.status);
        return response.json();
      })
      .then(function(data) {
        const items = data.items || [];
        articlesData = items.map(function(item, index) {
          const category = getCategoryFromTags(item.tags || []);
          const cleanExcerpt = item.summary ? item.summary.replace(/<[^>]*>/g, '') : '';
          return {
            id: item.id || index,
            category: category,
            title: item.title || 'Без названия',
            excerpt: cleanExcerpt,
            link: item.url || '#',
            color: categoryColors[category] || categoryColors.default
          };
        });
        renderArticles('all');
        setupFilters();
      })
      .catch(function(error) {
        console.error('Ошибка загрузки:', error);
        const grid = document.getElementById('articles-grid');
        if (grid) {
          grid.innerHTML = '<p style="color: #999; text-align: center; grid-column: 1 / -1; padding: 40px;">Не удалось загрузить статьи</p>';
        }
      });
  }

  function renderArticles(filter) {
    const grid = document.getElementById('articles-grid');
    if (!grid) return;
    const filtered = filter === 'all' ? articlesData : articlesData.filter(function(a) { return a.category === filter; });
    if (filtered.length === 0) {
      grid.innerHTML = '<p style="color: #999; text-align: center; grid-column: 1 / -1; padding: 40px; font-size: 18px;">Статьи не найдены 🐾</p>';
      return;
    }
    grid.innerHTML = filtered.map(function(article, idx) {
      const displayExcerpt = article.excerpt.length > 150 ? article.excerpt.substring(0, 150) + '...' : article.excerpt;
      const rot = (idx % 2 === 0) ? -1 : 1;
      return '<a href="' + article.link + '" class="article-card-art" style="transform: rotate(' + rot + 'deg);">' +
        '<div style="border-left: 4px solid ' + article.color + '; padding-left: 16px;">' +
        '<h3 style="font-size: 18px; font-weight: 800; margin: 0 0 10px 0; color: #1a1a1a; line-height: 1.3;">' + article.title + '</h3>' +
        '<p style="font-size: 14px; color: #555; line-height: 1.6; margin: 0;">' + displayExcerpt + ' <span style="color: ' + article.color + '; font-size: 13px; font-weight: 700;">(читать далее →)</span></p>' +
        '</div></a>';
    }).join('');
  }

  function setupFilters() {
    const buttons = {
      'all': document.getElementById('filter-all'),
      'ourstory': document.getElementById('filter-ourstory'),
      'reviews': document.getElementById('filter-reviews'),
      'care': document.getElementById('filter-care'),
      'food': document.getElementById('filter-food'),
      'education': document.getElementById('filter-education')
    };
    Object.keys(buttons).forEach(function(key) {
      const btn = buttons[key];
      if (btn) {
        btn.addEventListener('click', function() {
          Object.keys(buttons).forEach(function(k) {
            const b = buttons[k];
            if (b) {
              b.style.background = '#fff';
              b.style.color = '#000';
              b.style.fontWeight = '600';
              b.classList.remove('active');
            }
          });
          btn.style.background = '#000';
          btn.style.color = '#fff';
          btn.style.fontWeight = '700';
          btn.classList.add('active');
          renderArticles(key);
        });
      }
    });
  }

  loadArticles();
})();</script></p></div></article></main><footer class="footer"><div class="wrapper"><div class="footer__copyright"><p>Powered by Publii</p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://nevemerus.github.io/primepride/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://nevemerus.github.io/primepride/assets/js/scripts.min.js?v&#x3D;548663b90e1600fd2c2dd54433d04b71"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'sidebar',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
