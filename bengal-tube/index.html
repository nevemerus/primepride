        var cat = CATEGORIES.find(function (c) { return c.key === categoryKey; });
        return cat ? cat.label : '🎬 Видео';
    }

    function openModal(v) {
        if (!modal) buildModal();

        currentPlaylist = videoDatabase.filter(function (x) { return match(x); });
        currentVideoIndex = currentPlaylist.findIndex(function (x) { return x.id === v.id; });

        updateModalContent();
        renderPlaylist();

        modal.style.opacity = '1';
        modal.style.pointerEvents = 'auto';
        document.body.style.overflow = 'hidden';
        lastFocus = document.activeElement;

        if (!isTouch) {
            modalClose.style.opacity = '1';
            clearTimeout(hideCloseTimer);
            hideCloseTimer = setTimeout(function () {
                modalClose.style.opacity = '0';
            }, 1200);
        }
    }

    function updateModalContent() {
        if (currentVideoIndex < 0 || currentVideoIndex >= currentPlaylist.length) return;
        var v = currentPlaylist[currentVideoIndex];

        var isShorts = v.type === 'shorts';
        var savedClose = modalClose;
        setInline(modalPlayer, {
            aspectRatio: isShorts ? '9/16' : '16/9',
            maxHeight: isShorts ? '70vh' : 'none',
            margin: isShorts ? '0 auto' : '0',
            borderRadius: isShorts ? '12px' : '0',
            border: isShorts ? '2px solid rgba(255,107,0,.3)' : 'none'
        });

        var videoUrl = v.url;
        if (videoUrl.indexOf('autoplay=') === -1) {
            videoUrl += '&autoplay=1';
        }

        var iframe = document.createElement('iframe');
        iframe.src = videoUrl;
        iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture;');
        iframe.setAttribute('allowfullscreen', '');
        setInline(iframe, { position: 'absolute', inset: '0', width: '100%', height: '100%', border: 'none' });
        modalPlayer.innerHTML = '';
        modalPlayer.appendChild(iframe);
        modalPlayer.appendChild(savedClose);
        currentIframe = iframe;

        var categoryLabel = getCategoryLabel(v.category);
        var typeLabel = v.type === 'shorts' ? '⚡ Shorts' : '🎬 Видео';

        var categoryEl = document.getElementById('bt-modal-category');
        if (categoryEl) {
            categoryEl.innerHTML = '<span style="opacity:0.7;">' + typeLabel + ' · </span><span>' + categoryLabel + '</span>';
        }

        var titleEl = document.getElementById('bt-modal-video-title');
        if (titleEl) {
            titleEl.textContent = v.title;
        }

        var descEl = document.getElementById('bt-modal-video-desc');
        if (descEl) {
            descEl.textContent = v.description;
        }

        var likes = getLikes();
        var isLiked = !!likes[v.id];
        modalLike.innerHTML = '<span style="font-size:16px;">' + (isLiked ? '❤️' : '🤍') + '</span><span>Нравится</span>';
        modalLike.style.background = isLiked ? 'rgba(255,107,0,.4)' : 'rgba(255,107,0,.15)';

        modalPrevBtn.style.display = currentPlaylist.length > 1 ? 'flex' : 'none';
        modalNextBtn.style.display = currentPlaylist.length > 1 ? 'flex' : 'none';

        modalLike.onclick = function () {
            var likes = getLikes();
            if (likes[v.id]) {
                delete likes[v.id];
            } else {
                likes[v.id] = true;
            }
            setLikes(likes);
            updateModalContent();
        };

        modalShare.onclick = function () {
            var shareData = { title: v.title, text: v.description, url: window.location.href };
            if (navigator.share) {
                navigator.share(shareData).catch(function () {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(function () {
                    modalShare.innerHTML = '<span style="font-size:16px;">✅</span><span>Скопировано</span>';
                    setTimeout(function () { modalShare.innerHTML = '<span style="font-size:16px;">🔗</span><span>Поделиться</span>'; }, 2000);
                });
            }
        };

        modalFullscreen.onclick = function () {
            if (modalPlayer.requestFullscreen) modalPlayer.requestFullscreen();
            else if (modalPlayer.webkitRequestFullscreen) modalPlayer.webkitRequestFullscreen();
        };

        modalPrevBtn.onclick = function () { navigateVideo(-1); };
        modalNextBtn.onclick = function () { navigateVideo(1); };

        modalProgressFill.style.width = '0%';
    }

    function navigateVideo(direction) {
        if (currentPlaylist.length <= 1) return;
        currentVideoIndex = (currentVideoIndex + direction + currentPlaylist.length) % currentPlaylist.length;
        updateModalContent();
        renderPlaylist();
        if (!isTouch) showCloseBtn();
    }

    function renderPlaylist() {
        var grid = document.getElementById('bt-playlist-grid');
        if (!grid) return;
        grid.innerHTML = '';

        currentPlaylist.forEach(function (v, idx) {
            if (idx === currentVideoIndex) return;
            var item = document.createElement('div');
            setInline(item, {
                background: 'rgba(255,107,0,.1)', borderRadius: '10px', padding: '10px',
                cursor: 'pointer', transition: 'all .2s ease', border: '1px solid rgba(255,107,0,.2)'
            });
            item.innerHTML = '<div style="font-size:11px;font-weight:600;color:#fff;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(v.title) + '</div><div style="font-size:10px;color:#888;">' + (v.type === 'shorts' ? '⚡ Shorts' : 'Видео') + '</div>';
            item.addEventListener('mouseenter', function () { item.style.background = 'rgba(255,107,0,.25)'; item.style.borderColor = '#ff6b00'; item.style.transform = 'translateY(-2px)'; });
            item.addEventListener('mouseleave', function () { item.style.background = 'rgba(255,107,0,.1)'; item.style.borderColor = 'rgba(255,107,0,.2)'; item.style.transform = 'translateY(0)'; });
            item.addEventListener('click', function () {
                currentVideoIndex = idx;
                updateModalContent();
                renderPlaylist();
            });
            grid.appendChild(item);
        });

        if (grid.children.length === 0) {
            grid.innerHTML = '<div style="color:#666;font-size:12px;text-align:center;padding:16px;">Других видео в этой категории пока нет</div>';
        }
    }

    function closeModal() {
        if (!modal) return;
        modal.style.opacity = '0';
        modal.style.pointerEvents = 'none';
        document.body.style.overflow = '';
        clearTimeout(hideCloseTimer);
        currentIframe = null;
        setTimeout(function () { modalPlayer.innerHTML = ''; modalPlayer.appendChild(modalClose); }, 300);
        if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal && modal.style.pointerEvents === 'auto') closeModal();
        if (e.key === 'ArrowLeft' && modal && modal.style.pointerEvents === 'auto') navigateVideo(-1);
        if (e.key === 'ArrowRight' && modal && modal.style.pointerEvents === 'auto') navigateVideo(1);
    });

    var mq = window.matchMedia('(max-width:768px)');
    function applyModalResponsive() {
        if (!modal) return;
        var content = modal.querySelector('#bt-modal-content');
        if (mq.matches) {
            modal.style.padding = '0';
            modal.style.alignItems = 'flex-start';
            modal.style.background = '#000';
            setInline(content, { maxWidth: '100%', maxHeight: '100vh', borderRadius: '0', border: 'none', height: '100vh', transform: 'translateY(100%)' });
            modalClose.style.opacity = '1';
        } else {
            modal.style.padding = '20px';
            modal.style.alignItems = 'center';
            modal.style.background = 'rgba(0,0,0,.95)';
            setInline(content, { maxWidth: '1100px', maxHeight: '95vh', borderRadius: '20px', border: '1px solid rgba(255,107,0,.2)', height: 'auto', transform: 'scale(1) translateY(0)' });
        }
    }
    if (mq.addEventListener) mq.addEventListener('change', applyModalResponsive);
    else mq.addListener(applyModalResponsive);

    renderGrid();
    applyModalResponsive();
})();</script></p></div></article></main><footer class="footer"><div class="wrapper"><div class="footer__copyright"><p>Powered by Publii</p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://nevemerus.github.io/primepride/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://nevemerus.github.io/primepride/assets/js/scripts.min.js?v&#x3D;548663b90e1600fd2c2dd54433d04b71"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'sidebar',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
