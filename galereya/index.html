<button id="lightbox-prev" class="lightbox-btn" style="position: absolute; left: 30px; top: 50%; transform: translateY(-50%); background: #ff6b00; border: 3px solid #fff; color: white; font-size: 36px; cursor: pointer; z-index: 10003; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 900; box-shadow: 4px 4px 0 #00e5ff; transition: all 0.2s; font-family: inherit; pointer-events: auto;">‹</button> <button id="lightbox-next" class="lightbox-btn" style="position: absolute; right: 30px; top: 50%; transform: translateY(-50%); background: #ff6b00; border: 3px solid #fff; color: white; font-size: 36px; cursor: pointer; z-index: 10003; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 900; box-shadow: 4px 4px 0 #00e5ff; transition: all 0.2s; font-family: inherit; pointer-events: auto;">›</button> <figure class="lightbox-img"><img loading="lazy" id="lightbox-img"  style="max-width: 80%; max-height: 80%; object-fit: contain; border: 5px solid #fff; border-radius: 20px 10px 20px 10px; box-shadow: 15px 15px 0 rgba(255,107,0,0.5); transform: rotate(-1deg); cursor: default; pointer-events: none;" alt="" <button id="lightbox-close" class="lightbox-btn" style="position: absolute; top: 30px; right: 50px; background: #ff6b00; border: 3px solid #fff; color: white; font-size: 30px; cursor: pointer; z-index: 10003; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 900; box-shadow: 4px 4px 0 #00e5ff; transform: rotate(15deg); transition: all 0.2s; font-family: inherit; pointer-events: auto;"></figure>×</button>
<div id="lightbox-counter" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #000; color: #ff6b00; padding: 10px 25px; border-radius: 25px; font-size: 18px; font-weight: 900; border: 2px solid #ff6b00; pointer-events: none;"></div>
</div>
<script>
const albumsData = {
  'businka': {
    name: 'Бусинка',
    count: 7,
    getUrl: (i) => `https://nevemerus.github.io/primepride/galereya-businka%20%28${i+1}%29.jpg`
  },
  'kiri': {
    name: 'Кири',
    count: 7,
    getUrl: (i) => `https://nevemerus.github.io/primepride/galereya-kiri%20%28${i+1}%29.jpg`
  },
  'kotyata': {
    name: 'Котята',
    count: 11,
    getUrl: (i) => `https://nevemerus.github.io/primepride/galereya-kotyata%20%28${i+1}%29.jpg`
  },
  'sirena': {
    name: 'Сирена',
    count: 65,
    getUrl: (i) => {
      const ext = (i === 0) ? 'jpeg' : 'jpg';
      return `https://nevemerus.github.io/primepride/galereya-siri%20%28${i+1}%29.${ext}`;
    }
  }
};

const allPhotos = [];
Object.keys(albumsData).forEach(albumKey => {
  const album = albumsData[albumKey];
  for (let i = 0; i < album.count; i++) {
    allPhotos.push({
      album: albumKey,
      albumName: album.name,
      index: i,
      url: album.getUrl(i)
    });
  }
});

const bestPhotos = [
  { album: 'sirena', index: 0, url: albumsData.sirena.getUrl(0), name: 'Сирена' },
  { album: 'businka', index: 0, url: albumsData.businka.getUrl(0), name: 'Бусинка' },
  { album: 'kotyata', index: 0, url: albumsData.kotyata.getUrl(0), name: 'Котята' },
  { album: 'sirena', index: 10, url: albumsData.sirena.getUrl(10), name: 'Сирена' },
  { album: 'businka', index: 3, url: albumsData.businka.getUrl(3), name: 'Бусинка' },
  { album: 'kotyata', index: 5, url: albumsData.kotyata.getUrl(5), name: 'Котята' },
  { album: 'sirena', index: 25, url: albumsData.sirena.getUrl(25), name: 'Сирена' },
  { album: 'kiri', index: 2, url: albumsData.kiri.getUrl(2), name: 'Кири' }
];

let currentLightboxContext = null;
let currentLightboxAlbum = null;
let currentLightboxIndex = 0;
let currentLightboxList = null;
let isNavigating = false;
const NAVIGATION_DELAY = 600;

function openLightbox(album, index, context) {
  currentLightboxContext = context || 'album';
  currentLightboxAlbum = album;
  currentLightboxIndex = index;

  if (context === 'album') {
    currentLightboxList = [];
    const albumData = albumsData[album];
    for (let i = 0; i < albumData.count; i++) {
      currentLightboxList.push({
        album: album,
        albumName: albumData.name,
        index: i,
        url: albumData.getUrl(i)
      });
    }
  } else if (context === 'popular') {
    currentLightboxList = bestPhotos.map((p, i) => ({
      album: p.album,
      albumName: p.name,
      index: p.index,
      url: p.url
    }));
    currentLightboxIndex = bestPhotos.findIndex(p => p.album === album && p.index === index);
    if (currentLightboxIndex === -1) currentLightboxIndex = 0;
  }

  showCurrentLightboxPhoto();

  const lightbox = document.getElementById('lightbox');
  lightbox.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function showCurrentLightboxPhoto() {
  if (!currentLightboxList || currentLightboxList.length === 0) return;

  const photo = currentLightboxList[currentLightboxIndex];
  const lightboxImg = document.getElementById('lightbox-img');
  const counter = document.getElementById('lightbox-counter');

  lightboxImg.src = photo.url;
  counter.textContent = `${currentLightboxIndex + 1} / ${currentLightboxList.length} — ${photo.albumName}`;
}

function navigateLightbox(direction) {
  if (isNavigating) return;
  if (!currentLightboxList || currentLightboxList.length === 0) return;

  isNavigating = true;
  currentLightboxIndex += direction;

  if (currentLightboxIndex < 0) {
    currentLightboxIndex = currentLightboxList.length - 1;
  } else if (currentLightboxIndex >= currentLightboxList.length) {
    currentLightboxIndex = 0;
  }

  showCurrentLightboxPhoto();

  setTimeout(() => {
    isNavigating = false;
  }, NAVIGATION_DELAY);
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
  const lightbox = document.getElementById('lightbox');
  if (lightbox.style.display === 'flex') {
    if (e.key === 'Escape') {
      closeLightbox();
    } else if (e.key === 'ArrowLeft') {
      navigateLightbox(-1);
    } else if (e.key === 'ArrowRight') {
      navigateLightbox(1);
    }
  }
});

document.addEventListener('DOMContentLoaded', function() {
  const prevBtn = document.getElementById('lightbox-prev');
  const nextBtn = document.getElementById('lightbox-next');
  const closeBtn = document.getElementById('lightbox-close');
  const lightbox = document.getElementById('lightbox');

  if (prevBtn) {
    prevBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      navigateLightbox(-1);
    });
  }

  if (nextBtn) {
    nextBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      navigateLightbox(1);
    });
  }

  if (closeBtn) {
    closeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      closeLightbox();
    });
  }

  if (lightbox) {
    lightbox.addEventListener('click', function(e) {
      if (e.target === this) {
        closeLightbox();
      }
    });
  }

  const viewAlbumButtons = document.querySelectorAll('.view-album-btn');
  viewAlbumButtons.forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const albumKey = this.getAttribute('data-album');
      if (albumKey && albumsData[albumKey]) {
        openLightbox(albumKey, 0, 'album');
      }
    });
  });
});

document.addEventListener('click', function(e) {
  const clickablePhoto = e.target.closest('.clickable-photo');
  if (clickablePhoto) {
    e.preventDefault();
    e.stopPropagation();
    const album = clickablePhoto.getAttribute('data-album');
    const index = parseInt(clickablePhoto.getAttribute('data-index'));
    if (album && !isNaN(index)) {
      openLightbox(album, index, 'album');
    }
    return;
  }
});

(function initMarquee() {
  const track = document.getElementById('gallery-track');
  if (!track) return;

  const marqueePhotos = [...bestPhotos, ...bestPhotos, ...bestPhotos];
  const neonShadows = ['#ff6b00', '#00e5ff', '#ff2d95', '#aaff00', '#bf5fff', '#ffe600'];

  const fragment = document.createDocumentFragment();
  marqueePhotos.forEach((photo, idx) => {
    const div = document.createElement('div');
    const rotation = (idx % 2 === 0) ? -1.5 : 1.2;
    const neonShadow = neonShadows[idx % neonShadows.length];
    // АДАПТИВНАЯ ШИРИНА: min-width для мобильных, max-width для десктопа
    div.className = 'marquee-item';
    div.style.cssText = `flex-shrink: 0; min-width: 280px; width: 70vw; max-width: 350px; height: 250px; border-radius: 20px 10px 20px 10px; overflow: hidden; cursor: pointer; position: relative; border: 4px solid #fff; box-shadow: 6px 6px 0 ${neonShadow}; transform: rotate(${rotation}deg);`;
    div.setAttribute('data-popular-album', photo.album);
    div.setAttribute('data-popular-index', photo.index);
    div.classList.add('popular-photo');
    div.innerHTML = `<img loading="lazy" src="${photo.url}" alt="${photo.name}" style="width: 100%; height: 100%; object-fit: cover; pointer-events: none;"> data-is-external-image="true">`;
    fragment.appendChild(div);
  });
  track.appendChild(fragment);

  track.addEventListener('click', function(e) {
    const popularPhoto = e.target.closest('.popular-photo');
    if (popularPhoto) {
      e.preventDefault();
      e.stopPropagation();
      const album = popularPhoto.getAttribute('data-popular-album');
      const index = parseInt(popularPhoto.getAttribute('data-popular-index'));
      if (album && !isNaN(index)) {
        openLightbox(album, index, 'popular');
      }
    }
  });

  let currentPos = 0;
  const speed = 0.5;
  let isPaused = false;
  const singleSetWidth = bestPhotos.length * 370;

  function animate() {
    if (!isPaused) {
      currentPos -= speed;
      if (Math.abs(currentPos) >= singleSetWidth) currentPos = 0;
      track.style.transform = `translateX(${currentPos}px)`;
    }
    requestAnimationFrame(animate);
  }

  track.parentElement.addEventListener('mouseenter', () => { isPaused = true; });
  track.parentElement.addEventListener('mouseleave', () => { isPaused = false; });

  animate();
})();
</script>
