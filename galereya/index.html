<script>
// Данные альбомов с правильными URL
const albumsData = {
  'businka': {
    name: 'Бусинка',
    count: 7,
    getUrl: (i) => `https://nevemerus.github.io/primepride/galereya-businka%20%28${i+1}%29.jpg`
  },
  'kiri': {
    name: 'Кири',
    count: 7,
    getUrl: (i) => `https://nevemerus.github.io/primepride/galereya-kiri%20%28${i+1}%29.jpg`
  },
  'kotyata': {
    name: 'Котята',
    count: 11,
    getUrl: (i) => `https://nevemerus.github.io/primepride/galereya-kotyata%20%28${i+1}%29.jpg`
  },
  'sirena': {
    name: 'Сирена',
    count: 65,
    getUrl: (i) => {
      const ext = (i === 0) ? 'jpeg' : 'jpg';
      return `https://nevemerus.github.io/primepride/galereya-siri%20%28${i+1}%29.${ext}`;
    }
  }
};

// Создаем массив всех фото для вертикальной ленты
const allPhotos = [];
Object.keys(albumsData).forEach(albumKey => {
  const album = albumsData[albumKey];
  for (let i = 0; i < album.count; i++) {
    allPhotos.push({
      album: albumKey,
      albumName: album.name,
      index: i,
      url: album.getUrl(i)
    });
  }
});

// Перемешиваем фото для интересной ленты
function shuffleArray(array) {
  const newArray = [...array];
  for (let i = newArray.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
  }
  return newArray;
}

const shuffledPhotos = shuffleArray(allPhotos);

// Инициализация бегущей строки с лучшими фото
(function initMarquee() {
  const track = document.getElementById('gallery-track');
  if (!track) return;
  
  // Выбираем лучшие фото (первое из каждого альбома + случайные)
  const bestPhotos = [
    { album: 'sirena', index: 0, url: albumsData.sirena.getUrl(0), name: 'Сирена' },
    { album: 'businka', index: 0, url: albumsData.businka.getUrl(0), name: 'Бусинка' },
    { album: 'kotyata', index: 0, url: albumsData.kotyata.getUrl(0), name: 'Котята' },
    { album: 'sirena', index: 10, url: albumsData.sirena.getUrl(10), name: 'Сирена' },
    { album: 'businka', index: 3, url: albumsData.businka.getUrl(3), name: 'Бусинка' },
    { album: 'kotyata', index: 5, url: albumsData.kotyata.getUrl(5), name: 'Котята' },
    { album: 'sirena', index: 25, url: albumsData.sirena.getUrl(25), name: 'Сирена' },
    { album: 'kiri', index: 2, url: albumsData.kiri.getUrl(2), name: 'Кири' }
  ];
  
  // Дублируем для бесконечной прокрутки
  const marqueePhotos = [...bestPhotos, ...bestPhotos, ...bestPhotos];
  
  const fragment = document.createDocumentFragment();
  marqueePhotos.forEach(photo => {
    const div = document.createElement('div');
    div.style.cssText = 'flex-shrink: 0; width: 350px; height: 250px; border-radius: 12px; overflow: hidden; cursor: pointer; position: relative;';
    div.onclick = (e) => { e.stopPropagation(); openLightbox(photo.album, photo.index); };
    div.innerHTML = `<img loading="lazy" src="${photo.url}" alt="${photo.name}" style="width: 100%; height: 100%; object-fit: cover;"> data-is-external-image="true">`;
    fragment.appendChild(div);
  });
  track.appendChild(fragment);
  
  // Анимация
  let currentPos = 0;
  const speed = 0.5;
  let isPaused = false;
  const singleSetWidth = bestPhotos.length * 370; // 350 + 20 gap
  
  function animate() {
    if (!isPaused) {
      currentPos -= speed;
      if (Math.abs(currentPos) >= singleSetWidth) currentPos = 0;
      track.style.transform = `translateX(${currentPos}px)`;
    }
    requestAnimationFrame(animate);
  }
  
  track.parentElement.addEventListener('mouseenter', () => { isPaused = true; });
  track.parentElement.addEventListener('mouseleave', () => { isPaused = false; });
  
  animate();
})();

// Открытие lightbox
function openLightbox(album, index) {
  const albumData = albumsData[album];
  if (!albumData) {
    console.error('Album not found:', album);
    return;
  }
  const url = albumData.getUrl(index);
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  
  lightboxImg.src = url;
  lightbox.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

// Закрытие lightbox
function closeLightbox(event) {
  if (event) {
    event.stopPropagation();
  }
  const lightbox = document.getElementById('lightbox');
  lightbox.style.display = 'none';
  document.body.style.overflow = '';
}

// Прокрутка к галерее альбома
function scrollToAlbumGallery(albumKey) {
  const gallery = document.getElementById(`album-${albumKey}-gallery`);
  const section = document.querySelector(`[data-album="${albumKey}"]`);
  
  // Показываем галерею если скрыта
  if (gallery.style.display === 'none' || gallery.style.display === '') {
    gallery.style.display = 'grid';
    gallery.style.gridTemplateColumns = 'repeat(auto-fill, minmax(250px, 1fr))';
    gallery.style.gap = '15px';
    loadAlbumPhotos(albumKey);
  }
  
  // Прокручиваем
  setTimeout(() => {
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

// Загрузка фото альбома
function loadAlbumPhotos(albumKey) {
  const gallery = document.getElementById(`album-${albumKey}-gallery`);
  const album = albumsData[albumKey];
  
  for (let i = 0; i < album.count; i++) {
    const div = document.createElement('div');
    div.style.cssText = 'border-radius: 12px; overflow: hidden; cursor: pointer; aspect-ratio: 4/3;';
    div.onclick = (e) => { e.stopPropagation(); openLightbox(albumKey, i); };
    div.innerHTML = `<img src="${album.getUrl(i)}" alt="${album.name}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" data-is-external-image="true">`;
    gallery.appendChild(div);
  }
}

// Вертикальная бесконечная лента
let loadedPhotosCount = 0;
const photosPerLoad = 5;
let isLoading = false;

function loadAllPhotos() {
  if (isLoading || loadedPhotosCount >= shuffledPhotos.length) return;
  
  isLoading = true;
  document.getElementById('loading-indicator').style.display = 'block';
  
  const container = document.getElementById('all-photos-container');
  const end = Math.min(loadedPhotosCount + photosPerLoad, shuffledPhotos.length);
  
  setTimeout(() => {
    for (let i = loadedPhotosCount; i < end; i++) {
      const photo = shuffledPhotos[i];
      const div = document.createElement('div');
      div.style.cssText = 'border-radius: 12px; overflow: hidden; cursor: pointer; aspect-ratio: 4/3; position: relative; width: 100%;';
      div.onclick = (e) => { e.stopPropagation(); openLightbox(photo.album, photo.index); };
      div.innerHTML = `
        <img src="${photo.url}" alt="${photo.albumName}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'" data-is-external-image="true">
        <div style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding: 30px 15px 15px; color: white; font-size: 14px; font-weight: 600;">${photo.albumName}</div>
      `;
      container.appendChild(div);
    }
    
    loadedPhotosCount = end;
    isLoading = false;
    document.getElementById('loading-indicator').style.display = 'none';
  }, 300);
}

// Intersection Observer для бесконечной прокрутки
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      loadAllPhotos();
    }
  });
}, { rootMargin: '300px' });

observer.observe(document.getElementById('all-photos-container'));
